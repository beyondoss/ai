title = "OpenAI's \"Request too large\" TPM 429 was rewritten to \"retry later\""
impact = "A request larger than the organization's tokens-per-minute limit can never be admitted: OpenAI says \"The input or output tokens must be reduced in order to run successfully\". Because the message also names Beyond's org id and links its rate-limits page (a provider-account remedy, D174), the gateway replaced it with \"The provider is rate-limited upstream; retry later.\", which tells the client the opposite of what to do. A client (and the catalog sweep's CAT-3 cells) retried the same 429 until it gave up."
confidence = "high"
evidence = "direct to OpenAI 2026-10-01, Chat Completions gpt-4.1 with the CAT-3 over-limit prompt (1,101,954 words): 429 in 2.1s, type tokens, code rate_limit_exceeded, \"Request too large for gpt-4.1 (for limit gpt-4.1-long-context) in organization org-... on tokens per min (TPM): Limit 1000000, Requested 1101959. The input or output tokens must be reduced in order to run successfully. Visit https://platform.openai.com/account/rate-limits to learn more.\", no Retry-After. Through the gateway the message read \"The provider is rate-limited upstream; retry later.\" (remedy::neutralize: platform.openai.com/account is in REMEDIES, and every non-unfunded 429 became RATE_LIMITED)."
claims = ["T6"]
state = "fixed"
test = "a_request_over_the_tpm_limit_is_told_to_shrink_not_to_retry"
fix = "90ac266"
note = "Fixed in remedy.rs: a 429 whose message carries a remedy and says the request alone is over the limit (\"request too large\", \"must be reduced in order to run successfully\") reads remedy::TOO_LARGE, \"The request is larger than the provider's per-minute token limit admits; reduce the input or output tokens. Retrying it unchanged will not succeed.\"; the org id and link still go, and status, type and code are kept. A plain rate limit (\"Rate limit reached ... Please try again in 2s\") still reads RATE_LIMITED. Not changed: the status stays 429, so a stock SDK still retries it twice (the gateway relays the provider's status verbatim and has no x-should-retry of its own to send at end of body)."

[[defect]]
