[workspace]
members = ["crates/*"]
# Edition-2024 members want the v3 feature resolver; a virtual workspace doesn't inherit it from a
# member, so it's declared here explicitly.
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
# Floor set by `process-wrap` (a transitive dep of `rmcp`'s `transport-child-process` feature,
# crates/agent's MCP client), which declares `rust-version = "1.87.0"` — bumped from 1.85 so this
# field stays an honest promise rather than one only crates/agent's own dependency tree violates.
rust-version = "1.87"

# Lints live at the workspace level so every crate root in the tree inherits them via
# `[lints] workspace = true`. That matters: a crate-level `#![deny(...)]` attribute only covers the
# unit it's written in, so a binary root (`main.rs`) would otherwise escape the library's denies.
# Declaring them here closes that gap structurally, for every member.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

# Panic surface: a stray `.unwrap()`/`.expect()`/`panic!`/`todo!` in a request or agent-loop path is
# a worker crash, not an error response. Deny them so a new one is a hard CI failure (clippy runs with
# `-D warnings`). These are clippy *restriction* lints (allow-by-default); naming them here turns them
# on. Genuine boot-time invariants carry a local `#[allow(clippy::expect_used)]` with a SAFETY note;
# test/bench targets allow them wholesale (asserting a precondition with `.unwrap()` is the point).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# Release builds wrap arithmetic silently by default; turn that into a panic so an overflow on a
# size/count never goes unnoticed. Profiles only take effect at the workspace root.
[profile.release]
overflow-checks = true
# Size + speed (no runtime cost): `strip` drops debug symbols (also shrinks the Docker image, which
# builds with this profile); `lto = "thin"` and `codegen-units = 1` optimize across the whole crate
# graph and typically *improve* throughput too — so they fit "performance is a feature", not against
# it. The price is slower release builds. `opt-level` stays at 3; `opt-level = "z"/"s"` and
# `panic = "abort"` are deliberately avoided — they'd hurt a throughput-sensitive proxy / change
# worker-panic isolation.
strip = true
lto = "thin"
codegen-units = 1

# Shared dependency versions. Members opt in with `<dep>.workspace = true`, so the version is pinned
# once for the whole tree. Only deps used (or expected to be used) by more than one crate live here;
# crate-specific deps stay in that crate's manifest.
[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
# Stream combinators for the agent loop's streaming transport (`BoxStream<StreamEvent>`).
futures = "0.3"
# Runtime-agnostic timer for the transport's retry backoff — keeps the core free of a bound executor
# (the library pulls in no runtime; see agent-core's manifest note).
futures-timer = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# `CancellationToken` for cooperative run/turn/tool abort. A standalone sync primitive — no runtime is
# entered to construct or await it — so the core stays executor-agnostic.
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
