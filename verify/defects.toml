confidence = "high"
evidence = "Hermetic: control::tests::split_weights_near_u32_max_never_overflow. parse_split accepted any u32 weight, and permute with [1, u32::MAX] or [2^31, 2^31] reached acc += w past u32::MAX (control.rs, the split arm of permute)."
claims = ["R3", "CAT-12"]
state = "fixed"
test = "split_weights_near_u32_max_never_overflow"
fix = "208b48f"
note = "Fixed in control.rs: a weight above MAX_SPLIT_WEIGHT = u32::MAX / MAX_CANDIDATES makes the header malformed (counted on ai_control_header_errors_total, the default walk serves), derived so the sum of the at most MAX_CANDIDATES weights a walk adds always fits a u32; the pick accumulates with saturating_add as well, so weights handed to permute directly cannot panic either. The test runs 512 seeds each of [1, u32::MAX], [2^31, 2^31] and [u32::MAX, u32::MAX] through permute, and checks the parse bound on both sides."

