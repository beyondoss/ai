# Suspected and confirmed defects. Found by five read-only code audits on 2026-10-01 (billing,
# security, reliability, translation, catalog/contract) against main b10ed8b.
#
# state      suspected   found by reading code; no reproduction yet
#            reproduced  `test` asserts the correct behavior, is #[ignore]d, and FAILS today
#            fixed       `test` passes and is no longer ignored; `fix` names the commit
#            refuted     `test` passes: the behavior was already correct; `note` says why
#            accepted    a written decision keeps the behavior; `test` asserts it as documented
# The gate enforces each state against the test results, so the file cannot drift from the code.

[[defect]]
id = "D01"
severity = "critical"
area = "Security"
title = "Managed /{provider}/… forwards any path and method on the shared pool key"
impact = "Any tenant can list, read and DELETE other tenants' OpenAI files, stored responses, stored completions and batches. Batches, files, fine-tuning and images run unmetered, and every GET poll of a stored response writes a new full billing row."
confidence = "high"
evidence = "proxy.rs:1700-1713, 3086-3111"
claims = ["SEC-1"]
state = "fixed"
test = "a_managed_key_reaches_only_generation_endpoints_on_a_provider_route"
fix = "5fb2c3a"
note = "Fixed directly, without a reproduction step, by the managed endpoint allowlist."

[[defect]]
id = "D02"
severity = "critical"
area = "Security"
title = "Catalog paths accept any HTTP method"
impact = "GET /auto/v1/chat/completions reaches OpenAI as 'list stored chat completions' for the whole pool-key project. The response can also be cached under the caller's key."
confidence = "med-high"
evidence = "proxy.rs:2115-2140; cache.rs key()"
claims = ["SEC-2"]
state = "fixed"
test = "catalog_paths_take_post_only_from_a_managed_key"
fix = "5fb2c3a"
note = "Fixed directly, without a reproduction step: catalog paths are POST-only for managed keys."

[[defect]]
id = "D03"
severity = "high"
area = "Security"
title = "A ?key= virtual key is forwarded upstream and logged"
impact = "On /{provider}/… the bai_ key goes to the provider in the URL. Pingora's 'Fail to proxy' error line prints it, along with BYO Google keys."
confidence = "high"
evidence = "proxy.rs:1001, 1704-1712; pingora request_summary"
claims = ["SEC-3", "SEC-4"]
state = "fixed"
test = "a_managed_query_key_is_not_forwarded_upstream"
fix = "793d6f6"
note = "Managed ?key= is stripped from the forwarded path (other params kept); request_summary logs the path without its query."

[[defect]]
id = "D04"
severity = "high"
area = "Security"
title = "Client org, project and beta headers ride on Beyond's pool key"
impact = "openai-project and openai-organization can switch the project or org on our key. anthropic-beta can turn on premium pricing, MCP or code execution. SDK users with OPENAI_ORG_ID set get a 401."
confidence = "med-high"
evidence = "upstream_request_filter strips only auth and control headers"
claims = ["SEC-6"]
state = "fixed"
test = "managed_requests_forward_only_allowlisted_client_headers"
fix = "d7ee34e"
note = "Managed requests forward only an allowlist of client headers; anthropic-beta is filtered to known-safe tokens (ARCHITECTURE.md lists them). BYO untouched."

[[defect]]
id = "D05"
severity = "high"
area = "Billing"
title = "Provider-routed usage is parsed by provider dialect, not path"
impact = "/openrouter/api/v1/messages bills zero (non-stream) or all-zero tokens with no flag (stream). /anthropic/v1/chat/completions bills zero."
confidence = "high"
evidence = "proxy.rs:2416"
claims = ["BIL-1"]
state = "fixed"
test = "openrouter_messages_path_is_metered_with_the_anthropic_extractor"
fix = "e2a582a"
note = "Fixed: on /{provider}/... the dialect, and stream_options eligibility, come from the forwarded path (route::Endpoint::of_upstream_path, a sub-resource reading as its parent), as a catalog walk takes them from the serving candidate's path. Both reproductions bill 13/7 exact."

[[defect]]
id = "D06"
severity = "high"
area = "Billing"
title = "Clients can turn off exact metering"
impact = "Sending stream_options:{include_usage:false} skips usage injection, so the stream bills a low estimate that can't see hidden reasoning tokens."
confidence = "high"
evidence = "peek.rs:309-312, 526"
claims = ["BIL-2"]
state = "fixed"
test = "a_client_cannot_turn_off_exact_stream_metering"
fix = "de0c840"
note = "Fixed: scan_buffered also locates a client-sent stream_options value on a stream; force_include_usage rewrites include_usage:false to true or adds it (or replaces a non-object value), shifting the model span when it follows. The client may see one extra usage chunk (choices: [])."

[[defect]]
id = "D07"
severity = "high"
area = "Billing"
title = "Cancels before the response head, and non-stream cut-offs, bill zero"
impact = "A long o-series or long-prompt call the client cancels before headers costs us full price and bills 0. The same happens to a half-delivered non-stream body."
confidence = "high"
evidence = "proxy.rs:3797-3812"
claims = ["BIL-3"]
state = "fixed"
test = "a_cancel_before_the_response_head_is_billed_an_estimate"
fix = "d7b951e"
note = "Fixed: a cancel before the response head after body_delivered (connected, client body read to its end, no upstream write error) bills input from the tally, output 0; a non-stream 2xx cut off bills input from the tally and output from the string values in the relayed tail. Both usage_estimated=true; requests that never reached a provider stay unbilled. Upstream-side failures before the head (read timeout, reset) are outcome=upstream_error and stay unbilled."

[[defect]]
id = "D08"
severity = "high"
area = "Billing"
title = "AI_LOG=warn silently drops every billing row"
impact = "The log filter covers the ai.usage layer too, and stdout write errors are ignored."
confidence = "high"
evidence = "main.rs:73, 104-109"
claims = ["BIL-4"]
state = "fixed"
test = "ai_log_warn_still_emits_usage_rows"
fix = "1f91590"
note = "Fixed: ai.usage has its own fmt layer with no level filter; AI_LOG filters the diagnostic and payload layers only. A failed stdout write is counted on ai_usage_write_errors_total and reported on stderr."

[[defect]]
id = "D09"
severity = "high"
area = "Billing"
title = "Large-body requests retry after the provider already has them"
impact = "A read timeout after the body was sent triggers a re-run on the same candidate, then the next. That means duplicate generation and spend, plus waits up to 2×600s."
confidence = "high"
evidence = "proxy.rs:3610-3626, 870-889"
claims = ["BIL-14", "REL-21"]
state = "fixed"
test = "a_large_body_is_not_resent_to_a_candidate_that_received_it"
fix = "4836699"
note = "Fixed: error_while_proxy resends (pingora's reused-connection retry, or the FullBody reset retry) only when body_delivered is false; otherwise the walk ends with a JSON 504 (read timeout) or 502 from a new fail_to_proxy. The reproduction's assertion was tightened from (1, 1) to (1, 0) plus a JSON 504: the decided policy forbids failing over a delivered body too. large_bodies::a_reset_before_the_header_is_retried_from_the_held_body and cancellation::a_reused_connection_failure_is_retried_and_the_body_survives encoded the old resend (their mock drains the body before closing) and now assert no resend and a JSON 502."

[[defect]]
id = "D10"
severity = "high"
area = "Reliability"
title = "A bad pool key on one candidate black-holes the whole row"
impact = "A fast 401/403 counts as a healthy, fast sample. The ranker promotes it, and nothing fails over on a 4xx."
confidence = "high"
evidence = "proxy.rs:3394, 3741"
claims = ["REL-4"]
state = "reproduced"
test = "a_401_candidate_does_not_black_hole_the_row"
fix = ""
note = "Row gpt-4o-mini, openai mock 401 (fast), openrouter 200 (+30ms), 30 distinct tenants: 1/30 succeed (only the seq-8 probe reached openrouter; EWMA then ranks the 1ms 401 healthy and first again). A single key fares better only because the probe's 2xx pins it to the fallback."

[[defect]]
id = "D11"
severity = "high"
area = "Reliability"
title = "/readyz says ok while every managed request gets 402"
impact = "Allowance fails closed until seeded, but readyz only checks the deny watcher. New pods, or NATS down at boot, black-hole managed traffic."
confidence = "high"
evidence = "admin.rs:136-145; proxy.rs:1969"
claims = ["REL-5"]
state = "reproduced"
test = "readyz_is_not_ready_while_allowance_is_unseeded"
fix = ""
note = "Also: readyz never consults ai_allowance_ready, so nothing alerts while managed traffic is refused. NATS down at boot: managed request gets 402 'allowance unavailable' while /readyz answers 200 {\"status\":\"degraded\"}. Not hermetically reached: NATS up but allowance not yet seeded, where the body would be 'ok'."

[[defect]]
id = "D12"
severity = "high"
area = "Contract"
title = "A stock responses.create() returns 400 on every non-GPT row"
impact = "Omitting store counts as session state, so the default call from Vercel openai() or the Agents SDK fails on Claude, DeepSeek and the rest. /v1/models still advertises /v1/responses for those rows."
confidence = "high"
evidence = "translate.rs:1967-1986; proxy.rs:2232-2252"
claims = ["TRN-1", "CAT-9"]
state = "fixed"
test = "stock_responses_create_without_store_works_on_a_claude_row"
fix = "d9c8436"
note = "An omitted (or null) Responses store is a one-shot on rows with no Responses arm and translates (responses_session_field takes the row's arm); explicit store:true and previous_response_id still 400 naming the field, and GPT rows still relay to their Responses arm."

[[defect]]
id = "D13"
severity = "high"
area = "Translation"
title = "Zero-argument tool calls stream arguments:\"\""
