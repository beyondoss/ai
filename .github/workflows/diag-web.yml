name: diag-web
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: uname -a; nproc; cat /sys/kernel/mm/transparent_hugepage/enabled; ldd --version | head -1
      - run: cargo nextest run -p beyond-agent --locked --test it --no-run
      - name: loop under load
        run: |
          sudo apt-get install -y stress-ng >/dev/null
          sudo dmesg -C || true
          stress-ng --cpu 4 --vm 2 --vm-bytes 1G -t 600s >/dev/null 2>&1 &
          fails=0
          for i in $(seq 1 300); do
            if ! cargo nextest run -p beyond-agent --locked --test it -E 'test(web_keeps_the_runtime_responsive)' --retries 0 >out.txt 2>&1; then
              fails=$((fails+1)); grep -E "SIGSYS|worst unresp" out.txt | head -3
            fi
          done
          echo "FAILS=$fails/300"
          sudo dmesg | grep -iE "seccomp|1326" | tail -20 || true
