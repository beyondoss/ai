[[defect]]
id = "D160"
severity = "med"
area = "Reliability"
title = "Upstream H2 never multiplexes: every concurrent request opens its own TLS connection to the provider"
impact = "ARCHITECTURE.md and config.rs say a provider that offers h2 is reached over a multiplexed connection (fewer sockets and TLS handshakes from our egress IPs). Pingora's PeerOptions::max_h2_streams defaults to 1, and build_peer never set it, so each H2 connection carried one stream at a time and N concurrent requests opened N TLS connections: a handshake per concurrent request, and as many sockets per provider as requests in flight."
confidence = "high"
evidence = "live 2026-10-01 crates/verify/tests/live.rs REL-22::raw::{gpt,claude}::h2_burst on 65fbe67: 24 concurrent streams through the gateway to OpenAI (gpt-5-mini) and Anthropic (claude-haiku-4-5), all served; ss -tnp counted 24 established :443 connections from the gateway's pid at peak, for 24 in flight. Hermetic: concurrent_requests_share_an_upstream_h2_connection, 32 concurrent requests to a TLS H2 mock opened 31 new connections beside the warm one."
claims = ["REL-22"]
state = "fixed"
test = "concurrent_requests_share_an_upstream_h2_connection"
fix = "678f398"
note = "Found by the REL-22 live cell written to close its coverage gap. Fixed: build_peer sets max_h2_streams = UPSTREAM_H2_MAX_STREAMS (100, RFC 9113's recommended floor; the provider's SETTINGS_MAX_CONCURRENT_STREAMS still caps it). Live after: the same 24-stream burst holds 1 connection to OpenAI and 2 to Anthropic. Requests that arrive in the same instant can still each open one before the first is back in pingora's pool with room (hermetic: 0-10 of 32), so the test bounds sharing at half. GOAWAY and refused streams on a shared connection were already handled (D72)."

[[defect]]
id = "D174"
severity = "low"
area = "Security"
title = "A provider-account remedy (OpenRouter's \"add your own key\") reaches the client"
impact = "OpenRouter's shared-pool 429 tells the caller to \"add your own key to accumulate your rate limits: https://openrouter.ai/settings/integrations\", with metadata is_byok, limit_source upstream_provider_shared_pool and remedy_hint. A gateway client holds no OpenRouter account and cannot act on it, and the text names OpenRouter as the upstream behind the row and describes Beyond's account with it. It reached Chat clients byte for byte (the /openrouter route and a same-endpoint catalog walk) and Messages clients translated, where the gateway quotes metadata.raw after the message, so the remedy appeared twice. Other providers' account remedies (OpenAI's \"check your plan and billing details\", Anthropic's \"credit balance is too low\", xAI's spending limit) reveal Beyond's account state the same way."
confidence = "high"
evidence = "Seen live in the 2026-10-01 catalog sweep (D156: 31 shared-pool 429s relayed with the remedy). Hermetic: a_provider_account_remedy_never_reaches_the_client, a mock OpenRouter 429 with that body: /openrouter/v1/chat/completions and /v1/chat/completions relay it verbatim, /v1/messages answers \"... add your own key ... https://openrouter.ai/settings/integrations (Mistral): ... add your own key ...\"."
claims = ["T6"]
state = "fixed"
test = "a_provider_account_remedy_never_reaches_the_client"
fix = "a8f0853"
note = "Severity low, area Security: an information disclosure (the upstream vendor and Beyond's account state with it), and advice a client cannot follow; no credential, no tenant data and no billing is involved, and the status, type and Retry-After the client acts on were already right. Owner decision 2026-10-01: provider errors stay verbatim except provider-account remedies, which are rewritten to a neutral message. No existing claim covers upstream non-disclosure in errors (SEC-7 is the pool key only), so this is filed on T6, the error-envelope claim, whose oracle is the provider's message. Fixed in the pool-key scrub, the one existing rewrite of a managed error body (proxy.rs Redact): a managed JSON error (status >= 400, <= 64 KiB) is held whole, its key masked, then remedy::neutralize rewrites a message, a string error or OpenRouter's metadata.raw that carries a provider-account remedy to a neutral message (raw is removed rather than rewritten): \"The provider is rate-limited upstream; retry later.\" on a rate limit, and since D180 \"The provider cannot serve this request right now; retry later or use another model.\" on an out-of-credit answer or a remedy on any other status, so a billing error never claims to be a rate limit, and drops metadata is_byok, limit_source and remedy_hint; status, type, code, param, provider_name and Retry-After are kept. The phrases: OpenRouter \"add your own key\", openrouter.ai/settings; OpenAI (and Gemini) \"check your plan and billing details\", platform.openai.com/account; Anthropic \"credit balance is too low\", anthropic.com/contact-sales, console.anthropic.com/settings; xAI \"purchase more credits\", \"raise your spending limit\", console.x.ai; Groq console.groq.com/settings; DeepSeek \"insufficient balance\". Context overflows, bad parameters, content-policy refusals and plain rate limits carry none of them and are relayed as sent (remedy::tests::client_actionable_errors_are_kept). BYO errors are not rewritten (the caller's own account). Cost: error path only; a 2xx is never held or parsed, and only a managed JSON error loses its Content-Length. Not covered: an SSE error, an error inside a 2xx stream, a non-JSON body."

[[defect]]
id = "D180"
severity = "med"
area = "Reliability"
title = "An out-of-credit pool key is not a candidate refusal: every request goes to it and fails"
impact = "D84 makes a managed walk's 402 a candidate refusal that fails over, but a provider can say \"unfunded\" under another status: Anthropic's credit-balance 400 (invalid_request_error) and OpenAI's insufficient_quota 429. The walk decides on the response head, so it relays them (the 429 after a key walk) and the row's next candidate, holding a different key at a different vendor, is never tried. Every request on the row fails until someone tops up the account: the black-holed row REL-4 says a bad pool key cannot cause."
confidence = "high"
evidence = "Hermetic: an_unfunded_pool_key_sends_later_requests_to_the_next_candidate. With x-beyond-order anthropic,openrouter on claude-opus-4-8, an Anthropic mock answering the credit-balance 400 is sent all three requests and all three relay the 400; the same with OpenAI's insufficient_quota 429 on gpt-4o-mini. ARCHITECTURE.md already named the 429 case as undetected (\"the walk decides on the response head\")."
claims = ["REL-4"]
state = "fixed"
test = "an_unfunded_pool_key_sends_later_requests_to_the_next_candidate"
fix = "f0472f6"
note = "Found while fixing D174 (asked whether billing statuses fail over). Failing over the same request would need the body before the head is relayed, which pingora's relay does not give (the head reaches the client before the first body chunk is read), and a FullBody re-run abandons an attempt at its head too. Fixed for later requests: Redact reads the body (remedy::Neutralized::unfunded: an UNFUNDED phrase, or OpenAI's insufficient_quota code or type) and logging cools the key as a 401 is cooled (Provider::mark_key_bad, ai_key_auth_failures_total, warn \"pool key is out of credit; cooling it\"); a catalog walk leaves out every candidate whose provider has all its keys cooling (Provider::cooling) while another candidate can take the request, so for KEY_COOLDOWN (60 s) the row is served by its next candidate; when nothing else can, the cooled provider is tried and its answer relayed. The first request is relayed with \"The provider cannot serve this request right now; retry later or use another model.\" (D174), status and type kept. The skip also applies to a provider whose keys all drew a 401 (a_401_on_every_candidate_is_relayed_and_opens_no_breaker now expects the second request to skip it). Limits: the request that saw the answer is not failed over; a provider with several keys all out of credit is cooled one key per relayed answer."

[[defect]]
id = "D175"
severity = "high"
area = "Translation"
title = "The AI SDK's default Responses conversation loses the assistant's turns on every row without a Responses arm"
impact = "The Vercel AI SDK's default OpenAI model (openai(model), the Responses API) sends no store, so it takes OpenAI to be keeping every response: a conversation continued the documented way (messages.push(...result.response.messages)) sends each earlier assistant answer, and any reasoning item, as an item_reference to the id the gateway returned. On a row with no Responses arm (Claude, Bedrock, OpenRouter, Together, ...) the translation drops item_reference (D95), so the model answers turn 2 without its own turn 1: two user turns, merged into one user message, and a confident answer to a conversation it never saw (the outcome D128 refused for conversation). On grok rows the item is relayed to xAI, which answers 422 \"unknown item type item_reference\"; a streamText tool loop whose first step carried a reasoning or text item dies there with an empty answer."
confidence = "high"
evidence = "live 2026-10-01, @ai-sdk/openai 4.0.83 + ai 7.0.126, E3+B1::ai-sdk::{claude,bedrock,together,openrouter,failover}::ai_sdk_conversation: turn 2's input is [user, item_reference, user] with no store; asked to repeat the number it replied in turn 1 or say NO-REPLY if it sees no reply of its own, claude-haiku-4-5 (Anthropic, Bedrock, OpenRouter) and claude-sonnet-4 (OpenRouter) answered \"KESTREL-xxxx NO-REPLY\"; Together llama-3.3-70b invented another number (7293 -> 7429). The upstream Messages body (hermetic) is one user message holding both user texts. The same conversation passes on gpt (relayed to OpenAI's Responses arm, which resolves the reference) and passes with providerOptions.openai.store = false on Claude (the SDK then sends the assistant text). xAI: the turn-2 item_reference and a tool loop's step-2 item_reference both 422 at xAI (E3+TRN-1+T1+T4+B1::ai-sdk::xai::ai_sdk_responses failed so in three of four runs). SDK source: convertToOpenAIResponsesInput is called with store: openaiOptions.store ?? true, and emits item_reference for any assistant text, reasoning or provider-tool part that carries an itemId."
claims = ["E3", "T1"]
state = "fixed"
test = "an_item_reference_to_a_translated_answer_is_resolved_or_refused"
fix = "ad34d86"
note = "Fixed by option C (ad34d86, on top of option B in 987a60f), statelessly: refuse only when a conversation turn would be lost. translate::turn_reference_in_input, in the same pass over `input` as the other session fields, reads `input` as model steps: a step is a maximal run of item_reference, reasoning, function_call and custom_tool_call items, ended by any other item (a message, a tool output) or the end of input. A reference in a step that holds a call is that step's preamble text or reasoning: dropped (translation skips it; grok's xAI Responses relay cuts it with translate::strip_item_references), and the call and its output are sent in full. That covers several references in a row, reference then reasoning then call, parallel calls, text after the call (a reference between the call and its output) and every step of a loop. A reference in a step with no call (followed by a user message, at the end of input, reference-only input, or before an output with no call in its step) is an earlier turn: the named 400 with the store: false remedy, before any upstream. GPT rows relay every reference to OpenAI's Responses arm unchanged. OpenRouter's own Responses API (live 2026-10-01) silently drops an unknown item_reference and answers anyway, the loss this rule refuses. Hermetic: tests/translate_item_reference.rs (tool-step drops, every edge shape, turn refusals with zero upstream hits, GPT byte-for-byte relay), the grok case in catalog_responses_arms.rs, and the translate.rs unit tests. The ai_sdk_responses probe no longer accepts a refusal: the AI SDK default tool loop must simply succeed. Live 2026-10-01 after option C, twice: ai_sdk_responses passed on all 7 routes (openrouter claude-sonnet-4, xai grok-4.3 and gpt sent step 2 as [user, item_reference, function_call, function_call_output] and got 200, the exact loop option B refused); ai_sdk_conversation refused [user, item_reference(s), user] with the item named on claude, bedrock, together, openrouter, failover, xai and recalled turn 1 on gpt; responses_* and agents_* on claude and gpt passed (13/13, twice). Option B history: Fixed by option (1), statelessly: an item_reference input item is Responses session state (translate::responses_session_field), so a row with no Responses arm (Claude, Bedrock, OpenRouter, Together, grok) answers it with a 400 naming item_reference and saying to send items in full with store: false (Vercel AI SDK: providerOptions.openai.store = false); a GPT row relays it to OpenAI's Responses arm as before. The gateway stores no customer content, so it cannot resolve the item, and the SDK cannot be steered from the response: @ai-sdk/openai 4.0.83 convertToOpenAIResponsesInput emits item_reference for a text, reasoning or provider-tool part when `store` (the request option providerOptions.openai.store ?? true, never response.store) is true and the part's itemId is != null; itemId is the output item's id, which the SDK's zod schemas require as a string on message/reasoning items and on every delta's item_id (missing or null fails validation; \"\" is != null and still becomes an item_reference), and in a stream it is fixed at response.output_item.added (activeOutputItemIds), before the content exists. A translated response now also says store: false, truthfully; no client reads it. Trade-off, as predicted: an AI SDK default-model tool loop whose model wrote text or reasoning before its tool call is now refused on step 2 instead of silently losing that text (live: openrouter claude-sonnet-4, xai grok-4.3); the ai_sdk_responses probe accepts that named refusal and requires the remedy (the same loop with store: false) to pass. Live 2026-10-01 after the fix, twice: ai_sdk_conversation refused with the item named on claude, bedrock, together, openrouter, failover, xai and recalled turn 1 on gpt; ai_sdk_responses passed on all 7 routes; responses_* and agents_* on claude and gpt passed (13/13, twice). Codex never sends item_reference (no such string in its binary). History: Not fixed at first: there is no small fix that is right. The gateway cannot resolve the reference: a translated row has no store, and the id is minted at response.output_item.added, before the content exists, so it cannot carry the content either. The choices are (1) a 400 naming item_reference on a row without a Responses arm (what D128 does for conversation; the error can say to set providerOptions.openai.store = false), which also breaks today's working AI SDK tool loops whenever the model wrote text or reasoning before its tool call; (2) gateway-held state for the items it minted (a per-tenant item store, which the gateway does not have); (3) keep dropping, and document that AI SDK callers on non-GPT rows must set store: false. The reproduction and the live cell accept (1) or a fix that resolves the item; both refuse the silent drop. Workaround today: providerOptions: { openai: { store: false } } (live 2026-10-01: recalls turn 1 on claude-haiku-4-5)."

[[defect]]
