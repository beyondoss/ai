[package]
name = "beyond-sandbox-conformance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "The conformance matrix: every sandbox client's driver against every backend, over the shared scenarios"

[lib]
name = "sandbox_conformance"
path = "src/lib.rs"

[[bin]]
name = "sandbox-matrix"
path = "src/bin/sandbox-matrix.rs"

[[bin]]
name = "sandbox-driver-rust"
path = "src/bin/sandbox-driver-rust.rs"

[[bin]]
name = "sandbox-driver-broken"
path = "src/bin/sandbox-driver-broken.rs"

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
beyond-sandbox = { path = "../sandbox" }
beyond-test-support = { path = "../test-support" }
clap.workspace = true
hex = "0.4"
regex = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile = "3"
tokio.workspace = true
toml = "0.8"
