[package]
name = "beyond-ai-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Beyond agent harness — CLI (one-shot `run` and headless `serve`)"

[[bin]]
name = "beyond-ai-agent"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The harness core. Depended on by package name; imported as `agent_core` (its lib name).
async-trait.workspace = true
beyond-ai-agent-core = { path = "../agent-core" }
# `serve`'s `OutFrame::Raw` payload: a serialized event line shared — by refcount bump, not deep copy —
# across the in-flight-turn recording and every attached connection's sink on the per-event fan-out
# hot path. Same zero-copy byte buffer `agent-core` frames SSE lines with.
bytes.workspace = true
clap.workspace = true
# Draining a `ToolProgress` sink for `serve`'s host-level `bash` RPC command — the same channel type
# `agent_core::ToolProgress` is built on, so we poll it directly rather than adapting between channel
# flavors.
futures.workspace = true
# Validates the `structured_output` tool's payload against the caller-supplied schema. See the
# workspace manifest for why `default-features = false` matters here.
jsonschema.workspace = true
# The shared provider table: where each provider lives, which wire it speaks, which header its key goes
# in, and which env var conventionally holds it. The same rows `crates/gateway` proxies on — so the
# agent's direct route and the gateway's proxy route can never disagree about a provider.
providers = { package = "beyond-ai-providers", path = "../providers" }
serde.workspace = true
serde_json.workspace = true
# `skills.rs`'s `SKILL.md`/prompt-template frontmatter parsing — a real YAML parser instead of a
# hand-rolled subset, so quoting/escaping/comments/flow-collections/anchors are handled the way the
# YAML spec (and every other tool reading these files) actually defines them. Already resolved
# transitively at this exact version (pingora-core → crates/gateway) — this crate depending on it
# directly adds nothing to the build graph.
serde_yaml = "0.9"
thiserror.workspace = true
tokio.workspace = true
# Login cancellation (`oauth`'s device-code poll / callback-server wait) — same primitive `agent_core`
# already pulls in for run/turn/tool abort.
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The `oauth` module's direct HTTP calls to each provider's own OAuth endpoints (claude.ai,
# github.com, auth.openai.com) — a separate network surface from `GatewayClient`'s gateway traffic
# (agent_core never talks to a provider directly). Same version as agent_core's own pin so the
# workspace build graph gains nothing new from this crate depending on it directly too. `form` is
# needed for the several form-encoded OAuth endpoints (GitHub's device/token endpoints, Codex's
# token endpoint) alongside the JSON ones.
# Fills the PKCE verifier / Codex's CSRF state with cryptographically random bytes — same crate/pin
# `crates/gateway/src/state.rs` already uses for its own instance token. `std` is needed so
# `getrandom::Error` implements `std::error::Error` (for `OAuthError`'s `#[from]`) — gateway's own use
# never needed that impl, so its plain `"0.3"` pin didn't need the feature.
getrandom = { version = "0.3", features = ["std"] }
# OpenAI Codex's independent CSRF `state` token (`randomBytes(16).toString("hex")`). Already resolved
# transitively at this exact version (pingora-cache → gateway).
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "http2", "stream"] }
# PKCE code_challenge (SHA-256 of the verifier). Already resolved transitively at this exact version
# (ed25519-dalek → gateway) — this crate depending on it directly adds nothing to the build graph.
sha2 = "0.10"
# The one-shot local HTTP server for the Anthropic/Codex-browser PKCE callback (fixed ports
# 53692/1455) — a single blocking `recv_timeout` loop needs no `Service`/executor wiring, unlike
# `hyper`/`axum`, and is far lighter than pulling in `pingora` (a full L7 proxy) for a listener that
# lives for exactly one request.
tiny_http = "0.12"
# Parses the local callback's query string (code/state/error) and the manual-paste fallback's
# `code=&state=`/full-redirect-URL input. Already resolved transitively via `reqwest`.
url = "2"
# Zeroize-on-drop for `auth_store::Secret` (OAuth access/refresh tokens held at rest). Same crate/
# version `agent_core::client::ApiKey` already uses for the identical purpose.
zeroize = "1"

# Global allocator — mimalloc, the fleet default (cf. `edge`). Floor bumped to 0.1.52 so we pull
# libmimalloc-sys >= 0.1.49, which bundles and defaults to mimalloc **v3** (the `v2` feature is an
# opt-*out*; we don't set it). Also sidesteps musl's slow multithreaded malloc for the static build.
mimalloc = { version = "0.1.52", default-features = false }

# Coding tools, built on ripgrep's own engine crates: gitignore-aware walking (`ignore`), the
# line/byte searcher with binary detection + mmap (`grep-searcher`) driven by a regex matcher
# (`grep-regex`), and glob matching (`globset`). `grep` links ripgrep's searcher in-process rather
# than shelling out to `rg` (what pi does) — so it handles non-UTF-8/binary files correctly and skips
# the subprocess spawn. `regex` remains for `regex::escape` (literal mode) and `find`'s needs.
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
regex = "1"

# `edit`'s fuzzy fallback matcher: NFKC folding so a model's reconstructed `old_string` (smart quotes,
# full-width/ligature chars) still lands against the on-disk bytes.
unicode-normalization = "0.1"

# Every filesystem tool's `path` normalization: decoding a `file://` URL argument (`tools::normalize_path`)
# needs the same percent-decoding `fileURLToPath` does. Already present transitively (`reqwest`/`url`);
# depended on directly since we call its API, not just link it incidentally.
percent-encoding = "2"

# `read` base64-encodes image files so the multimodal model can see them (e.g. a screenshot).
base64 = "0.22"
# `read`'s image pipeline: magic-byte format sniffing (`guess_format`) and Lanczos3 downscaling for an
# oversized image, so it fits the base64 budget instead of being refused outright. `default-features =
# false` drops the `rayon`/AVIF/EXR/etc. formats we never decode; only the four raster formats `read`
# actually accepts are enabled.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# The `web` tool's `markdown` mode: HTML→markdown, so the model reads a page's prose rather than its
# HTML. See `tools/web/markdown.rs`.
htmd = "0.5"
# `export_html`'s markdown rendering (headers/bold/lists/code fences) for message text — pure Rust, no
# vendored JS. Deliberately not paired with a syntax-highlighting crate (e.g. `syntect`): that pulls in
# several MB of bundled syntax/theme data and would slow every build of this CLI, including `run`/
# `serve`, which never touch export — see export.rs's module doc comment.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# The `web` tool's HTML parsing (html5ever, the linkedom equivalent) for its outline/locate/extract/
# table modes. `scraper` also re-exports the `selectors`/`ego-tree` it's built on. See `tools/web/`.
scraper = { version = "0.27", default-features = false }

# MCP client support (`tools::mcp`): the official Rust SDK, client-side only — this binary never acts
# as an MCP *server*, so `server`/`schemars`/`macros` stay off. `client` is the base client machinery;
# `transport-child-process` spawns a local stdio server (`TokioChildProcess`); `transport-streamable-
# http-client-reqwest` speaks the newer streamable-HTTP transport (POST+optional-SSE, session-id
# handshake) for a remote server, using our own `reqwest` rather than pulling in a second HTTP stack.
# The bare `reqwest` feature name (confusingly, same as the dependency) turns on rustls in *rmcp's own*
# `reqwest` feature flag — without it `transport-streamable-http-client-reqwest` alone leaves TLS
# unconfigured, breaking any `https://` MCP server URL. Resolves to the exact reqwest 0.13.x already in
# this workspace's lock file (agent-core/gateway), so this adds no second HTTP-stack copy to the graph.
# Constructing `HeaderName`/`HeaderValue` for `tools::mcp`'s streamable-HTTP transport custom headers
# (`rmcp`'s own `StreamableHttpClientTransportConfig::custom_headers` takes these types directly, not
# plain strings). Already resolved transitively at this exact version (reqwest/rmcp) — depending on it
# directly adds nothing to the build graph, since we call its API ourselves rather than just linking it
# incidentally.
http = "1"
# `auth`: MCP's own OAuth 2.1 authorization flow (SEP-985 metadata discovery, dynamic client
# registration, PKCE) for a streamable-HTTP server that needs it — `agent mcp-login`/`mcp_auth_store.rs`
# drive `rmcp::transport::auth::AuthorizationManager` directly, reusing this crate's existing
# `oauth::callback_server::CallbackServer` for the redirect. Pulls in `oauth2` (new transitive dep) and
# `url` (already an existing direct dependency, for the OAuth module's own callback-URL parsing).
rmcp = { version = "2.1.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }

# `serve --listen`'s WebSocket transport (`serve_ws`): the server/`accept_async` side. Only
# `handshake` is needed here (a plain-`ws://` loopback listener — the edge terminates TLS in front of
# us, so no TLS feature). Same crate + exact version `agent-core` already depends on for its Codex
# *client* WS (`["connect", "handshake", "rustls-tls-native-roots"]`); Cargo unifies the feature sets,
# so this adds nothing new to the build graph — it just enables our own use of the accept path.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

# systemd socket activation for `serve --listen`: adopt the already-bound listener fd systemd passes
# (`LISTEN_FDS`/`LISTEN_PID`) instead of binding our own, so the socket outlives a `systemctl restart`
# (connections queue in the kernel — zero-downtime). The workspace forbids `unsafe_code`, so we can't
# hand-roll `UnixListener::from_raw_fd`; `listenfd` encapsulates that unsafe internally and exposes a
# safe API (`ListenFd::from_env().take_unix_listener(0)`), including the `LISTEN_PID == getpid()` guard.
listenfd = "1"

[dev-dependencies]
# The client side of the WebSocket transport, for `tests/serve_websocket.rs` and the live WS smokes:
# `connect_async` to a `ws://127.0.0.1` listener (no TLS). Same crate/version as the non-dev dep above.
# Scratch files/dirs for the file-tool tests.
# Bench harness for the search tools. `divan` (the gateway's `bench:unit` pin) measures **allocations**
# (via its `AllocProfiler` global allocator) alongside timing — so the search bench proves both the
# speed and the allocation cost of our in-process engine vs shelling out to `rg` (pi's approach).
divan = "0.1"
tempfile = "3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }

[[bench]]
name = "search"
harness = false

# The `web` tool's extract/table row-building — M17's `HashMap<String,String>`-per-row → positional
# `Vec<String>` change. Drives the public `Web::run` over a loopback fixture (the only public seam);
# see the bench's module doc for what the alloc columns include and why the before/after delta is the
# row-storage change alone.
[[bench]]
name = "web_extract"
harness = false

[[bench]]
name = "serve_events"
harness = false

# Session persistence — the listing scan (whose cost grows with a user's whole history) and the
# per-turn durable append. Deliberately runs its temp dirs on the real filesystem, not tmpfs: see the
# bench's own `real_disk_tempdir` for why measuring `sync_all` on tmpfs answers nothing.
[[bench]]
name = "persistence"
harness = false
