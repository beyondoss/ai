note = "Also: readyz never consults ai_allowance_ready, so nothing alerts while managed traffic is refused. NATS down at boot: managed request gets 402 'allowance unavailable' while /readyz answers 200 {\"status\":\"degraded\"}. Not hermetically reached: NATS up but allowance not yet seeded, where the body would be 'ok'."

[[defect]]
id = "D12"
severity = "high"
area = "Contract"
title = "A stock responses.create() returns 400 on every non-GPT row"
impact = "Omitting store counts as session state, so the default call from Vercel openai() or the Agents SDK fails on Claude, DeepSeek and the rest. /v1/models still advertises /v1/responses for those rows."
confidence = "high"
evidence = "translate.rs:1967-1986; proxy.rs:2232-2252"
claims = ["TRN-1", "CAT-9"]
state = "reproduced"
test = "stock_responses_create_without_store_works_on_a_claude_row"
fix = ""
note = "Reproduced e2e (tests/translate_request.rs): POST /v1/responses {model:claude-opus-4-8, input:hi} with no store returns 400 invalid_request_error 'store cannot be honored for claude-opus-4-8 (no Responses upstream)' and never reaches the upstream, while GET /v1/models lists /v1/responses for that row. responses_session_field treats any store other than literal false (omitted, true, unparseable) as session state, and proxy.rs rejects it when the row has no Responses arm; store:false translates fine. Whether omitted store should mean a one-shot is a product decision (OpenAI's default is store:true); the test asserts the stock call succeeds, the other honest option is to stop advertising /v1/responses on these rows."

