fix = ""
note = "Owner decision 2026-10-01: the Mistral rows were removed from the catalog (commit 01d7b55) because their only reachable host was OpenRouter's shared pool; re-add them with AI_POOL_KEY_MISTRAL. ProviderId::Mistral, its spec, the pool-key wiring and the /mistral/ route are kept, so re-adding is the key plus the rows (compat_chat(ProviderId::Mistral, ..) and their verify/catalog_truth.toml entries; verify/catalog_truth_2026-10-01.md has the vendor facts). no_row_rests_on_openrouters_shared_mistral_pool asserts the rows are absent and no candidate names Mistral or a mistralai/ slug; the general rule (no row rests solely on a single-host OpenRouter slug we hold no direct key for) is not expressible from the catalog, which knows neither the deployment's keys nor OpenRouter's host counts. Still exposed to the shared pool, not removed (owner asked only for Mistral): qwen/qwen3.8-flash and the other Qwen3.6/3.7/3.8 rows on failover or when pinned to OpenRouter (Alibaba is the only host; Together, the primary, serves them); minimaxai/minimax-m2.7 structured-output requests (OpenRouter-only row, Mara its only structured_outputs host); thinkingmachines/inkling on failover (DeepInfra, 2 shared-pool 429s in the 2026-10-01 run; Together is primary). The relayed 429's add-your-own-key hint is rewritten to a neutral message since D174 (status, code and Retry-After kept). Earlier analysis: An account/procurement decision, not a code fix. Options: (A) a Mistral pool key (AI_POOL_KEY_MISTRAL): every Mistral row already lists Mistral's own API as its primary candidate (providers::catalog::mistral), so the key alone moves all seven rows off OpenRouter, with OpenRouter as failover; Mistral's own rate limits then apply to our account only. (B) OpenRouter BYOK: add a Mistral (or Alibaba, MiniMax) key under openrouter.ai/settings/integrations; OpenRouter tries BYOK endpoints first and by default falls back to shared capacity on failure, for a 5% fee on OpenRouter's price after a monthly free allowance (openrouter.ai/docs/use-cases/byok, 2026-10-01). Same upstream key as (A) but with OpenRouter still in the path, and nothing in the gateway changes. (C) Keep the rows and say they are best-effort: without (A) or (B) mistral-large-latest is not reliable (8 of 10 calls refused in a quiet minute). (D) Remove the affected rows. The Qwen rows already recovered with D147 (Together, their primary, serves them). No pure-code fix is clearly right: a shared-pool 429 is not our credential's limit, so treating it as a vendor failover (today a 429 never fails over) would be defensible, but no affected row has a second keyed vendor to fail over to, and it changes a documented rule. Also seen: the relayed 429 body carries OpenRouter's \"add your own key ... openrouter.ai/settings/integrations\" remedy, which a gateway client cannot act on."

[[defect]]
