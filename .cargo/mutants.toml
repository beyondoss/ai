# cargo-mutants (https://mutants.rs) defaults: the gateway's money and correctness paths.
#
#   cargo mutants -p beyond-ai --jobs 3 --cargo-arg=--lib   # fast pass: unit tests only
#   cargo mutants -p beyond-ai --jobs 3 --iterate           # then the survivors, every test
#
# The integration suites need `nats-server` on PATH. Narrow proxy.rs with `--re` to the functions
# under study; the whole file is ~860 mutants.
test_tool = "nextest"
examine_globs = [
  "crates/gateway/src/usage.rs",
  "crates/gateway/src/proxy.rs",
  "crates/gateway/src/translate.rs",
  "crates/gateway/src/circuit_breaker.rs",
  "crates/gateway/src/peek.rs",
]
# Equivalent mutants, each with the reason at its source.
exclude_re = [
  # `logging`'s breaker ledger never sees a pending permit with a status: `response_filter` takes
  # the permit when it sets `upstream_status`, so the `Some(s)` arms are defensive only.
  'replace match guard s >= 500 with (true|false) in <impl ProxyHttp for AiProxy>::logging',
  # The same guard's operator mutation (it is the only `>=` in `logging` today; re-check this
  # exclusion if another one is added there).
  'replace >= with < in <impl ProxyHttp for AiProxy>::logging',
  # `pack` ORs fields masked into disjoint bit ranges, where `|` and `^` are the same operation.
  'replace \| with \^ in CircuitBreaker::pack',
  # `k < l`: `k` is a dropped item and `l` a kept one, so `k == l` never happens.
  'replace < with <= in remove_items',
  # `state << 3 | class`: the shifted state's low three bits are zero and a class is below 8, so
  # `|` and `^` agree (the TALLY index in `run` and `step`).
  'replace \| with \^ in InputTally::(run|step)',
  # `close` clears COLON and ESCAPE (distinct bits, so `^` is `|`). ESCAPE is never set when it
  # runs, and in valid JSON a `,` `:` `]` or `}` follows every closing quote, so `Structure`
  # re-sets COLON before reading it: clearing neither (`&`) changes no count on a valid body.
  'replace \| with (&|\^) in InputTally::close',
  # The drained `max_tokens` is the last member only when `max_completion_tokens` precedes it
  # (both are present on this path), so the byte before it is always the separating comma.
  '''replace match guard body\[comma\] == b',' with true in rename_max_tokens''',
  # `model_span` and the `stream_options` value are distinct root values: `s == at` never holds.
  'replace > with >= in force_include_usage',
  # A one-line delegation to `summary_line` (tested); pingora calls it only on its own error lines.
  'replace <impl ProxyHttp for AiProxy>::request_summary -> String',
  # `ArgsEnd::whole`'s first line is a memo: `invalid` (a closed value that failed to parse, which
  # no later byte can fix) and `failed_at` (this exact length already failed) each skip a re-parse
  # whose answer is the same `false`. Either operator gives the same result, only slower. (It is
  # the only `||` in `whole`; re-check this exclusion if another one is added there.)
  'replace \|\| with && in ArgsEnd::whole',
  # `KeepInputs::expecting` only words a parse error's message, which `parse_body` discards (it
  # keeps `None`); `visit_unit`'s `Value::Null` is `Value::default()`.
  "replace <impl serde::de::Visitor<'de> for KeepInputs>::(expecting|visit_unit)",
  # `ChatIdentity::key` packs three masked fields into disjoint bit ranges: `|` and `^` agree.
  'replace \| with \^ in ChatIdentity::key',
  # `map_response` clones a same-wire body as is: the guard only skips that clone.
  'replace match guard client == Endpoint::Responses with false in SseBridge::assembled',
]
