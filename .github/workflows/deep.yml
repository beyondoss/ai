name: Deep checks
# The slow hermetic hunts that don't fit a PR: the full mutation run over the money and correctness
# paths, and the property tests at a case count high enough to find rare shapes. Neither needs
# provider keys. Weekly, or on demand from the Actions tab.
on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  # cargo-mutants over the gateway's billing, translation, routing and parsing code, sharded so each
  # job stays well under GitHub's 6-hour ceiling. A surviving mutant is code no test checks: the job
  # fails and lists it.
  mutants:
    name: mutants (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-mutants
      - run: |
          cargo mutants -p beyond-ai --test-tool nextest --shard ${{ matrix.shard }}/8 \
            --file crates/gateway/src/usage.rs --file crates/gateway/src/translate.rs \
            --file crates/gateway/src/proxy.rs --file crates/gateway/src/peek.rs \
            --file crates/gateway/src/circuit_breaker.rs --file crates/gateway/src/route.rs \
            --jobs 2 --timeout-multiplier 2 </dev/null
      - name: missed mutants
        if: failure()
        run: cat mutants.out/missed.txt 2>/dev/null || true
  # The property tests (translator, usage parsers, body scanners) at 50x the PR case count. Every
  # property runs all 100,000 cases: PROPS_SECS (each property's wall-clock box, 60s by default) is
  # raised past anything a property needs, and the `deep` nextest profile lifts `ci`'s 180s
  # per-test kill and 10-minute run cap to match. The box stays as a backstop below the per-test
  # kill, so a property that somehow runs away still reports how many cases it ran.
  properties:
    name: property tests (deep)
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run -p beyond-ai --profile deep -E 'test(/prop/)' </dev/null
        env:
          PROPTEST_CASES: "100000"
          PROPS_SECS: "5400"
