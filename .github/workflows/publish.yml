name: Publish
# Build the runtime image and push it to GHCR. Kept separate from ci.yml's `check`
# job (which runs on pull_request) so image publishing only happens once a change
# has landed on `main` (or is tagged) — never on an unmerged PR.
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/beyondoss/ai:latest
            ghcr.io/beyondoss/ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
