name: Release Agent Binary
# Builds beyond-ai-agent as a static musl binary for linux/amd64 and linux/arm64 and publishes them
# as GitHub Release assets, matching the beyond-<name>-v*-linux-<arch>.tar.gz
# convention dev/.scripts/publish-primitives.sh (in the beyond repo) expects for every other
# externally-built primitive binary (beyond-pg, beyond-kv, ...). Separate from publish.yml (which
# builds the gateway's Docker image) — this only runs on a version tag, not every push to main.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    name: Build & publish (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # Publish whatever arches succeed rather than cancelling one because the other failed.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch: amd64
          # Native arm64 runner (free for public repos) — avoids the cross-linker pain of building
          # aarch64-musl (ring/mimalloc C bits) from an x86 host.
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}
      - name: Build beyond-ai-agent (static musl, PGO)
        run: |
          # `musl-tools` installs a native `musl-gcc` on each runner (x86_64 on amd64, aarch64 on
          # arm64), so a native build needs no cross-linker. Point cargo's per-target linker + `cc`
          # (ring's build) at it. The env-var names embed the target triple, so derive them.
          linker_env="CARGO_TARGET_$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')_LINKER"
          cc_env="CC_$(echo '${{ matrix.target }}' | tr '-' '_')"
          export "$linker_env=musl-gcc"
          export "$cc_env=musl-gcc"

          # Profile-guided optimization, for MEMORY rather than speed (though it helps both).
          #
          # This binary's idle RSS is dominated by resident *code*: ~7.2 MB of the ~9.3 MB an idle
          # `serve` holds is text paged in from the binary, against only ~2.1 MB of anon. That
          # resident set turns out to be locality-bound, not size-bound — the startup path is
          # scattered across the binary, and the kernel's 64 KB fault-around drags in each touched
          # function's neighbours. Measured: `opt-level="z"` halves `.text` (16,981 → 9,202 KB) and
          # makes resident text *worse* (6.32 → 6.55 MB), which is why we do not use it. PGO attacks
          # the actual problem by grouping what runs, and measures out at 9.34 → 8.30 MB idle RSS
          # (resident text 7.17 → 6.12) with startup unchanged-to-better.
          #
          # Three stages, per arch, on the native runner — profiles are architecture-specific, so
          # each matrix job trains its own. The profile is generated fresh every release rather than
          # checked in: a stale profile degrades silently, and 13 MB of binary data in git ages badly.
          PROFDIR="$RUNNER_TEMP/pgo"
          rm -rf "$PROFDIR"; mkdir -p "$PROFDIR/raw"
          # `llvm-profdata` ships in the toolchain's own bin dir (the `llvm-tools-preview` component,
          # pinned in mise.toml so CI and a developer's box agree). Its path embeds the *host* triple,
          # which differs per runner, so ask rustc rather than hardcoding it.
          host="$(rustc -vV | awk '/^host: /{print $2}')"
          profdata="$(rustc --print sysroot)/lib/rustlib/$host/bin/llvm-profdata"
          test -x "$profdata" || { echo "llvm-profdata missing at $profdata"; exit 1; }

          RUSTFLAGS="-Cprofile-generate=$PROFDIR/raw" \
            cargo build --release -p beyond-ai-agent --target ${{ matrix.target }}
          python3 .github/pgo-train.py \
            "target/${{ matrix.target }}/release/beyond-ai-agent" "$PROFDIR/raw"
          "$profdata" merge -o "$PROFDIR/merged.profdata" "$PROFDIR"/raw/*.profraw

          # The instrumented artifacts must not be reused by the optimized build — different
          # RUSTFLAGS already force a rebuild, but be explicit so a future flag change can't make the
          # shipped binary silently inherit instrumentation.
          rm -rf "target/${{ matrix.target }}/release"
          # …and non-PIE, which is the other half of the memory win and a much bigger one than it
          # looks. A position-independent executable carries 1.37 MB of `.rela.dyn`, and processing
          # those relocations at startup *dirties* the 1.05 MB `.data.rel.ro` they write into — anon
          # pages, per process, before `main` runs. Static relocation model removes both the section
          # and the work. Measured on the shipped binary, idle `serve`, THP controlled, n=3:
          #
          #   baseline        RSS 9.34 MB   anon 2.09   resident text 7.17   startup 2.7 ms
          #   PGO             RSS 8.30 MB   anon 2.20   resident text 6.12   startup 2.6 ms
          #   PGO + non-PIE   RSS 6.31 MB   anon 1.03   resident text 5.28   startup 1.6 ms
          #
          # Startup improves for the same reason RSS does: minor faults halve, 670 -> 347.
          #
          # The cost is userspace ASLR, and it is only acceptable because the `web` tool no longer
          # parses attacker-controlled HTML in this address space. That parse was the reachable
          # memory-corruption surface (~190 `unsafe` blocks across `tendril`/`ego-tree`/`selectors`),
          # and it now runs in a seccomp-confined child that holds no credentials — see
          # `tools::web::isolate`. If that isolation is ever removed, this flag must go with it.
          RUSTFLAGS="-Cprofile-use=$PROFDIR/merged.profdata -C relocation-model=static" \
            cargo build --release -p beyond-ai-agent --target ${{ matrix.target }}
      # Deliberately NOT UPX-compressed. UPX self-extracts the whole image into anonymous memory at
      # exec, which defeats demand paging: the text segment stops being a clean, shared, file-backed
      # mapping and becomes private dirty anon that can't be evicted (only swapped) and can't be
      # shared between processes. Measured on the release binary: idle RSS 12 MB → 29 MB (+19 MB, and
      # ~27 MB of it unreclaimable), and `--version` 4.5 ms → 305 ms, since LZMA has to inflate all
      # ~24 MB before `main` runs — including the code a given invocation never calls. The asset is
      # already gzipped by the `tar -czf` below, so all that bought was 9.8 MB → 6.8 MB of one-time
      # download. 3 MB off a download is not worth 19 MB of a session-multiplexing daemon's RAM, nor
      # 300 ms on every CLI invocation.
      - name: Package release asset
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf \
            "dist/beyond-ai-agent-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz" beyond-ai-agent
      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the release once; the second matrix job's create is a no-op (`|| true`). Each job
          # uploads its own distinct per-arch asset, so `--clobber` never races across arches.
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" \
            "dist/beyond-ai-agent-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz" \
            --repo "${{ github.repository }}" --clobber
