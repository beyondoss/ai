note = "Found by live cells FLT-1+REL-7+BIL-3+BIL-14+BIL-20::*::*::stall_after_head (crates/verify/tests/fault_live.rs). Fixed: the 2xx head is the proof the provider took the request, so proxy.rs logging's `started` gate no longer needs message_start, a relayed delta or a clean finish; a cut-short 2xx stream is estimated unless it carried only an error event (an_error_only_stream_is_not_billed_an_estimate still passes). Both wires: the Anthropic one gets no message_start, so its input comes from the tally. The related open question (the gateway's own 504 before the head) is D130."

