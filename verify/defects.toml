[[defect]]
id = "D11"
severity = "high"
area = "Reliability"
title = "/readyz says ok while every managed request gets 402"
impact = "Allowance fails closed until seeded, but readyz only checks the deny watcher. New pods, or NATS down at boot, black-hole managed traffic."
