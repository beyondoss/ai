[package]
name = "beyond-ai-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Beyond agent harness — CLI (one-shot `run` and headless `serve`)"

[[bin]]
name = "beyond-ai-agent"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The harness core. Depended on by package name; imported as `agent_core` (its lib name).
async-trait.workspace = true
beyond-ai-agent-core = { path = "../agent-core" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Global allocator — mimalloc, the fleet default (cf. `edge`). Floor bumped to 0.1.52 so we pull
# libmimalloc-sys >= 0.1.49, which bundles and defaults to mimalloc **v3** (the `v2` feature is an
# opt-*out*; we don't set it). Also sidesteps musl's slow multithreaded malloc for the static build.
mimalloc = { version = "0.1.52", default-features = false }

# Coding tools: gitignore-aware walking (ripgrep's `ignore`), regex search (`grep`), glob matching
# (`find`) — the same crates ripgrep/fd are built on.
globset = "0.4"
ignore = "0.4"
regex = "1"

[dev-dependencies]
# Scratch files/dirs for the file-tool tests.
tempfile = "3"
# Macro-bench harness for the search tools (matches the gateway's `criterion` pin). The
# saved-baseline comparison tracks the parallel-walk speedup over time.
criterion = "0.5"

[[bench]]
name = "search"
harness = false
