name: Advisories
# Daily on main: `cargo audit` (RustSec advisories only; ignores in .cargo/audit.toml). PRs run the
# same audit only when they change dependencies (ci.yml), so a newly published advisory never turns
# an unrelated PR red; this job is what notices it and fixes it.
#
# If the audit fails, .github/scripts/advisory-bump.py runs `cargo update -p NAME@VERSION` for each
# vulnerable package that has a patched release and audits again. The result is one bot commit on
# the fixed branch `deps/advisories`, built on main on every run that needs a change: the PR is
# opened or updated in place (never duplicated) and auto-merge is enabled. What a lockfile bump
# cannot fix is named, with its `cargo tree -i` chain, in the PR body; if the lockfile cannot change
# at all, in one reused `advisories` issue. A clean audit closes the PR and the issue.
#
# Everything is done with GITHUB_TOKEN. Its pushes start no workflow except a workflow_dispatch, so
# the job dispatches ci.yml on the branch for the PR's `Check`. Opening a PR needs the repository
# setting "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: advisories
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  audit:
    name: advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1
      - name: Bump what a lockfile bump can fix
        id: bump
        run: |
          set +e
          python3 -I .github/scripts/advisory-bump.py "$RUNNER_TEMP/body.md"
          code=$?
          set -e
          case $code in
            0 | 2 | 3 | 4) ;;
            *)
              echo "::error::advisory-bump.py failed (exit $code)"
              exit 1
              ;;
          esac
          echo "code=$code" >>"$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/body.md" >>"$GITHUB_STEP_SUMMARY"
      - name: Open, update or close the advisories PR and issue
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.bump.outputs.code }}
        run: |
          set -euo pipefail
          branch=deps/advisories
          title="deps: bump dependencies with security advisories"
          issue_title="Dependency advisories need a manual fix"
          bot="41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          gh label create advisories --force --color d73a4a \
            --description "Dependency advisories the daily audit could not fix by a lockfile bump"
          pr=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')
          # shellcheck disable=SC2016 # $ENV.T is jq's, not the shell's.
          issue=$(T="$issue_title" gh issue list --state open --label advisories --limit 100 --json number,title \
            --jq 'map(select(.title == $ENV.T)) | .[0].number // empty')
          { cat "$RUNNER_TEMP/body.md"; echo; echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; } >"$RUNNER_TEMP/full.md"

          if [ "$CODE" = 0 ]; then
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch --comment "main's lockfile audits clean now; nothing left to bump."
            fi
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "The audit is clean."
            fi
            echo "audit clean"
            exit 0
          fi

          # Unfixable advisories: the PR body carries them when there is a PR; with no lockfile
          # change possible, one reused issue does.
          if [ "$CODE" = 4 ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file "$RUNNER_TEMP/full.md"
            else
              gh issue create --title "$issue_title" --label advisories --body-file "$RUNNER_TEMP/full.md"
            fi
            echo "::error::advisories remain and a lockfile bump cannot fix them"
            exit 1
          fi
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "A lockfile bump PR (deps/advisories) now covers this."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "$bot"
          git switch -q -c "$branch"
          git add Cargo.lock
          git commit -q -m "$title" -m "Generated by the advisories workflow (advisory-bump.py)."
          # The branch as the remote has it now, if it exists (a closed PR can leave it behind).
          have=false
          if git fetch -q --no-tags "$remote" "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null; then
            have=true
          fi
          if [ "$have" = true ]; then
            # Same lockfile, on top of today's main: nothing to do. Main requires an up-to-date
            # branch, so a branch behind main is rebuilt on main even when the lockfile is the same.
            if [ -n "$pr" ] && git diff --quiet "origin/$branch" -- Cargo.lock &&
              git merge-base --is-ancestor origin/main "origin/$branch"; then
              echo "PR #$pr already carries exactly this change on top of main: nothing to do."
              exit 0
            fi
            # A commit by anyone else on the branch is a human's work: never force-push over it,
            # whether or not a PR is open.
            if git log --format='%ae%n%ce' "origin/main..origin/$branch" | grep -qvxF "$bot"; then
              if [ -n "$pr" ]; then
                gh pr comment "$pr" --body-file "$RUNNER_TEMP/full.md"
                exit 0
              fi
              if [ -n "$issue" ]; then
                gh issue reopen "$issue" # closed above as covered by a PR
                gh issue edit "$issue" --body-file "$RUNNER_TEMP/full.md"
              else
                gh issue create --title "$issue_title" --label advisories --body-file "$RUNNER_TEMP/full.md"
              fi
              echo "::error::$branch holds commits by someone else and no PR is open; not overwriting it"
              exit 1
            fi
            git push -q --force-with-lease="refs/heads/$branch:$(git rev-parse "origin/$branch")" \
              "$remote" "HEAD:refs/heads/$branch"
          else
            git push -q "$remote" "HEAD:refs/heads/$branch"
          fi
          if [ -z "$pr" ]; then
            pr=$(gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/full.md")
          else
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/full.md"
          fi
          gh workflow run ci.yml --ref "$branch"
          gh pr merge "$pr" --auto
          echo "PR: $pr (CI dispatched on $branch)"
          if [ "$CODE" = 3 ]; then
            echo "::warning::some advisories remain after the bump; see the PR body"
          fi
