4-5-20251001-v1:0 and us.anthropic.claude-opus-4-8 are ACTIVE profiles over ACTIVE models; every Together candidate is in the serverless table and on no deprecation list; every other OpenRouter candidate has live endpoints; DeepSeek keeps deepseek-v4-pro and deepseek-flash; Groq's and Fireworks' remaining candidates are listed and serverless. No row needed a renamed or version-bumped id: every candidate is the vendor's alias, and no alias moved to a different model."
claims = ["CAT-1", "CAT-2", "CAT-6", "CAT-16"]
state = "fixed"
test = "no_catalog_row_outlives_its_retirement"
fix = "1119025"
note = "Fixed. Removed the six retired rows (a request for one is a 404, never a remap to the successor) and recorded each in verify/catalog_truth.toml [[retired]] with its notice and date (retired = past). Removed the Fireworks GLM 5.2 candidate ([[not_serverless]]) and o1-pro's OpenRouter failover. Recorded the 13 scheduled shutdowns as [[retired]] with retires = date; the rows stay until then. GET /v1/models carries no date: neither the OpenAI list shape nor Anthropic's /v1/models defines a deprecation field, so none was added. Added gpt-6-sol, gpt-6-luna, gpt-6.1-sol (OpenAI Responses first, then OpenRouter, plus the Responses arm), gpt-6-sol-pro, gpt-6-luna-pro, gpt-6.1-sol-pro (OpenRouter only; our OpenAI key 404s them) and grok-4.7 (xAI Responses, then OpenRouter), priced and carded from the vendors' own pages, with [[row]] entries. Recorded as deliberately not carried ([[not_carried]], with reasons): grok-4.20-0309-non-reasoning (no OpenRouter failover), the gpt-3.5 family, and OpenRouter-only single-host models (Qwen3.8 Max, GLM 5.3 Prime and FlashX, Muse Spark 1.3, Inkling Small; the D156 shared-pool shape). Permanent checks: hermetic no_catalog_row_outlives_its_retirement (every row is absent from [[retired]] or carries a future retires date; a retired model can't come back as a row or a candidate) and no_candidate_is_retired_or_not_serverless (entries well formed). Live, listing calls only, no gateway: CAT-16::raw::{provider}::{row} per candidate (listed by the vendor's models API, Together's serverless table, an ACTIVE Bedrock profile over a non-LEGACY model, or a live OpenRouter endpoint for each card capability; every deprecation notice of the vendor, or of the maker of an OpenRouter slug, recorded; nothing due), and CAT-16::raw::{anthropic,openai,xai}::new-models (every model those vendors list in a carried family is a row or recorded). VERIFY_CATALOG_GAPS=1 reports Together and OpenRouter gaps without failing. Live 2026-10-01: all CAT-16 cells pass;