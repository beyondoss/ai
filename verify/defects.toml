evidence = "props_fields::prop_answer_changing_fields_are_never_silently_dropped, minimized: Responses {\"input\":\"hi\",\"store\":false,\"prompt\":{\"id\":\"pmpt_abc123\"}} -> Messages {\"max_tokens\":4096,\"messages\":[{\"content\":\"hi\",\"role\":\"user\"}],\"model\":\"m\"}; {\"top_logprobs\":5} -> Chat and Messages bodies with no trace of it. Responses -> Chat keeps prompt."
claims = ["TRN-21"]
state = "fixed"
test = "responses_answer_options_are_never_dropped"
fix = "33f965a"
note = "Found by the property suites. openai_req_to_anthropic rebuilds the body from known Chat fields, so a Responses field the intermediate Chat body carried for forwarding is lost on the second hop. Fixed in 33f965a, by ARCHITECTURE.md's rule for unmappable answer-changing input (forward it for the provider to reject by name): responses_req_to_openai forwards `top_logprobs` beside `prompt` (Chat Completions has no logprobs a translated client is shown, so it is not mapped onto `logprobs: true`), and openai_req_to_anthropic forwards `prompt`, so both survive the second hop of Responses -> Chat -> Messages. The props_fields exclusions are removed."

[[defect]]
id = "D130"
severity = "med"
area = "Billing"
title = "The gateway's own read timeout before the head bills zero for a prompt the provider has"
impact = "BIL-3 bills a client that gives up before the response head once the provider has the whole request (D07), because the provider bills that prompt either way. When the gateway gives up instead (read_timeout_secs on a live connection, its 504), the provider is in the same state and bills the same prompt, but the row was 0/0. The SDKs retry a 504, so the ledger held one generation where the provider billed two (BIL-14)."
confidence = "high"
evidence = "Open question raised with D123 by the fault-suite author (proxy.rs no_head comment: the provider bills that prompt either way). Hermetic: an upstream that reads the whole body and stays silent past read_timeout_secs = 2 -> client 504, row {outcome: upstream_error, input_tokens: 0, usage_estimated: false}, while a client giving up at the same moment is billed the estimate (billing_cancel::a_cancel_before_the_response_head_is_billed_an_estimate). no_head required ErrorSource::Downstream."
claims = ["BIL-3", "BIL-14", "BIL-20"]
state = "fixed"
test = "a_read_timeout_before_the_head_bills_the_delivered_prompt"
fix = "498cb8f"
note = "Fixed: no_head now covers any wait given up on (gave_up_waiting): the client going away, or the gateway's ReadTimedout from upstream. Both leave a provider holding the whole request on a live connection, and it cannot tell who hung up. A reset or close from the upstream before any head (the gateway's 502) stays 0 (a_close_before_the_head_bills_nothing): the peer declined to answer, the managed providers' edge (Cloudflare) answers a forwarded-then-lost request with a 52x status rather than a bare reset, and an estimate the customer cannot check errs low (BIL-20). A dead peer (keepalive or TCP_USER_TIMEOUT) stays 0 for the same reason. The fault suite now models stall_before_head as forwarded with the provider's answer held back (the realistic shape: a provider still working when the timeout fires) and owes an estimated row for it; reset_after_forward stays unbilled by design."

[[defect]]
