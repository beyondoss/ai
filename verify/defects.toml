[[defect]]
id = "D99"
severity = "low"
area = "Billing"
title = "A cut-short estimate's input counts JSON structure, so it exceeds the provider's count on short prompts"
impact = "BIL-20 says an estimate never exceeds provider truth. InputTally counts every non-base64 body byte (keys, model id, stream_options, max tokens) and divides by 5, so on a short prompt the JSON overhead alone outweighs the real prompt: an aborted stream bills more input than the same request completed. Small in absolute terms, but it is the one direction the estimate promises never to err."
confidence = "high"
evidence = "live 2026-10-01 B2+BIL-3+BIL-20::openai-py::gpt::stream_abort, three runs: the completed stream reports prompt_tokens 29; the identical request aborted after 25 content chunks bills an estimate of input_tokens 44 (outcome client_cancelled, usage_estimated true). usage.rs InputTally::feed counts all bytes outside base64 payloads; estimate_tokens divides by INPUT_BYTES_PER_TOKEN (5). On Claude the estimate keeps message_start's exact count, and on grok the prompt (with xAI's system preamble) outweighs the overhead, so those cells pass. Also live 2026-10-01 FLT-1 cells reset_mid_stream and stall_mid_stream on gpt-pooled and gpt-single, all four clients, four runs (16 cells each): the provider reported prompt_tokens 24 for the request (read from the drained upstream stream); the cut-short row estimates input_tokens 40 (Chat clients) or 32 (Messages clients translated onto Chat). Reproduced hermetically: usage::tests::input_estimate_counts_string_values_only: InputTally counts 105 bytes for a 55-byte prompt of string values (every key, brace and number), and more with stream_options and limits added."
claims = ["BIL-20", "FLT-1"]
state = "fixed"
test = "a_short_prompt_estimate_stays_under_the_provider_count"
fix = "498cb8f"
note = "Found by live cell B2+BIL-3+BIL-20::openai-py::gpt::stream_abort. Fixed: InputTally no longer divides body bytes by a measured constant. It counts the pre-tokens of the prompt text: only the string values of prompt keys (content, text, role, system, instructions, input, output, arguments, name, description), split the way the GPT tokenizers' stated pre-tokenizer regex splits and every measured tokenizer honors (words at whitespace, one per letter run, one per three digits, one per punctuation run unless it is a single byte before letters; non-ASCII left out, a word of only non-ASCII counting one). A BPE tokenizer never merges across a pre-token split, so this is a lower bound by construction, on every wire, with no divisor. The fault prompt now estimates 16 (Chat and Messages bodies alike) for 24 real tokens. Measured on o200k_base, cl100k_base, grok-4.3's tokenize endpoint and Claude's count_tokens over prose, code, JSON, numbers, hex, base64-like text, French, Russian, CJK, emoji and punctuation: never above, ~0.8x on English and code for GPT/grok, ~0.65x for Claude (usage.rs input_estimate_never_exceeds_a_real_tokenizer pins those fixtures). Binary payloads drop out as values of non-text keys, so the base64 markers and aho-corasick are gone; text runs through a 9-state table four bytes per lookup in two lanes (1.3 GB/s on source, 3 GB/s on prose, 100 GB/s on an image body; benches/unit.rs input_tally). Also held by usage.rs input_estimate_counts_string_values_only (the bare and dressed stream-abort bodies estimate the same, under 29, at any split). Superseded (integration): a parallel fix counted all JSON string-value bytes / 5; the pre-token bound was kept."

