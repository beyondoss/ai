note = "Reproduced (src/translate_request_tests.rs) on claude-sonnet-4-5 (ClaudeGen::Budget): turn 2 of a tool loop with reasoning on keeps thinking {type:enabled,budget_tokens:2000} while the final assistant turn starts with tool_use, for Chat echoes without our thinking list (with or without reasoning_content) and Responses input with no reasoning item or an id-less reasoning item (gateway_reasoning_block only accepts rs_gw ids). A control echo carrying the signed thinking list passes. Asserted against Anthropic's documented rule ('a final assistant message must start with a thinking block'); the live 400 itself is not exercised here, and adaptive-generation models were not checked."

