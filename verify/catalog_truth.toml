# Vendor-published facts behind `crates/providers/src/catalog.rs`, as data a test checks.
#
# One [[row]] per catalog row whose primary candidate is a direct vendor. Every field is the value
# the PRIMARY vendor publishes, read from `source` on `date`. A field the vendor does not publish is
# omitted, never guessed. Prices are USD per million tokens, as the vendor wrote them; the standard
# tier only (not batch/flex; DeepSeek peak; xAI < 200k prompt; OpenAI <= 272K input).
#
# A row whose primary is OpenRouter may also have an entry when the model's maker sells it through
# its own API and publishes the facts (Z.ai's GLM, Moonshot's Kimi, OpenAI's Codex ids): the card
# then follows the maker, never OpenRouter's listing.
#
# `follows = "maker"` marks a Together-primary row whose recorded price is the maker's own (Alibaba's
# Qwen, Moonshot's Kimi). CAT-7 then accepts Together listing less than the card (a note), and fails
# Together listing more: that bills customers below our cost, which is an owner pricing decision.
#
# Two fields record a limit the row's candidates enforce below the vendor's published figure. The
# card states the smaller one, so a request sized from it is accepted wherever the walk lands:
# - `input_limit`: the most input tokens every candidate accepts, when lower than `context_window`
#   (OpenAI's GPT-5 family counts output inside the window and caps input at the window less the
#   max output; a failover host serving a smaller window).
# - `output_limit`: the most output tokens one request can ask for, when lower than
#   `max_output_tokens`.
# Either needs `limit_evidence`: the measurement or document that sets it.
#
# `created` (Unix seconds) and `owned_by` are the vendor's own model listing (`GET /v1/models` at
# api.openai.com / api.x.ai), not OpenRouter's listing date.
#
# `[[promo]]` records a vendor-announced promotional rate that some route charges while the card
# keeps the standard rate (the catalog_live CAT-7 check accepts a charge at that rate until `until`).
# `cache_read` is the promotional cached-input rate; without it cached input is held to the card's.
#
# `catalog_matches_vendor_truth` (crates/providers/src/catalog.rs) asserts:
# - every recorded field equals the catalog row's value (`context_window` / `max_output_tokens`
#   yield to `input_limit` / `output_limit` where recorded);
# - a row that records `input` but omits `cache_read` / `cache_write` lists the input rate there
#   (the ListPrice rule for an unpublished rate);
# - every direct-vendor catalog row has a [[row]] here or an `unverified` entry with a reason.
#
# `[[not_serverless]]` entries are (provider, id) pairs the vendor no longer serves to a standard
# key. No catalog candidate may name one (`no_candidate_is_retired_or_not_serverless`).
#
# `[[retired]]` records each vendor retirement, past or scheduled, with the vendor's deprecation
# notice as `source`. An entry names a candidate (`provider` + `id`, the id as that provider spells
# it, or a dated snapshot of it), a catalog row (`model`: the row and all its candidates), or both,
# and carries exactly one date:
# - `retired`: the vendor no longer serves it. No row may be named `model`, and no candidate may
#   name the (provider, id). A client's request for it is a 404, never a remap to a successor,
#   unless catalog-drift removed the row because every candidate retired and a newer row in its
#   line exists: then `ALIASES` (crates/providers/src/catalog.rs) maps the name to that row.
#   A row removed early by owner decision records the vendor's announced shutdown here too, so
#   the date can still be ahead (the seven OpenAI rows due 2026-10-23, removed 2026-10-01: D243).
# - `retires`: the vendor has announced the date. The row or candidate stays until then;
#   `no_catalog_row_outlives_its_retirement` warns from 14 days before that date, and fails then
#   under `CATALOG_RETIREMENT_STRICT=1` (the weekly deep.yml job; PR runs only warn), so the row is
#   removed (and the entry turned into `retired`) before a customer's request reaches a vendor
#   404. `/v1/models` has no deprecation field to carry it (the OpenAI list shape and Anthropic's
#   `/v1/models` define none), so it is recorded here only.
# The live cell `CAT-16::raw::{provider}::{row}` (crates/verify/tests/catalog_live.rs) holds each
# candidate to the vendor's own listing and deprecation notices, so a retirement the vendor
# announces shows up as a red cell, and a deprecation notice naming a candidate with no entry
# here fails it.
#
# `[[not_carried]]` records a first-party model, in a family the catalog carries, that is
# deliberately not a row, with the reason. `CAT-16::raw::{anthropic,openai,xai}::new-models`
# fails on a vendor-listed model in a carried family that is not a row, a vendor-listed alias or
# dated snapshot of one, nor recorded here or in `[[retired]]`, so a new release surfaces as a
# visible gap. No model is skipped by name or modality: audio, realtime, image and video models
# are recorded here one by one, with the endpoint they need that the gateway doesn't serve.
#
# `[[schema_unenforced]]` records a candidate that accepts a JSON-schema output request
# (`response_format` `json_schema`, `strict: true`) and answers outside the schema, with the
# OpenRouter endpoint listing that claimed otherwise and the measurement (D155). OpenRouter's
# per-endpoint `supported_parameters` (`GET /api/v1/models/{id}/endpoints`) is not ground truth:
# hosts that list `structured_outputs` answer fenced, renamed or broken JSON, and
# `provider.require_parameters` does not avoid them. `schema_unenforced_candidates_match_truth`
# asserts that each such candidate either sits on a row whose card does not advertise
# `structured_outputs`, or is one `serves_structured_outputs` refuses (so a schema request skips
# it), that every candidate it refuses (Bedrock aside) is recorded here, and that every
# advertising card keeps a candidate that enforces the schema.
#
# Source audit: verify/catalog_truth_2026-10-01.md (raw pages fetched with curl and parsed locally).

# Direct-vendor rows with no checked vendor facts, as { model = "...", reason = "..." }. Empty:
# every direct-vendor row has a [[row]] below.
