impact = "The gateway relayed a Responses body's background: true on GPT rows (the Responses arm) and on /openai/v1/responses. OpenAI answers 200 {\"status\":\"queued\",\"usage\":null} and generates afterwards, billing Beyond's account for a response no usage tap ever sees: a managed tenant could run any amount of generation free. D195 then billed an estimate of the queued envelope (a few tokens). A managed key cannot even poll for the result (the GET allowlist refuses it), so the only use of background on a managed key was the free generation."
