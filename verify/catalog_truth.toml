# =================================================================================================
# Pricing contract rates: how crates/providers/src/rates/generated.rs is generated
# =================================================================================================
#
# The rate table is generated (`mise run rates:sync`, crates/rates-sync) from two inputs:
#
# 1. The primary sources' snapshots, `verify/rates_sources/` (manifest.toml: URL, fetch date,
#    sha256). Every number a vendor publishes in a table or an API is read from there by a strict
#    parser, never typed here: Anthropic's and OpenAI's pricing pages (markdown), xAI's models API
#    (cross-checked against its pricing page), DeepSeek's pricing page (HTML only), Groq's models
#    page, Fireworks' pricing page, Together's models API (cross-checked against its docs table),
#    the AWS Price List offer for Bedrock (cross-checked against Anthropic's list and the regional
#    premium), and OpenRouter's endpoint lists.
# 2. This section: what lives only in a vendor's prose, and the wiring.
#
# `[[prose]]`: one fact a vendor states only in prose, with the URL and the verbatim `quote`. The
#   generator finds the quote, whitespace collapsed, in that URL's snapshot, so a vendor rewording
#   or removing it fails the next sync and the weekly drift job. `value` is read by the rule that
#   uses the fact (crates/rates-sync/src/build.rs):
#   - `anthropic.fast_caching`: fast mode's cache rates are the fast input rate times the model's
#     own cache multipliers.
#   - `anthropic.geo_us`, on the cards that name it: the `inference_geo: "us"` multiplier.
#   - `bedrock.regional`: AWS Regional SKUs must be the Global SKUs times this (Global must be
#     Anthropic's list).
#   - `openai.long_context`, `xai.long_context`: the long-context threshold, `>N` (more than) or
#     `>=N` (reaches). xAI's N must also be its API's `long_context_threshold`.
#   - `xai.priority`: Priority's multiplier on every standard rate (`fast`; none above the
#     threshold, which xAI does not publish).
#   - `deepseek.peak`: the peak windows (UTC); off-peak rates are DeepSeek's own table.
#   - `groq.cached`: the cached-input multiplier, on the models Groq's prompt-caching page lists.
#   - `groq.flex`: Flex is priced as on-demand.
#   - `fireworks.priority`: Fireworks' Priority column is the `fast` class.
#   - `openrouter.credit_fee`: OpenRouter's fee on credit purchases (Standard plan), applied to
#     every OpenRouter cost.
# `[[tools]]`: a per-call fee list (USD per call, or per item), each fee with its quote from `url`.
#   A tool a card's list does not name is refused, never billed at zero; a `"0"` fee is a
#   published "no additional charge".
# `[deepseek_calendar]`: the Chinese public holidays (off-peak in full) inside `covered`, the span
#   of days the list is complete for; a weekday peak minute outside it is refused.
# `[[card]]`: one vendor card. `row` is the vendor's key for it (a table's model name, an API id or
#   alias); the vendor is the name's prefix. `geo_us` and `tools` name a [[prose]] / [[tools]].
#   `unpublished_output` is the output rate where the source publishes none (embeddings).
#   An unpublished cache read or write is the input rate (no discount, no premium; never $0). A
#   class or tier the source does not list is not sold: refused, never guessed.
# `[[conflict]]`: two machine-readable sources disagree on a field; `follow` names the one the
#   table uses and `reason` says why. `values` must still be what each source says, or it is stale
#   and generation fails; when the sources agree again it must be removed.
# `[[override]]`: the table holds a rate other than the source's (a promotion that ends before the
#   next sync). `source_says` must still be what the source says, and the source's snapshot no
#   later than `until`, or generation fails.
# `[[superseded]]`: a rate a vendor billed until `until` (exclusive) and has since changed, with the
#   vendor's announcement. Only `mise run rates:audit` reads it: an invoice line from before then
#   is checked against this rate. Never used to generate.
# `[[pricing]]`: one per catalog row, in catalog order. `list_card` names the primary vendor's
#   card (`list`: the catalog's ListPrice alone); `cost` maps each candidate provider to the card
#   it bills from: `list` (the row's own vendor), a [[card]] name, `openrouter:{slug}` (that
#   slug's endpoints, from its snapshot), or `unverified: {reason}` (refused). Pricing is
#   pass-through: a row's price is its cost.

