[[defect]]
id = "D200"
severity = "high"
area = "Security"
title = "A tenant could cool Beyond's shared pool key for every tenant by getting an out-of-credit phrase echoed in an error"
impact = "D180 decided that a pool key was out of credit from a phrase anywhere in the decoded error message (remedy::UNFUNDED: \"insufficient balance\", \"credit balance is too low\", \"check your plan and billing details\", ...). Providers quote the request in their errors: \"The model `X` does not exist\", \"Unrecognized request argument supplied: X\", \"X: Extra inputs are not permitted\". So a request with model \"insufficient balance\", or a root key named after Anthropic's billing sentence, made logging cool the key (Provider::mark_key_bad) and a catalog walk drop the provider (Provider::cooling) for 60 s, for every tenant, at the cost of one free 400 or 404, and repeatably: the D84 class (one tenant's request moving the shared pool) again. The tenant's own error was also replaced with \"The provider cannot serve this request right now\"."
confidence = "high"
evidence = "Hermetic: an_echoed_out_of_credit_phrase_never_cools_the_pool_key. With x-beyond-order openai,openrouter on gpt-4o-mini, an OpenAI mock answering 404 \"The model `insufficient balance` does not exist ...\" was sent request 1 only; requests 2 and 3 went to OpenRouter, ai_key_auth_failures_total read 1, the log said \"pool key is out of credit; cooling it\" with status 404, and request 1's message read the \"cannot serve\" text. Code: remedy.rs remedy() matched UNFUNDED by lower.contains on message, error and metadata.raw; proxy.rs logging cooled on Redact::unfunded."
claims = ["REL-4", "SEC-16", "T6"]
state = "fixed"
test = "an_echoed_out_of_credit_phrase_never_cools_the_pool_key"
fix = "cf89733"
note = "Fixed in remedy.rs by keeping the two decisions apart. Out of credit (Neutralized::unfunded, which cools the shared key) is read only from what the provider sets and the request cannot: a 402 (OpenRouter, DeepSeek, Anthropic billing_error), except OpenRouter's \"This request requires more credits\" (one request bigger than the balance, anchored at the start); OpenAI's insufficient_quota code or type and Anthropic's billing_error type; and Anthropic's credit-balance 400 and xAI's spent-credits 403 compared to the provider's whole sentence (xAI's team id is the one variable part). The phrase list (now REMEDIES only) drives the cosmetic D174 rewrite, and only on a status about the account (401, 402, 403, 429): a 400 or 404 is about the request and may quote it, so it is relayed as written. Unit: remedy::tests::an_echoed_phrase_is_never_unfunded (every phrase in a model name, an unknown parameter and an extra field, on 400/404/422 untouched, on 401/403/429 never unfunded; the anchored sentences with tenant text around them) and unfunded_is_read_from_structured_fields. D180's two answers (Anthropic's credit-balance 400, OpenAI's insufficient_quota 429) still cool (an_unfunded_pool_key_sends_later_requests_to_the_next_candidate). Trade-off: an OpenRouter 404 naming its privacy-settings page is relayed verbatim; a different wording of Anthropic's or xAI's sentence would no longer cool (the safe direction: that request is relayed, as before D180)."

[[defect]]
id = "D201"
