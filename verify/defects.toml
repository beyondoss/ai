[[defect]]
id = "D206"
severity = "med"
area = "Reliability"
title = "A full-body relay could retry an attempt after its client had disconnected"
impact = "relay_full_body matched (Ok(_) | Err(_), Some(decision)) before looking at the error: when an attempt had recorded a retry (a 5xx, a 429 key walk, a reset before delivery) and the pipe ended because the client hung up (a downstream error), the parent ran the next attempt anyway. That attempt sends the whole body (up to 100 MiB) to the next candidate or key for nobody: a generation the provider bills and no client reads, and a wasted breaker permit."
confidence = "med"
evidence = "Code: proxy.rs relay_full_body, the (Ok(_) | Err(_), Some(decision)) arm. The window is the time between an attempt recording its RelayRetry and the parent reading it, while pipe_full_body has already returned the client's disconnect; not reproducible deterministically end to end, so the decision is extracted (attempt_end) and tested directly. Hermetic: a_full_body_attempt_that_lost_its_client_is_never_retried (the old match returned Retry(Candidate(0)) for a downstream ConnectionClosed with a recorded retry)."
claims = ["REL-9", "REL-21"]
state = "fixed"
test = "a_full_body_attempt_that_lost_its_client_is_never_retried"
fix = "85ef9a3"
note = "Fixed in proxy.rs: relay_full_body decides through attempt_end, where a pipe that ended with an ErrorSource::Downstream error is AttemptEnd::Fail whatever the attempt recorded; an upstream error or an abandoned header with a recorded retry still retries, and a written response is done. Not covered: an upstream error that lands in the same instant as the client's close (the pipe reports the upstream one first, biased); the next attempt's pipe then sees the client gone at once and ends, but that attempt may already have connected."

