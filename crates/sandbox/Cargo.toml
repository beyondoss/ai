[package]
name = "beyond-sandbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true
description = "Use a sandbox over the exec protocol: raw exec, files and search, jobs"

[lib]
name = "beyond_sandbox"

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.22"
# The notify notifier script (`SH`) spliced into the job supervisor, and its URL check.
beyond-exec-notify = { path = "../exec-notify" }
getrandom = { version = "0.3", features = ["std"] }
globset = "0.4"
hex = "0.4"
regex = "1"
# The HTTP client: rustls with `ring` (named once in `tls.rs`; reqwest's own `rustls` feature would
# link aws-lc-sys instead).
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# The archive: written and read by the `tar` crate; the policy layer around it is `bulk/extract.rs`.
tar = { version = "0.4", default-features = false }
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
beyond-sandbox-conformance = { path = "../sandbox-conformance" }
beyond-test-support = { path = "../test-support" }
hmac = "0.12"
rcgen = "0.13"
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
