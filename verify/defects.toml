impact = "A stream refused by GOAWAY (above the server's last processed stream id) was never processed and is safe to resend, but the 'never resend a delivered body' rule (D09) treats it as delivered. Under load, a provider's routine H2 connection recycling surfaces as client 502s."
confidence = "high"
evidence = "claims_reliability.rs::upstream_goaway_is_handled fails under full-suite load (sequential #3: 502), passes 10/10 alone"
claims = ["REL-22", "REL-1"]
state = "fixed"
test = "a_stream_the_upstream_refused_is_retried"
fix = "25d95ea"
note = "Fixed: error_while_proxy treats a stream the provider refused (upstream_refused_stream: remote RST_STREAM(REFUSED_STREAM), or a remote GOAWAY error, which h2 gives only to streams above last_stream_id) as not delivered and resends it on a fresh connection to the same candidate (FullBody: its reset retry). Reproduction: a hand-rolled TLS H2 upstream refuses each connection's second stream after its body arrives, by GOAWAY(last_stream_id = the served stream) or RST_STREAM(REFUSED_STREAM); both 502'd before the fix. The mock's REFUSED_STREAM refuses only the second stream (it first refused every later stream on the connection, which a retry on the same connection could never pass). upstream_goaway_is_handled: 3 full-suite runs plus a 40x stress beside a concurrent suite, no failures. Residual (documented): a stream opened after the GOAWAY already arrived is ignored by the server and fails as a broken pipe, indistinguishable from a processed one, so it stays a 502."

