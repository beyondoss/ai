[package]
name = "beyond-ai-verify"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "Claim registry, defect ledger and status/gate for the gateway verification suite"

[[bin]]
name = "verify"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml = "0.8"

[dev-dependencies]
# Port read-back for test subprocesses (`ports`): no port is picked free, released and rebound.
base64.workspace = true
beyond-ai-providers = { path = "../providers" }
beyond-ai-test-support = { path = "../test-support" }
ed25519-dalek = "2.2"
# The FLT-1 fault proxy (`tests/common/fault_proxy.rs`): terminates the gateway's TLS with a
# throwaway cert and re-originates TLS to the real provider, injecting scripted faults in between.
httparse = "1"
libtest-mimic = "0.8"
rcgen = "0.13"
# Blocking HTTP for the catalog sweep, with the gateway crate's TLS pins (rustls, no OpenSSL).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json.workspace = true
socket2 = "0.6"
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[[test]]
name = "live"
harness = false

[[test]]
name = "reconcile_live"
harness = false

[[test]]
name = "parity_live"
harness = false

[[test]]
name = "catalog_live"
harness = false

[[test]]
name = "tenancy_live"
harness = false

[[test]]
name = "session_live"
harness = false

[[test]]
name = "fault_live"
harness = false

[[test]]
name = "long_live"
harness = false

[lints]
workspace = true
