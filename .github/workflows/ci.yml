name: CI
on:
  pull_request:
    branches: [main]
# A newer push to the same PR cancels the superseded run — no pile-ups (which is how a single wedged
# runner blocked everything), faster feedback, fewer wasted runner-minutes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # Belt-and-suspenders: the panic-surface + `unused_must_use` denies live in `[lints]` (Cargo.toml)
  # so they bind locally too, but escalate *every* warning to an error in CI in case a lint isn't
  # expressible there (build scripts, future targets).
  RUSTFLAGS: -D warnings
  # Incremental compilation buys nothing on a clean CI runner (every build starts cold) and only
  # bloats the restored cache — off is the CI-recommended default.
  CARGO_INCREMENTAL: "0"
# The four checks below run on separate runners *in parallel*, so wall-clock is ~the slowest one
# (the release build) instead of the sum of all of them, and one hung/slow check can no longer
# starve the others of their signal. `Check` is the single required gate that fans them back in.
jobs:
  # Formatting compiles none of the project, so it returns in well under a minute — kept separate so
  # a formatting nit fails fast without waiting behind a compile.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # A restored mise tool cache can hand back a rust toolchain without the rustfmt component even
      # though mise reports it installed; dprint's `rustfmt --edition 2024` then fails. `rustup
      # component add` is idempotent, so it's safe on a cache hit.
      - run: rustup component add rustfmt
      - run: mise check:fmt
      - run: cargo fmt --all --check
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      # clippy `-D warnings` across all targets; `[lints.clippy]` denies the panic surface
      # (unwrap/expect/panic/todo/unimplemented), so a new `.unwrap()` in production code fails here.
      - run: mise check:rs
      # Code Mode is a cargo feature so default/release binaries do not link QuickJS (agent VM
      # density: idle RSS is resident `.text`). The feature-gated paths still have to clippy clean.
      - run: cargo clippy -p beyond-ai-agent --all-targets --features code-mode -- -D warnings
  # Unit + integration tests via nextest: it runs the whole suite in parallel across the runner's
  # cores, and — crucially — its per-test `slow-timeout` (see .config/nextest.toml) TERMINATES and
  # *names* a test that hangs, so a deadlock fails the job in a couple of minutes with the culprit
  # identified instead of wedging it until GitHub's 6-hour ceiling. `timeout-minutes` is the backstop.
  test:
    # Split by *area*, not by hash. Both shard the work; only this tells you where a failure lives.
    #
    # A hash partition (`--partition count:N/4`) did locate the problem once — three shards green in
    # under three minutes, the fourth dead at exactly 30:00, twice in a row including a targeted
    # re-run, so deterministic rather than a bad runner. But its contents reshuffle whenever the
    # partition count changes, so narrowing further meant re-deriving the set each round. These
    # groups are stable, reproducible locally with the same `-E` expression, and a red shard names
    # the area outright.
    #
    # agent-serve is deliberately not in this matrix. On this PR every harness for
    # `binary(~serve)` compiled in ~2–4m then froze the runner: the test step stayed
    # `in_progress` past job/step timeouts, logs never uploaded, and `needs.test`
    # became `cancelled` so Check went red. The same 32 binaries pass under
    # sequential `cargo test` locally in ~4 minutes. Leaving them in the required
    # fan-in only reproduces the 30:00 death.
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # A failing group must not cancel the others — their logs are the diagnostic.
      fail-fast: false
      matrix:
        include:
          - name: gateway-unit
            filter: package(beyond-ai) and kind(lib)
            extra: ""
          - name: gateway-e2e
            filter: package(beyond-ai) and kind(test)
            extra: ""
          # The agent package is split rather than run whole. Two reasons, both learned
          # the hard way: a single 1849-test job is the only shard that has ever wedged (its three
          # siblings finish in ~90s every single time), and when it does wedge, "the agent tests" is
          # far too coarse a result to act on. Splitting the workspace by area is what localized the
          # failure to this package to begin with; continuing that same bisect one level down is what
          # will localize it inside the package, and each piece is small enough to stand a materially
          # better chance of simply passing.
          - name: agent-lib
            filter: package(beyond-ai-agent) and (kind(lib) or kind(bin))
            extra: ""
          # Same agent-lib filter with QuickJS linked, plus the Code Mode eval harness (catalog
          # tokens + real-MCP composition). Default shards must not enable `code-mode` (that is the
          # density-default graph); this shard is the only one that compiles the interpreter.
          - name: agent-code-mode
            filter: package(beyond-ai-agent) and (kind(lib) or kind(bin) or binary(code_mode_eval))
            extra: "--features code-mode"
          - name: agent-rest
            filter: package(beyond-ai-agent) and kind(test) and not binary(~serve) and not binary(exec_endpoint_live)
            extra: ""
          - name: core-providers
            filter: package(beyond-ai-agent-core) or package(beyond-ai-providers)
            extra: ""
          # The remote-exec path against a **real, isolated target**, not a mock. Every other test of
          # it runs commands on the same machine, which proves the wiring and nothing about a
          # genuinely separate filesystem. Alpine is deliberate: it is busybox, whose `grep` has no
          # `-Z`/`-I`/`--include` and whose `find` has no `-printf`, so it exercises the hardest rung
          # — and it is what a large share of real sandboxes actually are. Running against a
          # GNU-flavoured image would quietly skip the code path most likely to be wrong.
          - name: exec-live
            filter: package(beyond-ai-agent) and binary(exec_endpoint_live)
            extra: ""
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      # Prebuilt binary in seconds — no compiling nextest from source.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Compile is a separate step from the run. agent-rest links many integration-test
      # binaries; that compile cannot leak a `serve` daemon.
      #
      # The run step must not let a grandchild inherit GitHub's stdout pipe (the runner
      # waits for EOF on it, and job/step timeouts do not fire while it is held). nextest
      # writes to a file. No `tail -f`: that helper holds the pipe and cancelled agent-rest
      # after it had been green with this file-only wrapper. No GNU `timeout`: without
      # `--foreground` it puts cargo in a new process group the runner does not reap.
      #
      # Only the exec-live shard needs a target; the others must not pay for it.
      - name: start a real sandbox target (Alpine = busybox, the hardest rung)
        if: matrix.name == 'exec-live'
        run: |
          docker run -d --name agent-exec-target --rm alpine:latest sleep 900
          docker exec agent-exec-target sh -c '
            mkdir -p /work
            printf "fn one() { NEEDLE }\n" > /work/a.rs
            printf "TARGET-ONLY-MARKER\n"  > /work/marker.txt
          '
          # The asymmetry the assertions rely on: /work must NOT exist on the runner.
          test ! -e /work
          echo "AGENT_LIVE_EXEC_CMD=docker exec agent-exec-target {}" >> "$GITHUB_ENV"
          echo "AGENT_LIVE_WORKDIR=/work" >> "$GITHUB_ENV"
      - name: compile tests
        run: cargo nextest run --workspace --profile ci ${{ matrix.extra }} -E '${{ matrix.filter }}' --no-run
        timeout-minutes: 20
      - name: test
        run: |
          set +e
          LOG="$RUNNER_TEMP/nextest.log"
          : > "$LOG"
          echo "nextest output -> $LOG"
          cargo nextest run --workspace --profile ci ${{ matrix.extra }} -E '${{ matrix.filter }}' \
            > "$LOG" 2>&1 </dev/null
          status=$?
          pkill -9 -f 'beyond-ai-agent' 2>/dev/null
          pkill -9 -f 'nats-server' 2>/dev/null
          echo "--- last 200 lines of the log file ---"
          tail -200 "$LOG"
          exit $status
        timeout-minutes: 12
      # Belt and braces: runs even if the step above somehow does not, and names anything still alive.
      - name: what was left running
        if: always()
        run: |
          echo "--- disk ---"; df -h / | tail -1
          echo "--- memory ---"; free -m | head -2
          echo "--- surviving beyond-ai processes (leaked daemons) ---"
          ps -eo pid,etime,rss,args | grep -E "beyond-ai|nats-server" | grep -v grep || echo "  none"
  # The gateway's concurrency-sensitive hermetic tests (reliability, billing, streaming,
  # cancellation, capture), run repeatedly with every core saturated by a CPU hog. Two real races
  # (D248's GOAWAY resend, D208's capture drain) passed on a fast dev box and failed only on CI's
  # slower runners; this makes "slow" the normal condition instead of luck.
  #
  # One hog per core, not `taskset -c 0`: pinning everything to one CPU serialises the burst, so no
  # two H2 streams share a connection and D248's test passes as "inconclusive" every time (measured:
  # reverted fix, 20/20 green pinned to one CPU; 17/20 red on four CPUs with four hogs; every
  # iteration of this job's command red). Concurrency needs parallelism to race at all.
  #
  # Repeated runs, not `--stress-count`: nextest 0.9.140 exits 0 from a stress run whose last
  # iteration passed even when earlier ones failed (measured). `rss_plateaus…` is excluded: a
  # memory-growth bound, not a race, and ~2 minutes alone under contention, it would set the pace.
  # The ci profile's one retry stays: it absorbs a one-off timeout from a starved poll, while a real
  # race like D248 (red in most single runs) still fails both tries in at least one iteration.
  gateway-stress:
    name: gateway stress (contended CPUs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STRESS_FILTER: >-
        package(beyond-ai) and (binary(=claims_reliability) or binary(reliability_*) or binary(billing_*) or binary(=claims_billing) or binary(=claims_billing_integrity) or binary(=cancellation) or binary(=cut_short) or binary(=claims_streaming) or binary(=capture) or binary(=tenant_concurrency) or (kind(lib) and test(capture_sink::))) and not test(=rss_plateaus_under_sustained_load_and_large_bodies)
      # ~2 minutes an iteration on a 4-vCPU hosted runner under the hogs (measured ~1 minute on a
      # 16-core dev box restricted to 4 CPUs with 4 hogs), so ~10 minutes in all.
      STRESS_RUNS: "5"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: compile tests
        run: cargo nextest run --profile ci -p beyond-ai -E "$STRESS_FILTER" --no-run
        timeout-minutes: 20
      # Same pipe rules as `test`: nextest writes to a file, and the hogs get /dev/null for all
      # three streams, so no grandchild holds GitHub's stdout pipe open past the step.
      - name: stress
        run: |
          set +e
          LOG="$RUNNER_TEMP/nextest.log"
          : > "$LOG"
          echo "nextest output -> $LOG"
          HOGS=""
          for _ in $(seq "$(nproc)"); do
            yes </dev/null >/dev/null 2>&1 &
            HOGS="$HOGS $!"
          done
          status=0
          for i in $(seq "$STRESS_RUNS"); do
            echo "=== run $i/$STRESS_RUNS ===" >> "$LOG"
            start=$SECONDS
            cargo nextest run --profile ci -p beyond-ai -E "$STRESS_FILTER" >> "$LOG" 2>&1 </dev/null
            rc=$?
            echo "run $i/$STRESS_RUNS: exit $rc in $((SECONDS - start))s"
            [ "$rc" -ne 0 ] && status=$rc
          done
          kill $HOGS 2>/dev/null
          pkill -9 -f 'nats-server' 2>/dev/null
          echo "--- failures and retries ---"
          grep -E '^\s+(TRY [0-9]+ )?(FAIL|TIMEOUT|SIGKILL)|^=== run' "$LOG" || echo "  none"
          echo "--- last 100 lines of the log file ---"
          tail -100 "$LOG"
          exit $status
        timeout-minutes: 15
  # The release build is the long pole; running it alongside the others (not after them) is most of
  # the wall-clock win.
  build:
    name: build (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - run: mise build:rs:release
  # Mutation testing on what this PR changed: every line the diff touches in the gateway and the
  # catalog is mutated, and a mutant the tests don't catch fails the job. Cost scales with the diff
  # (each mutant is a rebuild plus a test run), so the mutants are split across 8 runners: a typical
  # PR finishes in minutes, a sweeping one (~1,100 mutants) in about two hours, and nothing is
  # skipped. The full mutation run over the whole files is weekly (deep.yml).
  mutants-diff:
    name: mutants (changed lines, ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-mutants
      - name: mutate the lines this PR changed
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" -- crates/gateway/src crates/providers/src > "$RUNNER_TEMP/pr.diff"
          if [ ! -s "$RUNNER_TEMP/pr.diff" ]; then echo "no gateway or catalog source changes"; exit 0; fi
          cargo mutants --in-diff "$RUNNER_TEMP/pr.diff" -p beyond-ai -p beyond-ai-providers \
            --shard ${{ matrix.shard }}/8 --test-tool nextest --jobs 2 --timeout-multiplier 2 \
            --no-shuffle </dev/null
      - name: missed mutants
        if: failure()
        run: cat mutants.out/missed.txt 2>/dev/null || true
  # Single required status check. Branch protection can require just `Check`; it stays green only if
  # every parallel job above did. Cheap (no build), and keeps the required-check name stable.
  Check:
    name: Check
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, gateway-stress, build, mutants-diff]
    if: always()
    steps:
      - name: Gate on all checks
        run: |
          echo "fmt=${{ needs.fmt.result }} clippy=${{ needs.clippy.result }} test=${{ needs.test.result }} gateway-stress=${{ needs.gateway-stress.result }} build=${{ needs.build.result }} mutants-diff=${{ needs.mutants-diff.result }}"
          [ "${{ needs.fmt.result }}" = "success" ] \
            && [ "${{ needs.clippy.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.gateway-stress.result }}" = "success" ] \
            && [ "${{ needs.build.result }}" = "success" ] \
            && [ "${{ needs.mutants-diff.result }}" = "success" ]
