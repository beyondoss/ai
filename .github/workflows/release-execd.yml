name: Release execd
# Builds beyond-ai-execd (the in-sandbox exec endpoint) as a fully static musl binary for linux/amd64
# and linux/arm64 and attaches execd-<tag>-linux-<arch>.tar.gz (+ .sha256) and install-execd.sh to
# the tag's GitHub Release. Sibling of release-agent.yml, same reasoning: native musl-gcc on a native
# runner per arch (no cross-linker), and `relocation-model=static` because a static-pie musl binary
# segfaults at startup in some environments. Profile-guided like the agent (see below); execd runs in
# arbitrary provider sandbox images, so nothing in the build needs a particular libc.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    name: Build & publish execd (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}
      - name: Build execd (static musl, PGO)
        run: |
          linker_env="CARGO_TARGET_$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')_LINKER"
          cc_env="CC_$(echo '${{ matrix.target }}' | tr '-' '_')"
          export "$linker_env=musl-gcc"
          export "$cc_env=musl-gcc"

          # Profile-guided optimization, for MEMORY: an idle execd's resident set is mostly code, and
          # PGO groups the code that runs so the kernel's fault-around drags in fewer neighbours
          # (about 300 KiB less idle PSS). Same three stages as release-agent.yml, trained per arch
          # on the native runner (profiles are architecture-specific) and generated fresh each
          # release rather than checked in.
          #
          # A RUSTFLAGS variable REPLACES any rustflags in cargo config, so
          # `-C relocation-model=static` (static-pie musl segfaults in some environments, and
          # non-PIE is also the smaller resident set) is carried in every stage.
          PROFDIR="$RUNNER_TEMP/pgo"
          rm -rf "$PROFDIR"; mkdir -p "$PROFDIR/raw"
          host="$(rustc -vV | awk '/^host: /{print $2}')"
          profdata="$(rustc --print sysroot)/lib/rustlib/$host/bin/llvm-profdata"
          test -x "$profdata" || { echo "llvm-profdata missing at $profdata"; exit 1; }

          RUSTFLAGS="-Cprofile-generate=$PROFDIR/raw -C relocation-model=static" \
            cargo build --release --locked -p beyond-ai-execd --target ${{ matrix.target }}
          python3 .github/pgo-train-execd.py \
            "target/${{ matrix.target }}/release/execd" "$PROFDIR/raw"
          "$profdata" merge -o "$PROFDIR/merged.profdata" "$PROFDIR"/raw/*.profraw

          # Never let the shipped binary inherit instrumentation.
          rm -rf "target/${{ matrix.target }}/release"
          RUSTFLAGS="-Cprofile-use=$PROFDIR/merged.profdata -C relocation-model=static" \
            cargo build --release --locked -p beyond-ai-execd --target ${{ matrix.target }}
      - name: Verify the binary is static
        run: |
          bin="target/${{ matrix.target }}/release/execd"
          file "$bin"
          file "$bin" | grep -q 'statically linked'
          # glibc's ldd says "not a dynamic executable" (exit 1) for a static binary.
          if ldd "$bin" 2>&1 | grep -vq 'not a dynamic executable\|statically linked'; then
            echo "execd is dynamically linked"; ldd "$bin"; exit 1
          fi
          ls -l "$bin"
      - name: Package release asset
        run: |
          mkdir -p dist
          name="execd-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz"
          tar -C target/${{ matrix.target }}/release -czf "dist/$name" execd
          # `<hash>  <file>`, relative to dist/, so `sha256sum -c` works next to the tarball.
          (cd dist && sha256sum "$name" > "$name.sha256")
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the release once; the other jobs' creates are no-ops (`|| true`). Every upload
          # is a distinct file (the installer is identical across arches), so `--clobber` never races.
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --generate-notes || true
          name="execd-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz"
          gh release upload "${{ github.ref_name }}" "dist/$name" "dist/$name.sha256" \
            --repo "${{ github.repository }}" --clobber
          gh release upload "${{ github.ref_name }}" deploy/execd/install-execd.sh \
            --repo "${{ github.repository }}" --clobber
