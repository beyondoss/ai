title = "A stream the provider accepted (200 head) but that dies before its first body byte bills zero"
impact = "B2 and BIL-20 say a stream cut short is billed an estimate, non-zero once the upstream accepts. A provider that answers 200 and then stalls or drops before the first event has the prompt and bills it (here the whole generation), but the row is outcome cut_short with 0 input, 0 output and usage_estimated false. When the gateway has not yet committed the head downstream (the translated path waits for the first bytes), the same stall ends in the gateway's 504, the SDK retries it, and the provider bills two generations while the ledger holds one (BIL-14)."
