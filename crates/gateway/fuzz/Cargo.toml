[package]
name = "beyond-ai-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: libFuzzer needs a nightly toolchain and sanitizer flags, so this crate is built
# only by `mise run fuzz`, never by the main workspace's `cargo build`.
[workspace]

[dependencies]
base64 = "0.22"
beyond-ai = { path = "..", features = ["mint"] }
ed25519-dalek = "2.2"
libfuzzer-sys = "0.4"
serde_json = "1"

# The shipped binary checks overflow in release; the fuzzed build must too.
[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "peek"
path = "fuzz_targets/peek.rs"
test = false
doc = false
bench = false

[[bin]]
name = "usage"
path = "fuzz_targets/usage.rs"
test = false
doc = false
bench = false

[[bin]]
name = "translate"
path = "fuzz_targets/translate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key"
path = "fuzz_targets/key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signed_id"
path = "fuzz_targets/signed_id.rs"
test = false
doc = false
bench = false
