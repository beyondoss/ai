[package]
name = "beyond-execd"
version = "0.1.19"
edition.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true
description = "execd: a production exec endpoint that runs inside a sandbox and speaks the agent's exec protocol (the whole protocol)"

[lib]
name = "execd"
path = "src/lib.rs"

[[bin]]
name = "execd"
path = "src/main.rs"

[lints]
workspace = true

[features]
# The global allocator under test in the Memory measurements; off in the shipped build unless the
# numbers say otherwise.
mimalloc = ["dep:mimalloc"]

[dependencies]
base64.workspace = true
# The notify timing kernel: when a callback is owed, retried or given up. Every endpoint drives the
# same pure function.
beyond-exec-notify = { path = "../exec-notify", version = "0.1.0" }
bytes.workspace = true
# The jitter draw for a retry's wait (one u32 per failed attempt).
getrandom = { version = "0.3", features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
# `server-auto` serves HTTP/1.1 and prior-knowledge HTTP/2 (h2c) on the one listener.
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
# Process groups, subreaper, the pipe-size query and the socket's user timeout, as safe wrappers:
# the workspace forbids `unsafe_code`.
mimalloc = { version = "0.1.52", default-features = false, optional = true }
nix = { version = "0.31", default-features = false, features = ["fs", "net", "process", "signal", "socket", "user"] }
# Where the OS trust store lives (honours SSL_CERT_FILE and SSL_CERT_DIR), to say when it is empty.
openssl-probe = "0.1"
# Job-end callbacks over HTTPS that verify the server and never follow a redirect: rustls with
# `ring` and the OS trust store, as the agent's own client. The provider is installed before the
# client is built (`rustls-no-provider` has no default).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
# Not `workspace = true`: the workspace holds tokio below 1.54 for pingora (the gateway), a cap an
# embedder of this crate should not inherit. 1.53.3 is the advisory floor (#506); caret, no ceiling.
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true

[dev-dependencies]
# The conformance verifier lives in the agent, the only client of the protocol; the test runs it
# against the real binary. A dev-dependency only: execd itself links neither.
beyond-agent = { path = "../agent" }
beyond-test-support = { path = "../test-support" }
hyper = { version = "1", features = ["client", "http2"] }
memchr = "2"
tempfile = "3"

# A/B comparison of execd against the reference endpoint, over HTTP on loopback.
[[bench]]
name = "exec_compare"
harness = false
