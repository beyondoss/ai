[[claim]]
id = "E4"
priority = "P0"
group = "Endpoints and SDK compatibility"
text = "/v1/models lists every row and stock SDKs read it"
oracle = "models.list() returns 101 with card fields"
layer = "both"
clients = ["openai-py", "openai-node", "anthropic-py", "anthropic-ts", "raw"]
client_note = "Not ai-sdk: the pinned AI SDK (ai 7.0.126, @ai-sdk/openai 4.0.83, @ai-sdk/anthropic 4.0.71, @ai-sdk/openai-compatible 3.0.62) has no model-listing call for an OpenAI, Anthropic or OpenAI-compatible provider; its only listing, getAvailableModels(), belongs to Vercel's own gateway provider and reads GET {baseURL}/config, not /v1/models. Not opencode: opencode 1.18.34 never reads a custom provider's /v1/models. It takes models from models.dev and the provider's config; with a provider configured and no models, `opencode models beyond` says \"Provider not found\" and `opencode run` fails, and the recording proxy saw no request at all (2026-10-01). Its listing of a config generated from /v1/models is claim E7."
failover_clients = []
touches = ["crates/providers/src/catalog.rs", "crates/gateway/src/proxy.rs"]
defects = []

[[claim]]
id = "E7"
priority = "P0"
group = "Endpoints and SDK compatibility"
text = "Agent harnesses list every catalog model with its context window, output limit and pricing, and the session cost they display matches the billing rows"
oracle = "harness model list = /v1/models ids; limits and prices match the card; the cost a harness displays through the gateway equals what it displays calling the provider directly for the same usage; usage the client's wire format cannot express (e.g. client-requested cache writes on the OpenAI wire) is a client limitation shared with direct use, not a gateway gap. A harness that can't discover models gets config generated from /v1/models, never hand-written"
layer = "live"
# Harnesses that show a model list and a session cost. Not codex: it lists only its bundled catalog
# (a model_catalog_json needs Codex's own system prompt per model, which no /v1/models carries) and
# displays no cost. Not ai-sdk: a library, with no model list or cost display of its own.
clients = ["opencode", "pi", "claude-code"]
failover_clients = []
touches = ["crates/providers/src/catalog.rs", "crates/gateway/src/proxy.rs"]
defects = ["D21", "D63", "D76", "D157"]

[[claim]]
id = "E5"
priority = "P1"
group = "Endpoints and SDK compatibility"
text = "count_tokens, input_tokens and compact forward to their provider"
oracle = "counts free (no row), compact billed"
layer = "both"
clients = ["anthropic-py", "openai-py", "claude-code", "raw"]
client_note = "Not codex: Codex 0.159.3 never calls a count or compact endpoint through a gateway. On a custom model_provider it compacts locally, with an ordinary /v1/responses call carrying its checkpoint prompt (seen by the recording proxy at model_auto_compact_token_limit = 9000, and in LNG-1's Codex session); on the built-in openai provider with openai_base_url it did not compact at all at a limit of 3000. In neither did it send /v1/responses/input_tokens or /v1/responses/compact (2026-10-01). Claude Code counts tokens (count_tokens) for /context; neither harness calls a compact endpoint."
failover_clients = []
touches = [
  "crates/gateway/src/route.rs",
  "crates/gateway/src/proxy.rs",
  "crates/gateway/src/usage.rs",
]
defects = []

