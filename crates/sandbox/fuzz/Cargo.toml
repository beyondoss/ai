[package]
name = "beyond-sandbox-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: libFuzzer needs a nightly toolchain and sanitizer flags, so this crate is built
# only by `cargo fuzz` (`mise run fuzz`, deep.yml), never by the main workspace's `cargo build`.
[workspace]

[dependencies]
base64 = "0.22"
beyond-sandbox = { path = ".." }
libfuzzer-sys = "0.4"
serde_json = "1"
tar = { version = "0.4", default-features = false }
tempfile = "3"

# The shipped binary checks overflow in release; the fuzzed build must too.
[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "records"
path = "fuzz_targets/records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "colon"
path = "fuzz_targets/colon.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stat"
path = "fuzz_targets/stat.rs"
test = false
doc = false
bench = false

[[bin]]
name = "listing"
path = "fuzz_targets/listing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "base64"
path = "fuzz_targets/base64.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jobs"
path = "fuzz_targets/jobs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extract"
path = "fuzz_targets/extract.rs"
test = false
doc = false
bench = false
