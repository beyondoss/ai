# nextest configuration. The `ci` profile is what CI runs (`--profile ci`); `default` covers local runs.

[profile.default]
# Print a "SLOW" line once a test crosses 60s so slow tests are visible without failing anyone.
slow-timeout = { period = "60s" }
fail-fast = false

[profile.ci]
# The important one: after a test has been SLOW for 3 periods (60s × 3 = 180s) with no result, nextest
# TERMINATES it and reports it as a timeout failure — by name. A deadlocked/hung test therefore fails
# the job in ~3 minutes with the culprit identified, instead of wedging the whole run until GitHub's
# 6-hour ceiling (which is exactly what happened before this split). 180s is comfortably above any
# legitimate test here (the slowest are large-file reads and process-spawn tests, all seconds).
slow-timeout = { period = "60s", terminate-after = 3 }
# Whole-run cap, compile excluded (CI compiles with `--no-run` first). A wedged nextest then exits
# instead of sitting on GitHub's pipe until the ~30m cancel that fails the required Check gate.
global-timeout = "10m"
# One retry absorbs a genuine one-off timing blip on a shared runner without reding the PR; a test that
# fails (or hangs) on *every* attempt still fails, and nextest prints the retried test's name either
# way — so a flaky hang is surfaced, not silently masked.
retries = 1
fail-fast = false
# Cap concurrency. nextest defaults to one test thread per core, and an *agent* test is not one
# process: each spawns `beyond-ai-agent` children, a mock model server, sometimes an MCP fixture. On a
# 4-core / 7 GB hosted runner that multiplies into memory the runner does not have, and the failure is
# not a test failure — the runner itself dies, so neither the per-test terminate-after nor the
# `global-timeout` below ever gets to fire, and the job sits until GitHub cancels it at 30 minutes with
# no log. Four keeps the shards well under a minute each while leaving headroom for the children.
test-threads = 4

[profile.deep]
# The weekly property run (.github/workflows/deep.yml) at PROPTEST_CASES=100000 with PROPS_SECS=5400:
# one property can take far longer than `ci`'s 180s kill. A test is terminated after 100 minutes
# (past the 90-minute PROPS_SECS box, so the box ends a runaway property first, with its case count),
# and the whole run after 5 hours, under the job's 330-minute timeout. No retries: a property
# failure prints the PROPS_SEED that replays it, and a retry with a fresh seed would hide it.
slow-timeout = { period = "60s", terminate-after = 100 }
global-timeout = "300m"
retries = 0
fail-fast = false
test-threads = 4

[profile.verify]
# `mise run verify:status`: runs every test tagged with a claim or defect, ignored reproductions
# included, and writes the JUnit report the `verify` tool computes status from. Failures are
# expected here (a reproduced defect's test fails until it's fixed), so nothing stops early.
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 3 }

# Billing reconciliation waits up to 15 minutes for the providers' usage reports to catch up with
# its batch (see verify/README.md), so it gets its own cap.
[[profile.verify.overrides]]
filter = "binary_id(beyond-ai-verify::reconcile_live)"
slow-timeout = { period = "60s", terminate-after = 18 }

# A long coding session runs 3-10 minutes, then (where reconciled) waits up to 15 more for the
# provider's usage report (crates/verify/tests/long_live.rs).
[[profile.verify.overrides]]
filter = "binary_id(beyond-ai-verify::long_live)"
slow-timeout = { period = "60s", terminate-after = 35 }

# A long-output live cell (`long_output*` in crates/verify/tests/live.rs) streams ~32k tokens,
# ~135s on Claude Haiku 4.5, past the 180s default once the gateway boots and speed varies.
[[profile.verify.overrides]]
filter = "binary_id(beyond-ai-verify::live) & test(/long_output/)"
slow-timeout = { period = "60s", terminate-after = 6 }

[profile.verify.junit]
path = "junit.xml"

# `mise run verify:live`'s second phase: the reconciled live cells (those claiming BIL-5), after
# every other cell has finished, so no other suite's traffic is in their providers' usage reports
# (verify/README.md). Same settings as `verify`, its own report. `inherits` does not carry
# `verify`'s overrides (measured: nextest 0.9.140 killed a long session at 180s), so they are
# repeated here.
[profile.verify-isolated]
inherits = "verify"

[[profile.verify-isolated.overrides]]
filter = "binary_id(beyond-ai-verify::reconcile_live)"
slow-timeout = { period = "60s", terminate-after = 18 }

[[profile.verify-isolated.overrides]]
filter = "binary_id(beyond-ai-verify::long_live)"
slow-timeout = { period = "60s", terminate-after = 35 }

[profile.verify-isolated.junit]
path = "junit.xml"
