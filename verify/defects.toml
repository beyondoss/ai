evidence = "props_numbers::prop_tool_argument_numbers_keep_their_value, minimized: Chat history arguments {\"n\":-1.32417719719006e-11} -> Messages tool_use input {\"n\":-1.3241771971900598e-11}; {\"n\":2.380369113685511e-306} -> 2.3803691136855108e-306. Messages tool_use input {\"n\":123456789012345678901234567890} -> Chat arguments {\"n\":1.2345678901234568e29}. Integers within i64/u64 and decimals up to 7 significant digits survive (200,000 cases)."
claims = ["T1"]
state = "fixed"
test = "tool_argument_numbers_keep_their_value"
fix = "511afaa"
note = "Found by the property suites. Proposed: enable serde_json's `float_roundtrip` (correct rounding), and keep arguments as raw JSON text where they are only relayed (RawValue, or `arbitrary_precision` if every consumer tolerates it). Fixed in 511afaa: arguments holding a number a serde_json Value keeps as an f64 keep their text. A Chat `arguments` string becomes a one-entry stand-in (translate::RAW_JSON_KEY) that translate::Exact, now behind encode and value_string, writes back verbatim, validated as one JSON value so a client object carrying the key cannot splice bytes; a Messages body whose tool_use inputs hold one is parsed a second time (KeepInputs) keeping each `input`'s raw text. arbitrary_precision was rejected: it is crate-wide and breaks untagged enums holding numbers, which async-nats' JetStream responses are. Cost (new benches in benches/unit.rs translate): a Messages tool call with a decimal onto a Chat client 4.0 -> 5.4 us; integer-only arguments and 20 replayed Chat calls onto Messages unchanged. props_numbers now generates integers past u64, 8-25 digit decimals and exponents out to f64's edges."

