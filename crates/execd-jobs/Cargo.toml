[package]
name = "beyond-execd-jobs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true
description = "execd's job-table kernel: the decisions of the job table as pure functions, proven in Verus"

[lib]
name = "execd_jobs"
path = "src/lib.rs"

[lints]
workspace = true

# Its one dependency is `vstd`, for the `verus!` macro: a normal build erases every proof and spec, and
# only `cargo verus` (`mise run verify:kernels`) checks them. execd re-exports this crate as
# `execd::job_kernel`, so the table's model (`crates/execd/tests/job_model.rs`) and production call
# the function Verus proves. The version is the one the pinned release ships (`.github/scripts/verus.env`).
[dependencies]
vstd = "=0.0.0-2026-11-01-0251"

[package.metadata.verus]
verify = true

[features]
# Mutations of the kernel's decisions, each removing one guard. `execd` forwards them: its model
# (`cargo test -p beyond-execd --features <mut> --test job_model the_mutation`) and the proof
# (`mise run verify:kernels -- --features <mut>`, which runs here) both go red under them.
mut_start_overwrites = [] # a start of a key in the table replaces it (J1)
mut_scope_ignored = [] # a lookup by id alone, any scope (J2)
mut_remove_keeps_entry = [] # a removed job stays in the table (J3)
mut_end_rewritten = [] # a second end rewrites an ended job's code (J4)
mut_disconnect_kills_kept = [] # a held start's client leaving kills a kept job (J6)
mut_remove_live = [] # a job is taken out with its group alive (J7)
mut_signal_ended = [] # `signal` reaches an ended job's group, whose number may be reused (J8)
mut_ended_not_removable = [] # `remove` waits for the group to look empty, even for an ended job (L1)
mut_stream_follows_key = [] # a stream goes on with whatever job holds its key now (J9)
mut_take_by_key = [] # a take removes whatever job holds the key now, not the job checked (J10)
mut_follow_waits_after_end = [] # a stream never sends its final frame (L2)
mut_signal_after_reap = [] # a signal by number is sent to a group the reaper has freed (J11)
mut_held_forgets = [] # a spawn's group is not held, so a live group is never signalled (J11 liveness)
mut_recover_drops_live = [] # a restart forgets a job whose group is alive (R2)
mut_recover_adopts_gone = [] # a restart adopts a job whose group is gone, so it never ends (R3)
mut_recover_reends_ended = [] # a restart drops an ended job whose group number is gone (R1)
mut_recover_forgets_shell_status = [] # a restart ends a job whose shell had exited with the lost-status code, not the saved one (R3)
mut_job_output_pipe = [] # a job's output goes to a pipe execd reads, so a write after a restart is SIGPIPE (S1)
mut_ledger_spool_per_server = [] # a ledger's spools go in the server's own directory, which goes with it (S7)
mut_unledgered_spool_stable = [] # a server with no ledger leaves its spools in the stable directory (S7)
mut_command_output_spool = [] # a command's output goes to a spool file, not the pipe its client reads (S2)
mut_shutdown_signals_jobs = [] # execd's shutdown signals every recorded job's group (S3)
mut_shutdown_orphans_unrecorded = [] # execd's shutdown leaves a job running that no ledger can ever find (S3b)
mut_term_keeps_jobs = [] # a stop (SIGTERM) leaves ledgered jobs running as a restart does (S6)
mut_shutdown_forgets_jobs = [] # execd's shutdown empties the ledger of its jobs (S4)
mut_shutdown_spares_commands = [] # execd's shutdown leaves a command's group running with no client (S5)
mut_resume_cursor_lags = [] # a restart reads a stream again from its cursor, journalled bytes included (X1)
mut_resume_end_drops_journal = [] # a restart's ring ends before the journalled bytes, so offsets move (X2)
mut_resume_replays_chunked = [] # a journalled byte already in a chunk file is put in the ring again (X3)
mut_stdin_replays = [] # bytes below `written` are applied again (W2)
mut_stdin_applies_ahead = [] # a write ahead of `written` applies at once instead of waiting (W5)
mut_stdin_writes_ended = [] # a write lands on an ended or removed job's stdin (W3)
mut_stdin_writes_after_eof = [] # a write lands after EOF closed the stdin (W4)
mut_stdin_waiters_unbounded = [] # a job's stdin admits every waiting write (W1)
mut_stdin_waiter_stuck = [] # the 16th waiter is refused as well, so a freed slot is never filled (W1-live)
mut_stdin_waits_at_written = [] # a write exactly at `written` waits for bytes that never come (W5-live, progress)
mut_stdin_wait_sticks = [] # a write keeps waiting after the gap filled (W5-live, progress lemma)
mut_stdin_written_shrinks = [] # `written` is set to the last write's size, so it can fall (W2b)
mut_stdin_apply_off_start = [] # an apply skips one byte more than was applied, so it starts past `written` (W2c)
mut_stdin_closes_early = [] # EOF closes the stdin before every byte of the write landed (W4)
mut_key_replay_starts = [] # a start whose key already ran this command starts a second job (K1)
mut_key_digest_ignored = [] # a key used for another command is replayed, not refused (K2)
mut_key_fresh_refused = [] # a fresh key on a free id is refused (K3, the completeness half)
mut_unkeyed_replays = [] # a start with no key can replay a job (K4)
mut_key_forgotten_on_restart = [] # a restart drops the key's record of a job it brings back (K6)
mut_key_record_clears = [] # writing one key's record drops every other record (K7)
mut_key_take_forgets_none = [] # taking a job leaves its key's record behind (K8)
mut_intent_respawns = [] # a keyed start that was claimed but never spawned comes back dropped, so its retry spawns (K9)
mut_key_id_ignored = [] # a key used under another id replays that job, not refused (K1, K2)
mut_key_held_starts = [] # a keyed start with no record of its key takes an id a job holds (K5)
mut_spawn_without_claim = [] # a keyed start whose claim did not reach the disk spawns anyway (K10)
mut_durable_claim_refused = [] # a keyed start whose claim is durable is refused (K16, the liveness partner of K10)
mut_orphan_survives = [] # a restart leaves the processes of a claim it answers as lost running (K11)
mut_bad_key_accepted = [] # a key of more than 128 bytes is accepted (K12)
mut_valid_key_refused = [] # a key of exactly 128 bytes is refused (K13, the liveness partner of K12)
mut_replay_refuses_started = [] # a replay of a removed job that did start says it did not (K14)
mut_replay_waits_forever = [] # a replay of a job that never spawns waits for ever (K15)
