# nextest configuration. The `ci` profile is what CI runs (`--profile ci`); `default` covers local runs.

[profile.default]
# Print a "SLOW" line once a test crosses 60s so slow tests are visible without failing anyone.
slow-timeout = { period = "60s" }
fail-fast = false

[profile.ci]
# The important one: after a test has been SLOW for 3 periods (60s × 3 = 180s) with no result, nextest
# TERMINATES it and reports it as a timeout failure — by name. A deadlocked/hung test therefore fails
# the job in ~3 minutes with the culprit identified, instead of wedging the whole run until GitHub's
# 6-hour ceiling (which is exactly what happened before this split). 180s is comfortably above any
# legitimate test here (the slowest are large-file reads and process-spawn tests, all seconds).
slow-timeout = { period = "60s", terminate-after = 3 }
# Whole-run cap, compile excluded (CI compiles with `--no-run` first). A wedged nextest then exits
# instead of sitting on GitHub's pipe until the ~30m cancel that fails the required Check gate.
global-timeout = "10m"
# One retry absorbs a genuine one-off timing blip on a shared runner without reding the PR; a test that
# fails (or hangs) on *every* attempt still fails, and nextest prints the retried test's name either
# way — so a flaky hang is surfaced, not silently masked.
retries = 1
fail-fast = false
# Cap concurrency. nextest defaults to one test thread per core, and an *agent* test is not one
# process: each spawns `beyond-ai-agent` children, a mock model server, sometimes an MCP fixture. On a
# 4-core / 7 GB hosted runner that multiplies into memory the runner does not have, and the failure is
# not a test failure — the runner itself dies, so neither the per-test terminate-after nor the
# `global-timeout` below ever gets to fire, and the job sits until GitHub cancels it at 30 minutes with
# no log. Four keeps the shards well under a minute each while leaving headroom for the children.
test-threads = 4
