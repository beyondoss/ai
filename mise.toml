[tools]
dprint = "latest"
rust = { version = "1.92", components = "rustfmt,clippy,llvm-tools-preview", targets = "aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu" }
yamlfmt = "latest"
cargo-binstall = "latest"
"cargo:cross" = "latest"
# nats-server for the e2e harness (real JetStream KV backing slipstream).
"ubi:nats-io/nats-server" = { version = "latest", exe = "nats-server" }
# ripgrep for the filesystem-backend parity suite. `ShellFs` has two rungs — `rg`, which matches the
# in-process walker exactly, and a POSIX `grep` fallback with two known divergences — and only a box
# that *has* `rg` can test the strict one. GitHub's runner image does not ship it, so without this the
# strict rung silently stops being covered (it failed loudly instead; see `fs_backend_parity.rs`).
"github:BurntSushi/ripgrep" = { version = "latest", exe = "rg" }

[tasks."build:rs"]
run = "cargo build"

[tasks."build:rs:release"]
run = "cargo build --release"

[tasks."check:release-seams"]
description = "Fail if a release binary carries a test seam's name (run after build:rs:release)."
run = "crates/agent/scripts/scan-release-seams.sh $(find target/release -maxdepth 1 -type f -perm -u+x)"

[tasks."ai:mint-dev-key"]
description = "Mint a deterministic DEV-ONLY signing pubkey + bai_v1 token (fixed seed) for wiring up the dev config. Not for production."
run = "cargo run -p beyond-ai --example mint_dev_key"

[tasks."build:agent"]
run = "cargo build -p beyond-ai-agent"

[tasks."run:agent"]
description = "Run the agent harness CLI (e.g. `mise run run:agent -- tools`)."
run = "cargo run -p beyond-ai-agent --"

[tasks."test:unit:agent"]
description = "Unit tests for the agent harness core (messages, tool registry, session)."
run = "cargo test -p beyond-ai-agent-core"

[tasks."test:code-mode"]
description = "Code Mode evals: catalog-token A/B + execute composition (needs --features code-mode). Live Grok/OpenRouter: OPENROUTER_API_KEY and pass -- --ignored."
run = "cargo test -p beyond-ai-agent --features code-mode --test code_mode_eval -- --nocapture"

[tasks."check:rs"]
run = "cargo clippy --all-targets -- -D warnings"

[tasks."check:fmt"]
run = "dprint check"

[tasks."format"]
run = "dprint fmt && cargo fmt"

[tasks."test:unit:rs"]
description = "Unit tests for the pure-logic modules (key/route/peek/usage/deny/config/resolver)."
run = "cargo test --lib"

# Integration tests (gateway driven against a mock upstream + NATS) — to be added; see ARCHITECTURE.md.
[tasks."test:integration:rs"]
description = "End-to-end gateway tests against a mock provider + docker-compose NATS (TODO)."
run = "cargo test --test '*'"

[tasks."test:smoke"]
description = "Live smoke tests against REAL providers. Auto-loads .env if present; set the API keys you have (ANTHROPIC_API_KEY, OPENAI_API_KEY, AWS_BEARER_TOKEN_BEDROCK, GROQ_API_KEY, …) there or in the environment. Each test skips if its key is unset. Bills real (tiny, max_tokens-capped) requests."
run = """
# Auto-load .env if it exists (export every assignment), so the keys reach the test process.
if [ -f .env ]; then set -a; . ./.env; set +a; fi
cargo test -p beyond-ai --test smoke -- --ignored --nocapture
"""

[tasks."test:smoke:agent"]
description = "Live agent smoke: the real agent binary → real gateway → REAL Anthropic. Auto-loads .env; needs ANTHROPIC_API_KEY. Skips if unset. Bills a tiny real request."
run = """
if [ -f .env ]; then set -a; . ./.env; set +a; fi
cargo test -p beyond-ai-agent --test smoke -- --ignored --nocapture
"""

[tasks."bench:unit"]
description = "divan micro-benchmarks of the IO-free hot paths (key/peek/usage/route/deny/allowance/cache/translate/rank): timing + native allocation counts."
run = "cargo bench --bench unit"

[tasks."bench:e2e"]
description = "A-1 end-to-end bench: real beyond-ai binary + nats-server + mock upstream over HTTP."
run = "cargo bench --bench e2e"

[tasks."bench:decode"]
description = "divan micro-bench of the SSE decode hot path (framing + per-dialect decode + pipeline): timing + native allocation counts."
run = "cargo bench -p beyond-ai-agent-core --bench decode"

[tasks."bench:decode:concurrent"]
description = "Decode concurrency-scaling probe (allocator-contention evidence gate). Add `--features bench-mimalloc` for the control run on a sharded allocator."
run = "cargo bench -p beyond-ai-agent-core --bench decode_concurrent"

[tasks."bench:persistence"]
description = "Session listing scan + durable append micro-bench (timing + allocs)."
run = "cargo bench -p beyond-ai-agent --bench persistence"

[tasks."bench:serve-runtime"]
description = "Process-level Tokio runtime A/B: current_thread vs multi_thread under concurrent serve WebSocket load (RSS, throughput, p95, CPU)."
run = "cargo bench -p beyond-ai-agent --bench serve_runtime"

[tasks."bench"]
description = "Run both bench harnesses (unit micro + e2e macro)."
depends = ["bench:unit", "bench:e2e"]

[tasks."sim:matrix"]
description = "Fleet simulator conformance matrix. `--substrate nfs` needs root + nfs-kernel-server; the default local-dir substrate skips the claims that only a shared mount can show."
run = "cargo run -q -p beyond-ai-fleet-sim --bin fleet-sim -- matrix"

[tasks."sim:list"]
description = "List the fleet simulator's scenarios and which substrate each one needs."
run = "cargo run -q -p beyond-ai-fleet-sim --bin fleet-sim -- list"

[tasks."verify:status"]
description = "Run every claim/defect-tagged test (ignored reproductions included) and print each claim's computed status. See verify/README.md."
run = """
set -e
# Live cells (VERIFY_LIVE=1) drive the gateway binary from this tree; build it first.
if [ "${VERIFY_LIVE:-}" = 1 ]; then cargo build -q -p beyond-ai; fi
expr=$(cargo run -q -p beyond-ai-verify -- filter)
cargo nextest run --workspace --profile verify --run-ignored all --no-tests=pass -E "$expr" || true
# Reconciled live cells (BIL-5) run last, alone: a provider's usage report holds every request
# on the key and model, so no other suite may be sending. See verify/README.md.
rm -f target/nextest/verify-isolated/junit.xml
reports="--junit target/nextest/verify/junit.xml"
if [ "${VERIFY_LIVE:-}" = 1 ]; then
  expr=$(cargo run -q -p beyond-ai-verify -- filter --isolated)
  cargo nextest run --workspace --profile verify-isolated --no-tests=pass -E "$expr" || true
  if [ -f target/nextest/verify-isolated/junit.xml ]; then reports="$reports --junit target/nextest/verify-isolated/junit.xml"; fi
fi
cargo run -q -p beyond-ai-verify -- status $reports "$@"
"""

[tasks."verify:live"]
description = "verify:status including the live cells: real SDKs and agent harnesses, through this tree's gateway, to real providers. Spends real (small) money; reads keys from .env."
env = { VERIFY_LIVE = "1" }
run = "mise run verify:status"

[tasks."verify:catalog"]
description = "Live catalog sweep only (crates/verify/tests/catalog_live.rs): every in-scope candidate through this tree's gateway, then the cost summary and the Together/OpenRouter gap report. ~$2-3 per run; reads keys from .env. VERIFY_CATALOG_PLAN=1 prints the plan and estimate instead."
env = { VERIFY_LIVE = "1" }
run = """
set -e
cargo build -q -p beyond-ai
cargo nextest run -p beyond-ai-verify --test catalog_live --profile verify --no-fail-fast "$@" || true
VERIFY_CATALOG_SUMMARY=1 cargo test -q -p beyond-ai-verify --test catalog_live
VERIFY_CATALOG_GAPS=1 cargo test -q -p beyond-ai-verify --test catalog_live
"""

[tasks."verify:gate"]
description = "Fail on any inconsistency between verify/claims.toml, verify/defects.toml, test tags and the last verify:status run."
run = """
reports="--junit target/nextest/verify/junit.xml"
if [ -f target/nextest/verify-isolated/junit.xml ]; then reports="$reports --junit target/nextest/verify-isolated/junit.xml"; fi
cargo run -q -p beyond-ai-verify -- gate $reports
"""
