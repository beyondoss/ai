[package]
name = "beyond-test-support"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "Test doubles shared by the agent's integration tests and the fleet simulator — not published"

[lints]
workspace = true

[dependencies]
# The `bsg_v1` minter — the edge's half of the grant contract, written from the spec rather than
# shared with the verifier, so a mistake in one cannot cancel out in the other.
base64 = "0.22"
# When the exec double's v1.4 sender calls back: the same pure kernel every endpoint shares.
beyond-exec-notify = { path = "../exec-notify" }
# The conforming exec endpoint the double runs: the shipping code, not a copy of it.
beyond-execd = { path = "../execd" }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
getrandom = { version = "0.3", features = ["std"] }
hkdf = "0.12"
# The exec-endpoint double's v1.4 sender: job-end callbacks over HTTPS that verify the server and
# never follow a redirect. rustls with `ring` and the OS trust store, as the agent's own client; the
# provider is installed before the client is built (`rustls-no-provider` has no default).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json.workspace = true
sha2 = "0.10"
# The exec-endpoint double serves real HTTP and runs real processes.
tokio.workspace = true
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tempfile = "3"
