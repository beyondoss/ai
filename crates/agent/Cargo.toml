[package]
name = "beyond-ai-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Beyond agent harness — CLI (one-shot `run` and headless `serve`)"

[[bin]]
name = "beyond-ai-agent"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The harness core. Depended on by package name; imported as `agent_core` (its lib name).
async-trait.workspace = true
beyond-ai-agent-core = { path = "../agent-core" }
clap.workspace = true
# Draining a `ToolProgress` sink for `serve`'s host-level `bash` RPC command — the same channel type
# `agent_core::ToolProgress` is built on, so we poll it directly rather than adapting between channel
# flavors.
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Global allocator — mimalloc, the fleet default (cf. `edge`). Floor bumped to 0.1.52 so we pull
# libmimalloc-sys >= 0.1.49, which bundles and defaults to mimalloc **v3** (the `v2` feature is an
# opt-*out*; we don't set it). Also sidesteps musl's slow multithreaded malloc for the static build.
mimalloc = { version = "0.1.52", default-features = false }

# Coding tools, built on ripgrep's own engine crates: gitignore-aware walking (`ignore`), the
# line/byte searcher with binary detection + mmap (`grep-searcher`) driven by a regex matcher
# (`grep-regex`), and glob matching (`globset`). `grep` links ripgrep's searcher in-process rather
# than shelling out to `rg` (what pi does) — so it handles non-UTF-8/binary files correctly and skips
# the subprocess spawn. `regex` remains for `regex::escape` (literal mode) and `find`'s needs.
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
regex = "1"

# `edit`'s fuzzy fallback matcher: NFKC folding so a model's reconstructed `old_string` (smart quotes,
# full-width/ligature chars) still lands against the on-disk bytes.
unicode-normalization = "0.1"

# `read` base64-encodes image files so the multimodal model can see them (e.g. a screenshot).
base64 = "0.22"
# `read`'s image pipeline: magic-byte format sniffing (`guess_format`) and Lanczos3 downscaling for an
# oversized image, so it fits the base64 budget instead of being refused outright. `default-features =
# false` drops the `rayon`/AVIF/EXR/etc. formats we never decode; only the four raster formats `read`
# actually accepts are enabled.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[dev-dependencies]
# Scratch files/dirs for the file-tool tests.
# Bench harness for the search tools. `divan` (the gateway's `bench:unit` pin) measures **allocations**
# (via its `AllocProfiler` global allocator) alongside timing — so the search bench proves both the
# speed and the allocation cost of our in-process engine vs shelling out to `rg` (pi's approach).
divan = "0.1"
tempfile = "3"

[[bench]]
name = "search"
harness = false
