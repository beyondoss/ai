name: CI
on:
  pull_request:
    branches: [main]
  # The rates-drift workflow's PRs are made with GITHUB_TOKEN, which starts no pull_request run;
  # it dispatches this on the PR's branch instead. No job reads the pull_request payload.
  workflow_dispatch:
  # The merge queue tests each PR on top of main and the PRs queued ahead of it, then merges it;
  # the required `Check` has to report on that run too.
  merge_group:
# Least privilege: every job only reads the repository. Checkout, the caches and artifact upload use
# the runner's own tokens, not GITHUB_TOKEN scopes. Nothing here comments, pushes or writes checks.
permissions:
  contents: read
# A newer push to the same PR cancels the superseded run — no pile-ups (which is how a single wedged
# runner blocked everything), faster feedback, fewer wasted runner-minutes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # Belt-and-suspenders: the panic-surface + `unused_must_use` denies live in `[lints]` (Cargo.toml)
  # so they bind locally too, but escalate *every* warning to an error in CI in case a lint isn't
  # expressible there (build scripts, future targets).
  RUSTFLAGS: -D warnings
  # Incremental compilation buys nothing on a clean CI runner (every build starts cold) and only
  # bloats the restored cache — off is the CI-recommended default.
  CARGO_INCREMENTAL: "0"
  # No debuginfo in test/dev builds. Line tables were ~70% of every test binary (a gateway test
  # binary: 72 MB, of which .debug_line 22 + .debug_str 17 + .debug_info 10), and the binaries are the
  # tests archive that every shard downloads: gateway-only archive 1.31 GiB -> 479 MiB, compile CPU
  # time -22%. A panic still names its file:line (that comes from the panic location, not debuginfo);
  # only RUST_BACKTRACE frames lose theirs.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
# The checks below run on separate runners *in parallel*, so wall-clock is ~the slowest one
# (the test build, then the slowest shard) instead of the sum of all of them, and one hung/slow check can no longer
# starve the others of their signal. `Check` is the single required gate that fans them back in.
#
# Linux only, and deliberately: there is no macOS (or Windows) lane because nothing here ships or is
# supported off Linux. release-agent.yml publishes linux-musl amd64/arm64 binaries only, the gateway
# ships as a Linux image (publish.yml), and mise.toml installs only Linux Rust targets. The agent does
# not even compile for macOS: its unconditional `seccompiler` dependency (the `web` tool's parse
# sandbox, tools/web/isolate.rs) calls `libc::prctl` and `SYS_seccomp`, which libc has no Apple
# binding for. The `cfg(not(target_os = "linux"))` fallbacks in the tree keep single modules honest
# for "another unix"; they are not a supported build. A macOS lane needs a macOS build first (seccomp
# made Linux-only) and a reason to keep it green (a shipped macOS artifact) — add all three or none.
jobs:
  # Formatting compiles none of the project, so it returns in well under a minute — kept separate so
  # a formatting nit fails fast without waiting behind a compile.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # A restored mise tool cache can hand back a rust toolchain without the rustfmt component even
      # though mise reports it installed; dprint's `rustfmt --edition 2024` then fails. `rustup
      # component add` is idempotent, so it's safe on a cache hit.
      - run: rustup component add rustfmt
      - run: mise check:fmt
      - run: cargo fmt --all --check
      # Every crate's ARCHITECTURE.md module table names every one of its src files, so a new module
      # cannot land undocumented and the table cannot silently read as complete. No build; stdlib only.
      - run: mise check:module-tables
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: rustup component add clippy
      # Restore-only here: cache-warm.yml writes this key on main (see its header for why).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # clippy `-D warnings` across all targets; `[lints.clippy]` denies the panic surface
      # (unwrap/expect/panic/todo/unimplemented), so a new `.unwrap()` in production code fails here.
      - run: mise check:rs
      # Code Mode is a cargo feature so default/release binaries do not link QuickJS (agent VM
      # density: idle RSS is resident `.text`). The feature-gated paths still have to clippy clean.
      - run: cargo clippy -p beyond-agent --all-targets --features code-mode --locked -- -D warnings
  # The test binaries are compiled once, here, and the shards below only run them. Before this every
  # shard ran `cargo nextest run -E <filter>` on its own runner, and nextest applies `-E` *after* the
  # build: the core-providers shard compiled all 499 crates and ~330 test binaries (240 of them the
  # agent's integration tests) to run a few hundred tests, and nine shards did that same compile in
  # parallel (measured 430-630s each, run 40155114591). One archive (`cargo nextest archive`: the test
  # binaries plus the non-test binaries `CARGO_BIN_EXE_*` points at) replaces nine compiles.
  #
  # The artifact lives one day (`retention-days: 1`, the minimum): it is only read by this run's own
  # shards, and a rerun of a shard inside that day still finds it.
  archive:
    name: build tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # Restore-only here: cache-warm.yml writes this key on main (see its header for why).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest archive --workspace --locked --profile ci --archive-file "$RUNNER_TEMP/tests.tar.zst"
        timeout-minutes: 20
      # Already zstd-compressed: level 0 skips a second, useless pass over it.
      - uses: actions/upload-artifact@v4
        with:
          name: tests-archive
          path: ${{ runner.temp }}/tests.tar.zst
          retention-days: 1
          compression-level: 0
  # Unit + integration tests via nextest: it runs the whole suite in parallel across the runner's
  # cores, and — crucially — its per-test `slow-timeout` (see .config/nextest.toml) TERMINATES and
  # *names* a test that hangs, so a deadlock fails the job in a couple of minutes with the culprit
  # identified instead of wedging it until GitHub's 6-hour ceiling. `timeout-minutes` is the backstop.
  test:
    # Split by *area*, not by hash. Both shard the work; only this tells you where a failure lives.
    #
    # A hash partition (`--partition count:N/4`) did locate the problem once — three shards green in
    # under three minutes, the fourth dead at exactly 30:00, twice in a row including a targeted
    # re-run, so deterministic rather than a bad runner. But its contents reshuffle whenever the
    # partition count changes, so narrowing further meant re-deriving the set each round. These
    # groups are stable, reproducible locally with the same `-E` expression, and a red shard names
    # the area outright.
    #
    # agent-serve was left out of this matrix from #39 on, after its harnesses froze the runner (the
    # test step stuck `in_progress` past every timeout). Out of CI they rotted unseen: by 2026-10 48
    # of them failed or hung on main, almost all because the session-title request `serve` began
    # making after a first run took a reply from the in-order mock model's script, shifting every
    # later turn by one. With that fixed in the harness, and the runner-freezing causes since
    # addressed (systemd-scoped test step, nextest terminate-after and global-timeout below), they
    # run again — as their own shard, so a hang there names itself instead of hiding another's.
    name: test (${{ matrix.name }})
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # A failing group must not cancel the others — their logs are the diagnostic.
      fail-fast: false
      matrix:
        include:
          - name: gateway-unit
            filter: package(beyond-gateway) and kind(lib)
            extra: ""
          - name: gateway-e2e
            filter: package(beyond-gateway) and kind(test)
            extra: ""
          # The agent package is split rather than run whole. Two reasons, both learned
          # the hard way: a single 1849-test job is the only shard that has ever wedged (its three
          # siblings finish in ~90s every single time), and when it does wedge, "the agent tests" is
          # far too coarse a result to act on. Splitting the workspace by area is what localized the
          # failure to this package to begin with; continuing that same bisect one level down is what
          # will localize it inside the package, and each piece is small enough to stand a materially
          # better chance of simply passing.
          - name: agent-lib
            filter: package(beyond-agent) and (kind(lib) or kind(bin))
            extra: ""
          # Same agent-lib filter with QuickJS linked, plus the Code Mode eval harness (catalog
          # tokens + real-MCP composition). Default shards must not enable `code-mode` (that is the
          # density-default graph); this shard is the only one that compiles the interpreter.
          - name: agent-code-mode
            filter: package(beyond-agent) and (kind(lib) or kind(bin) or binary(code_mode_eval))
            extra: "--features code-mode"
          # agent-rest was one shard, 369-447s of test time: the critical path of the whole run once
          # the build is shared (below). Its per-binary time (junit, 4 test threads) is dominated by
          # the exec, job and notify tests: exec_conformance alone is 475s of the 1548s summed. They
          # are two shards (exec: 142s, jobs: 82s), and agent-rest keeps the complement (139s), so a
          # new test binary lands in agent-rest by default and the shards cannot drift apart or
          # overlap. Area filters, not a hash partition (see above).
          #
          # The agent's integration tests are ONE test binary (`it`, crates/agent/tests/it.rs), one
          # module per tests/*.rs file, so the area filters select by module path
          # (`test(/^[^:]*serve[^:]*::/)` is "every file whose name contains serve"), always paired with
          # `binary(=it)` so they cannot reach the lib's `serve::` unit tests.
          #
          # Why two and not one: exec + jobs + notify as a single shard wedged the runner in the
          # test step on both attempts, twice (past nextest's global-timeout, RuntimeMaxSec and the
          # step timeout, with no log), though the same tests pass together in agent-rest, in a local
          # run (196 tests, 228s), and as these two halves. Cause not found; the halves are the
          # measured-good grouping.
          - name: agent-exec
            filter: package(beyond-agent) and binary(=it) and (test(/^[^:]*conformance[^:]*::/) or test(/^[^:]*exec_[^:]*::/)) and not test(/^[^:]*serve[^:]*::/) and not test(/^exec_endpoint_live::/) and not test(/^sandbox_jobs_notify::/) and not test(/^[^:]*notify_e2e[^:]*::/)
            extra: ""
          - name: agent-jobs
            filter: package(beyond-agent) and binary(=it) and (test(/^[^:]*jobs[^:]*::/) or test(/^[^:]*notify[^:]*::/)) and not (test(/^[^:]*conformance[^:]*::/) or test(/^[^:]*exec_[^:]*::/)) and not test(/^[^:]*serve[^:]*::/) and not test(/^exec_endpoint_live::/) and not test(/^sandbox_jobs_notify::/) and not test(/^[^:]*notify_e2e[^:]*::/)
            extra: ""
          - name: agent-rest
            filter: package(beyond-agent) and binary(=it) and not (test(/^[^:]*conformance[^:]*::/) or test(/^[^:]*exec_[^:]*::/) or test(/^[^:]*jobs[^:]*::/) or test(/^[^:]*notify[^:]*::/)) and not test(/^[^:]*serve[^:]*::/) and not test(/^exec_endpoint_live::/) and not test(/^sandbox_jobs_notify::/) and not test(/^[^:]*notify_e2e[^:]*::/)
            extra: ""
          # exec v1.4's end-to-end matrix and randomized orderings: real replicas behind a ring,
          # each case in three endpoint modes. Minutes of wall clock between them, so their own
          # shard rather than a slice of agent-rest's 10-minute budget.
          - name: agent-notify-e2e
            filter: package(beyond-agent) and binary(=it) and test(/^[^:]*notify_e2e[^:]*::/)
            extra: ""
          - name: agent-serve
            filter: package(beyond-agent) and binary(=it) and test(/^[^:]*serve[^:]*::/)
            extra: ""
          # The catch-all: every package the shards above do not own, selected by complement rather
          # than by name. Every shard compiles the whole workspace, so a crate missing from a
          # name list looks covered and is run by no one — demo, fleet-sim, test-support and verify
          # sat in exactly that state. Naming the two packages the other shards carve up means a new
          # crate lands here by default. The verify `*_live` binaries are in this set but list no
          # cells without VERIFY_LIVE=1 (they spend real money), so they run zero tests here; they
          # run under the `verify` tasks, not in PR CI.
          - name: workspace-rest
            filter: not (package(beyond-gateway) or package(beyond-agent))
            extra: ""
          # The remote-exec path against a **real, isolated target**, not a mock. Every other test of
          # it runs commands on the same machine, which proves the wiring and nothing about a
          # genuinely separate filesystem. Alpine is deliberate: it is busybox, whose `grep` has no
          # `-Z`/`-I`/`--include` and whose `find` has no `-printf`, so it exercises the hardest rung
          # — and it is what a large share of real sandboxes actually are. Running against a
          # GNU-flavoured image would quietly skip the code path most likely to be wrong.
          - name: exec-live
            filter: package(beyond-agent) and binary(=it) and (test(/^exec_endpoint_live::/) or test(/^sandbox_jobs_notify::/))
            extra: ""
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # agent-code-mode is the one shard that cannot use the archive: it needs `--features code-mode`
      # (QuickJS), which would change the feature set of every other binary. It compiles for itself,
      # but only the agent's own dependency graph (`-p beyond-agent`), not the workspace.
      # Restore-only: cache-warm.yml writes this key on main.
      - uses: Swatinem/rust-cache@v2
        if: matrix.name == 'agent-code-mode'
        with:
          shared-key: code-mode
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Prebuilt binary in seconds — no compiling nextest from source.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: actions/download-artifact@v4
        if: matrix.name != 'agent-code-mode'
        with:
          name: tests-archive
          path: ${{ runner.temp }}
      # Compile is a separate step from the run. agent-rest links many integration-test
      # binaries; that compile cannot leak a `serve` daemon.
      #
      # The run step must not let a grandchild inherit GitHub's stdout pipe (the runner
      # waits for EOF on it, and job/step timeouts do not fire while it is held). nextest
      # writes to a file. No `tail -f`: that helper holds the pipe and cancelled agent-rest
      # after it had been green with this file-only wrapper. No GNU `timeout`: without
      # `--foreground` it puts cargo in a new process group the runner does not reap.
      #
      # Only the exec-live shard needs a target; the others must not pay for it.
      - name: start a real sandbox target (Alpine = busybox, the hardest rung)
        if: matrix.name == 'exec-live'
        run: |
          docker run -d --name agent-exec-target --rm alpine:latest sleep 900
          # A second target for the baseline's job notify (v1.4): on the host network, so its
          # callbacks reach the test's receiver on 127.0.0.1 (the only host plain `http` may name),
          # with `curl` added (busybox has none). Never the first target: a container on the host
          # network reports the host's name, which is exactly what the first one's tests must not
          # see.
          docker run -d --name agent-notify-target --rm --network host alpine:latest sleep 900
          docker exec agent-notify-target apk add --no-cache curl >/dev/null
          docker exec agent-exec-target sh -c '
            mkdir -p /work
            printf "fn one() { NEEDLE }\n" > /work/a.rs
            printf "TARGET-ONLY-MARKER\n"  > /work/marker.txt
          '
          # The asymmetry the assertions rely on: /work must NOT exist on the runner.
          test ! -e /work
          echo "AGENT_LIVE_EXEC_CMD=docker exec agent-exec-target {}" >> "$GITHUB_ENV"
          # The baseline's notify needs standard input to reach the target (`sandbox_jobs_notify`).
          echo "AGENT_LIVE_EXEC_STDIN_CMD=docker exec -i agent-notify-target {}" >> "$GITHUB_ENV"
          echo "AGENT_LIVE_WORKDIR=/work" >> "$GITHUB_ENV"
      # A resource trend that outlives a wedge: memory, swap, PSI, load, pid count, disk and the
      # biggest processes every 5s, appended to a file by a transient *system* unit. It is outside the
      # step's process tree, so it can never hold the step's stdout pipe, and it stops itself.
      - name: start resource sampler
        run: |
          : > "$RUNNER_TEMP/resources.log"
          sudo systemd-run --unit=ci-resources --collect --quiet -p RuntimeMaxSec=40min \
            -p StandardOutput=append:"$RUNNER_TEMP/resources.log" -p StandardError=append:"$RUNNER_TEMP/resources.log" \
            sh -c 'while :; do
              echo "=== $(date -u +%T) load $(cut -d" " -f1-4 /proc/loadavg) pids $(ls -d /proc/[0-9]* | wc -l)"
              free -m | tail -2
              for r in memory cpu io; do echo "psi $r $(head -1 /proc/pressure/$r)"; done
              df -h / | tail -1
              ps -eo pid,rss,nlwp,stat,etime,comm --sort=-rss | head -6
              ps -eo pid,stat,wchan:24,comm | awk "\$2 ~ /^D/ {print \"D-state:\", \$0}"
              sleep 5
            done'
      # Unpacked to the same `target/` the archive was built in, at the same checkout path: tests that
      # spawn a sibling binary bake its absolute path in at compile time (`env!("CARGO_BIN_EXE_…")`),
      # so it has to exist right where the archive job built it. The runs below read the archive's
      # metadata instead of re-extracting it, which keeps the unpack out of the run step's time limit.
      # `target/tmp` is `CARGO_TARGET_TMPDIR`, baked in the same way: cargo creates it during the
      # build, the archive carries only files, and rates-sync's `pricing_reference` writes into it.
      - name: unpack tests
        if: matrix.name != 'agent-code-mode'
        run: tar -I zstd -xf "$RUNNER_TEMP/tests.tar.zst" && mkdir -p target/tmp
        timeout-minutes: 10
      - name: compile tests
        if: matrix.name == 'agent-code-mode'
        run: cargo nextest run -p beyond-agent --locked --profile ci ${{ matrix.extra }} -E '${{ matrix.filter }}' --no-run
        timeout-minutes: 20
      # The run is a transient system unit (`systemd-run --wait`), not a child of the step. The
      # wedge leaves the test step `in_progress` past the nextest global-timeout, the step timeout and
      # the job timeout, so every one of those limits needs the runner itself to act, and it doesn't.
      # These limits are enforced by systemd instead:
      #   RuntimeMaxSec  ends the run at 11m (nextest's own global-timeout is 10m) and fails the unit
      #                  with result `timeout`. systemd-run returns then even if a process survives
      #                  its SIGKILL, so the step finishes and the steps after it run.
      #   MemoryMax      measured peak of the agent-rest and agent-code-mode runs is ~0.3 GB (cgroup,
      #                  4 CPUs, 16 GB). 8 GB is ~25x that and half the runner, so a runaway is
      #                  OOM-killed with result `oom-kill` in the log instead of swapping the VM.
      #   TasksMax       peak is ~80 pids/threads. 4096 stops a fork loop long before the pid table.
      # When the unit stops, systemd kills everything left in its cgroup, so a leaked `serve` daemon or
      # nats-server cannot outlive the step (nextest still prints `LEAK` naming the test). The unit's
      # output is a file, never the step's pipe. The environment is passed explicitly because sudo
      # resets it, and cargo is passed by absolute path because systemd-run resolves the binary with
      # sudo's PATH, not ours. No GNU `timeout` (see above).
      - name: test
        run: |
          set +e
          LOG="$RUNNER_TEMP/nextest.log"
          : > "$LOG"
          echo "nextest output -> $LOG"
          env_args=()
          while IFS= read -r name; do env_args+=("--setenv=$name=${!name}"); done < <(compgen -e)
          if [ "${{ matrix.name }}" = agent-code-mode ]; then
            run=(-p beyond-agent --locked ${{ matrix.extra }})
          else
            run=(--binaries-metadata target/nextest/binaries-metadata.json --cargo-metadata target/nextest/cargo-metadata.json --target-dir-remap target --workspace-remap .)
          fi
          sudo systemd-run --wait --collect --same-dir --uid="$(id -un)" --gid="$(id -gn)" \
            -p MemoryMax=8G -p MemorySwapMax=0 -p TasksMax=4096 -p RuntimeMaxSec=11min \
            -p StandardInput=null -p StandardOutput=append:"$LOG" -p StandardError=append:"$LOG" \
            "${env_args[@]}" \
            "$(command -v cargo)" nextest run "${run[@]}" --profile ci -E '${{ matrix.filter }}'
          status=$?
          echo "--- last 200 lines of the log file ---"
          tail -200 "$LOG"
          exit $status
        timeout-minutes: 12
      # The ci profile retries a failed test once, so a green shard can hide a test that failed and
      # then passed. Each such FLAKY test becomes a warning annotation and a count in the job summary
      # (from nextest's JUnit report); it does not fail the job.
      - name: report flaky tests
        if: always()
        run: python3 -I .github/scripts/flaky-report.py "${{ matrix.name }}" target/nextest/ci/junit.xml
      # Belt and braces: runs even if the step above somehow does not, and names anything still alive.
      - name: what was left running
        if: always()
        run: |
          echo "--- disk ---"; df -h / | tail -1
          echo "--- memory ---"; free -m | head -3
          echo "--- surviving agent and gateway processes (leaked daemons) ---"
          ps -eo pid,etime,rss,args | grep -E "agent|gateway|nats-server" | grep -v grep || echo "  none"
          sudo systemctl stop ci-resources 2>/dev/null
          echo "--- last resource samples ---"; tail -60 "$RUNNER_TEMP/resources.log"
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.name }}-logs
          path: |
            ${{ runner.temp }}/nextest.log
            ${{ runner.temp }}/resources.log
            target/nextest/ci/junit.xml
          if-no-files-found: ignore
  # The gateway's concurrency-sensitive hermetic tests (reliability, billing, streaming,
  # cancellation, capture), run repeatedly with every core saturated by a CPU hog. Two real races
  # (D248's GOAWAY resend, D208's capture drain) passed on a fast dev box and failed only on CI's
  # slower runners; this makes "slow" the normal condition instead of luck.
  #
  # One hog per core, not `taskset -c 0`: pinning everything to one CPU serialises the burst, so no
  # two H2 streams share a connection and D248's test passes as "inconclusive" every time (measured:
  # reverted fix, 20/20 green pinned to one CPU; 17/20 red on four CPUs with four hogs; every
  # iteration of this job's command red). Concurrency needs parallelism to race at all.
  #
  # Repeated runs, not `--stress-count`: nextest 0.9.140 exits 0 from a stress run whose last
  # iteration passed even when earlier ones failed (measured). `rss_plateaus…` is excluded: a
  # memory-growth bound, not a race, and ~2 minutes alone under contention, it would set the pace.
  # The ci profile's one retry stays: it absorbs a one-off timeout from a starved poll, while a real
  # race like D248 (red in most single runs) still fails both tries in at least one iteration.
  gateway-stress:
    name: gateway stress (contended CPUs)
    needs: archive
    # Merge queue and dispatch only. It has failed on 4 PRs in the run history, and costs ~10 minutes
    # of saturated runner on every push; the queue runs it before anything lands on main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STRESS_FILTER: >-
        package(beyond-gateway) and (binary(=claims_reliability) or binary(reliability_*) or binary(billing_*) or binary(=claims_billing) or binary(=claims_billing_integrity) or binary(=cancellation) or binary(=cut_short) or binary(=claims_streaming) or binary(=capture) or binary(=tenant_concurrency) or (kind(lib) and test(capture_sink::))) and not test(=rss_plateaus_under_sustained_load_and_large_bodies)
      # ~2 minutes an iteration on a 4-vCPU hosted runner under the hogs (measured ~1 minute on a
      # 16-core dev box restricted to 4 CPUs with 4 hogs), so ~10 minutes in all.
      STRESS_RUNS: "5"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The archive's test binaries, unpacked as in `test` (same path, same `target/`).
      - uses: actions/download-artifact@v4
        with:
          name: tests-archive
          path: ${{ runner.temp }}
      - name: unpack tests
        run: tar -I zstd -xf "$RUNNER_TEMP/tests.tar.zst" && mkdir -p target/tmp
        timeout-minutes: 10
      # Same pipe rules as `test`: nextest writes to a file, and the hogs get /dev/null for all
      # three streams, so no grandchild holds GitHub's stdout pipe open past the step.
      - name: stress
        run: |
          set +e
          LOG="$RUNNER_TEMP/nextest.log"
          : > "$LOG"
          echo "nextest output -> $LOG"
          HOGS=""
          for _ in $(seq "$(nproc)"); do
            yes </dev/null >/dev/null 2>&1 &
            HOGS="$HOGS $!"
          done
          status=0
          for i in $(seq "$STRESS_RUNS"); do
            echo "=== run $i/$STRESS_RUNS ===" >> "$LOG"
            start=$SECONDS
            rm -f target/nextest/ci/junit.xml
            cargo nextest run --binaries-metadata target/nextest/binaries-metadata.json --cargo-metadata target/nextest/cargo-metadata.json --target-dir-remap target --workspace-remap . --color never --profile ci -E "$STRESS_FILTER" >> "$LOG" 2>&1 </dev/null
            rc=$?
            # Each run overwrites the JUnit report; keep one per run for the flaky report below.
            cp target/nextest/ci/junit.xml "$RUNNER_TEMP/junit-$i.xml" 2>/dev/null
            echo "run $i/$STRESS_RUNS: exit $rc in $((SECONDS - start))s"
            [ "$rc" -ne 0 ] && status=$rc
          done
          kill $HOGS 2>/dev/null
          pkill -9 -f 'nats-server' 2>/dev/null
          echo "--- failures and retries ---"
          grep -E '^\s+(TRY [0-9]+ )?(FAIL|TIMEOUT|SIGKILL)|^=== run' "$LOG" || echo "  none"
          echo "--- last 100 lines of the log file ---"
          tail -100 "$LOG"
          exit $status
        timeout-minutes: 15
      # As in `test`: a pass only on the retry is a warning annotation and a summary count, per run.
      - name: report flaky tests
        if: always()
        run: |
          reports=()
          for i in $(seq "$STRESS_RUNS"); do reports+=("$RUNNER_TEMP/junit-$i.xml"); done
          python3 -I .github/scripts/flaky-report.py "gateway-stress (${STRESS_RUNS} runs)" "${reports[@]}"
  # The release build is the long pole; running it alongside the others (not after them) is most of
  # the wall-clock win.
  build:
    name: build (release)
    # Merge queue and dispatch only: 4 failures in the run history, ~10 minutes of release compile
    # on every push. Release-only breakage (a cfg, a feature, a test seam shipping) is caught by the
    # queue before it lands on main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # Restore-only here: cache-warm.yml writes this key on main.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mise build:rs:release
      # The authority on "no test seam ships": the release binaries themselves, scanned for the
      # seam prefix (a grep over what was just built; seconds).
      - run: mise check:release-seams
  # Dependency advisories are checked only on a PR that touches dependencies. An advisory is
  # published on its own schedule, so an unrelated PR must never turn red because one landed since
  # main last changed; advisories.yml bumps main's lockfile daily instead. `deps` is true when the
  # change touches what decides the dependency set or what is built from it: Cargo.lock, a
  # Cargo.toml, .cargo/audit.toml, .cargo/config(.toml), rust-toolchain(.toml) or a Dockerfile. A
  # merge-queue run compares the queued tree with the queue's base commit rather than always
  # running: it still catches deps that change only in combination (two queued PRs, a merge that
  # alters the lock) without turning the queue red, for a PR that touches no dependency, over an
  # advisory published since main last changed. A dispatched run (a bot PR) compares with main.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deps: ${{ steps.diff.outputs.deps }}
      execd: ${{ steps.diff.outputs.execd }}
      clients: ${{ steps.diff.outputs.clients }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          deps=false
          execd=false
          clients=false
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = merge_group ]; then
            base=${BASE_SHA:-$(git rev-parse origin/main)}
            if git diff --name-only "$base"...HEAD | grep -qE '(^|/)Cargo\.toml$|^Cargo\.lock$|^\.cargo/(audit\.toml|config(\.toml)?)$|(^|/)rust-toolchain(\.toml)?$|(^|/)Dockerfile[^/]*$'; then
              deps=true
            fi
            # execd's own code, its timing kernel, and the agent's side of the protocol it is
            # verified against, and this workflow (an edit to the job runs the job).
            if git diff --name-only "$base"...HEAD | grep -qE '^crates/(execd|exec-notify)/|^crates/(sandbox/|agent/src/exec_endpoint)|^\.github/workflows/ci\.yml$'; then
              execd=true
            fi
            # The sandbox clients: their SDKs and shared scenarios, the harness, the reference
            # implementation of the file helpers, and execd (the backend they run against).
            if git diff --name-only "$base"...HEAD | grep -qE '^sdk/|^crates/sandbox|^crates/execd/|^crates/agent/src/(exec_endpoint|tools/fs/|tools/exec\.rs)|^crates/agent/tests/sdk_conformance|^\.github/workflows/ci\.yml$'; then
              clients=true
            fi
          fi
          echo "deps=$deps" >>"$GITHUB_OUTPUT"
          echo "execd=$execd" >>"$GITHUB_OUTPUT"
          echo "clients=$clients" >>"$GITHUB_OUTPUT"
  # execd on a native arm64 machine. execd ships for arm64 (release-execd.yml) and is Linux-syscall
  # code (subreaper, process groups, /proc, waits) whose struct layouts and syscall numbers differ
  # per arch, so x86 green says nothing about it. The suite runs here as on amd64, including the
  # conformance test against the real `execd` binary and the root-only tests (`sudo -n` is
  # passwordless on hosted runners, arm included). Only when the change touches execd, the
  # exec-notify kernel or the agent's exec endpoint (the `changes` job; a merge-queue run compares
  # the queued tree with the queue's base, so the queue runs it for exactly those PRs), not on every
  # PR. Restore-only cache, written by cache-warm.yml on main.
  execd-arm64:
    name: execd (arm64)
    needs: changes
    if: needs.changes.outputs.execd == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: execd-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: test
        run: cargo nextest run -p beyond-execd --locked --profile ci
        timeout-minutes: 15
      - name: report flaky tests
        if: always()
        run: python3 -I .github/scripts/flaky-report.py "execd-arm64" target/nextest/ci/junit.xml
      - name: what was left running
        if: always()
        run: ps -eo pid,etime,rss,args | grep -E "execd|agent|gateway" | grep -v grep || echo "  none"
  # The sandbox clients' conformance matrix: every registered driver (sdk/conformance/drivers.toml)
  # against execd on this runner, in Alpine (real busybox), in Debian under EXECD_RUN_AS, on a
  # read-only mount, on a disk that fills, and against the fault-injecting endpoint. Only when the
  # change touches the clients, the harness, the file helpers or execd (the `changes` job).
  clients:
    name: sandbox clients (matrix)
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clients
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get install -y musl-tools
      - name: matrix
        run: mise run test:clients
        timeout-minutes: 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-matrix-report
          path: target/sandbox-matrix/report.json
          retention-days: 7
  # The TypeScript SDK (sdk/ts): typecheck, build, and the tests, whose smoke tests run against a real
  # loopback execd built here. Needs no Rust beyond that one small crate.
  sdk-ts:
    name: sdk-ts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sdk-ts
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run install:ts
      - run: mise run check:ts
      - run: mise run build:ts
      - run: cargo build -p beyond-execd --locked
      - run: mise run test:ts
        env:
          EXECD_BIN: ${{ github.workspace }}/target/debug/execd
  # The Python SDK (sdk/python/sandbox): ruff, mypy --strict, and pytest, whose loopback tests run
  # against a real execd built here.
  sdk-python:
    name: sdk-python
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sdk-python
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run check:py
      - run: mise run test:py
  # Advisories only: no license or duplicate-version checks. Ignores live in .cargo/audit.toml.
  advisories:
    name: advisories
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1
      - run: cargo audit
  # Mutation testing is not a PR check: a missed mutant is a test gap, not a bug, and the per-PR
  # run added about an hour to every gateway change. The full mutation sweep is weekly (deep.yml).
  # Single required status check. Branch protection can require just `Check`; it stays green only if
  # every parallel job above did. Two kinds of skip are allowed: `advisories`, `execd-arm64` and `clients` may be
  # skipped on any event (each must pass only when it ran: the change touched dependencies / execd), and `gateway-stress` and
  # `build` may be skipped on a pull_request only (they run in the merge queue, so every commit that
  # reaches main passed them). Cheap (no build), and keeps the required-check name stable.
  Check:
    name: Check
    runs-on: ubuntu-latest
    needs: [fmt, clippy, archive, test, gateway-stress, build, changes, advisories, execd-arm64, clients, sdk-ts, sdk-python]
    if: always()
    steps:
      - name: Gate on all checks
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "event=$EVENT fmt=${{ needs.fmt.result }} clippy=${{ needs.clippy.result }} archive=${{ needs.archive.result }} test=${{ needs.test.result }} gateway-stress=${{ needs.gateway-stress.result }} build=${{ needs.build.result }} changes=${{ needs.changes.result }} advisories=${{ needs.advisories.result }} execd-arm64=${{ needs.execd-arm64.result }} clients=${{ needs.clients.result }} sdk-ts=${{ needs.sdk-ts.result }} sdk-python=${{ needs.sdk-python.result }}"
          # gateway-stress and build are skipped on a pull_request and nowhere else: a skip on the
          # merge queue or a dispatch is a job that never ran, which must not read as green.
          pr_only() { [ "$1" = "success" ] || { [ "$EVENT" = pull_request ] && [ "$1" = "skipped" ]; }; }
          [ "${{ needs.fmt.result }}" = "success" ] \
            && [ "${{ needs.clippy.result }}" = "success" ] \
            && [ "${{ needs.archive.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && pr_only "${{ needs.gateway-stress.result }}" \
            && pr_only "${{ needs.build.result }}" \
            && [ "${{ needs.changes.result }}" = "success" ] \
            && [ "${{ needs.sdk-ts.result }}" = "success" ] \
            && [ "${{ needs.sdk-python.result }}" = "success" ] \
            && { [ "${{ needs.advisories.result }}" = "success" ] || [ "${{ needs.advisories.result }}" = "skipped" ]; } \
            && { [ "${{ needs.execd-arm64.result }}" = "success" ] || [ "${{ needs.execd-arm64.result }}" = "skipped" ]; } \
            && { [ "${{ needs.clients.result }}" = "success" ] || [ "${{ needs.clients.result }}" = "skipped" ]; }
