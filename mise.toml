[tools]
dprint = "latest"
rust = { version = "1.92", components = "rustfmt,clippy,llvm-tools-preview", targets = "aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu" }
yamlfmt = "latest"
cargo-binstall = "latest"
"cargo:cross" = "latest"
# nats-server for the e2e harness (real JetStream KV backing slipstream).
"ubi:nats-io/nats-server" = { version = "latest", exe = "nats-server" }
# ripgrep for the filesystem-backend parity suite. `ShellFs` has two rungs — `rg`, which matches the
# in-process walker exactly, and a POSIX `grep` fallback with two known divergences — and only a box
# that *has* `rg` can test the strict one. GitHub's runner image does not ship it, so without this the
# strict rung silently stops being covered (it failed loudly instead; see `fs_backend_parity.rs`).
"github:BurntSushi/ripgrep" = "latest"

[tasks."build:rs"]
run = "cargo build"

[tasks."build:rs:release"]
run = "cargo build --release --locked"

[tasks."check:release-seams"]
description = "Fail if a release binary carries a test seam's name (run after build:rs:release)."
run = "crates/agent/scripts/scan-release-seams.sh $(find target/release -maxdepth 1 -type f -perm -u+x)"

[tasks."ai:mint-dev-key"]
description = "Mint a deterministic DEV-ONLY signing pubkey + bai_v1 token (fixed seed) for wiring up the dev config. Not for production."
run = "cargo run -p beyond-gateway --example mint_dev_key"

[tasks."build:agent"]
run = "cargo build -p beyond-agent"

[tasks."run:agent"]
description = "Run the agent harness CLI (e.g. `mise run run:agent -- tools`)."
run = "cargo run -p beyond-agent --"

[tasks."test:unit:agent"]
description = "Unit tests for the agent harness core (messages, tool registry, session)."
run = "cargo test -p beyond-agent-core"

[tasks."test:code-mode"]
description = "Code Mode evals: catalog-token A/B + execute composition (needs --features code-mode). Live Grok/OpenRouter: OPENROUTER_API_KEY and pass -- --ignored."
run = "cargo test -p beyond-agent --features code-mode --test code_mode_eval -- --nocapture"

[tasks."eval:longctx"]
description = "Long-context compaction sweep (crates/agent/eval/longctx): multi-bug repair tasks in 11 real Python repos × model × compaction trigger, headless, graded by each repo's own tests. Spends real money: `-- --estimate` first, `--budget-usd` caps it. Reads keys from .env. Args go to run.py (--models, --arms 100k,200k,default,model or any <n>k, --tasks, --attempts, --jobs)."
run = """
cargo build -q --release -p beyond-agent
python3 crates/agent/eval/longctx/run.py --bin target/release/agent "$@"
python3 crates/agent/eval/longctx/report.py
"""

[tasks."eval:validate"]
description = "Check the long-context eval's integrity before trusting an A/B (local, no model calls): build every task (no compiled/packaged artifact, no removed body left verbatim in the tree), the pristine tree passes 100% in the grading env with stable test ids, the perfect answer grades as solved in every run-dir layout with identical results (path-independent), the stubbed tree fails, and the agent's sandbox reaches no pristine tree, other run or installed copy of a package under test; then the eight background-process tasks set up at once: each untouched task fails and its reference solution passes (three times each), ports distinct and released, the real build matches, the sandbox leftover report and the bg metrics. Args go to validate.py (--repos, --jobs, --bg-only, --real-run)."
run = 'python3 crates/agent/eval/longctx/validate.py "$@"'

[tasks."eval:longctx:report"]
description = "Tabulate the long-context sweep's results (pass rate with Wilson CI, $, turns, compactions, peak context; paired vs the default trigger)."
run = "python3 crates/agent/eval/longctx/report.py"

[tasks."eval:ab"]
description = "Before/after no-regression gate: build BASE and CAND (commit SHAs) in separate target dirs, run the longctx code tasks plus the MCP tasks (Playwright + GitHub + filesystem servers) and the background-process tasks on both at one compaction arm (`--arm`, default `default`), and the MCP tasks on CAND with --code-mode too; `--base-arg`/`--cand-arg` add agent flags to one side (A/B a mechanism against itself). Prints per-arm pass rate (Wilson CI), paired McNemar + bootstrap verdicts, $/task, wall, TTFT, turns, first-request tokens, cache-read share, compactions. `BASE=<sha> CAND=<sha> mise run eval:ab -- --attempts 2`. Spends real money; reads keys from .env, GitHub token from `gh auth token`."
run = 'python3 crates/agent/eval/longctx/ab.py run --base "${BASE:?set BASE=<sha>}" --cand "${CAND:?set CAND=<sha>}" "$@"'

[tasks."check:rs"]
run = "cargo clippy --all-targets --locked -- -D warnings"

[tasks."check:fmt"]
run = "dprint check"

[tasks."check:module-tables"]
description = "Fail if a src file of a crate is missing from that crate's ARCHITECTURE.md module table."
run = "python3 -I .github/scripts/check-module-tables.py"

[tasks."audit"]
description = "Check Cargo.lock for known RustSec advisories (.cargo/audit.toml); needs cargo-audit 0.22.1 (`cargo binstall cargo-audit@0.22.1`)."
run = "cargo audit"

[tasks."format"]
run = "dprint fmt && cargo fmt"

[tasks."fuzz"]
description = "Coverage-guided fuzzing of the gateway's byte parsers (`lex|peek|usage|translate|key|signed_id`), execd's (`request|ring`) and the sandbox client's tool-output parsers (`records|colon|stat|listing|base64|frame|jobs`): `mise run fuzz -- <target> [secs]` (default 60s). Crashes land in crates/{gateway,execd,sandbox}/fuzz/artifacts/<target>/."
run = """
set -eu
target="${1:?usage: mise run fuzz -- <target> [secs]}"
secs="${2:-60}"
# The dated nightly libFuzzer needs; deep.yml pins the same one.
tc="${FUZZ_NIGHTLY:-nightly-2026-04-01}"
rustup toolchain list | grep -q "^$tc" || rustup toolchain install "$tc" --profile minimal
case "$target" in
  request|ring) cd crates/execd/fuzz ;;
  records|colon|stat|listing|base64|frame|jobs) cd crates/sandbox/fuzz ;;
  *) cd crates/gateway/fuzz ;;
esac
cargo "+$tc" fuzz run "$target" -- -max_total_time="$secs" -timeout=10 -rss_limit_mb=2048
"""

[tasks."test:unit:rs"]
description = "Unit tests for the pure-logic modules (key/route/peek/usage/deny/config/resolver)."
run = "cargo test --lib"

# Integration tests (gateway driven against a mock upstream + NATS) — to be added; see ARCHITECTURE.md.
[tasks."test:loom"]
description = "Loom permutation models of the gateway's lock-free code (circuit breaker, tenant slot, body budget). Own cfg name: a global `--cfg loom` breaks event-listener in the dependency tree."
run = 'RUSTFLAGS="--cfg beyond_loom" LOOM_MAX_PREEMPTIONS=3 cargo test -p beyond-gateway --release --lib loom'

[tasks."test:integration:rs"]
description = "End-to-end gateway tests against a mock provider + docker-compose NATS (TODO)."
run = "cargo test --test '*'"

[tasks."test:smoke"]
description = "Live smoke tests against REAL providers. Auto-loads .env if present; set the API keys you have (ANTHROPIC_API_KEY, OPENAI_API_KEY, AWS_BEARER_TOKEN_BEDROCK, GROQ_API_KEY, …) there or in the environment. Each test skips if its key is unset. Bills real (tiny, max_tokens-capped) requests."
run = """
# Auto-load .env if it exists (export every assignment), so the keys reach the test process.
if [ -f .env ]; then set -a; . ./.env; set +a; fi
cargo test -p beyond-gateway --test smoke -- --ignored --nocapture
"""

[tasks."test:smoke:agent"]
description = "Live agent smoke: the real agent binary → real gateway → REAL Anthropic. Auto-loads .env; needs ANTHROPIC_API_KEY. Skips if unset. Bills a tiny real request."
run = """
if [ -f .env ]; then set -a; . ./.env; set +a; fi
cargo nextest run -p beyond-agent -E 'test(/^smoke::/)' --run-ignored only --no-capture
"""

[tasks."rates:sync"]
description = "Re-fetch every primary pricing source into verify/rates_sources/ and regenerate the rate table (crates/providers/src/rates/generated.rs), printing what moved. Auto-loads .env: TOGETHER_API_KEY and XAI_API_KEY are required, every other source is public. See crates/providers/ARCHITECTURE.md."
run = """
if [ -f .env ]; then set -a; . ./.env; set +a; fi
cargo run -q -p beyond-rates-sync -- sync
cargo run -q -p beyond-rates-sync -- rate-version
mkdir -p target
cargo run -q -p beyond-rates-sync -- dump --json > target/rate-table.json
python3 -I verify/pricing_reference.py target/rate-table.json verify/pricing_vectors.json --write
"""

[tasks."rates:generate"]
description = "Regenerate the rate table from the committed snapshots and verify/catalog_truth.toml. Offline and byte-reproducible."
run = "cargo run -q -p beyond-rates-sync -- generate"

[tasks."rates:drift"]
description = "Re-fetch every pricing source into a scratch copy and fail, listing the diff, if any vendor price moved. Auto-loads .env."
run = """
if [ -f .env ]; then set -a; . ./.env; set +a; fi
cargo run -q -p beyond-rates-sync -- drift
"""

[tasks."rates:classify"]
description = "Re-fetch every pricing source into a scratch copy and print, as JSON, whether the change is none (exit 0), routine (2), review (3) or broken (4). Writes nothing. What the daily rates-drift workflow runs (with --apply). Auto-loads .env."
run = """
if [ -f .env ]; then set -a; . ./.env; set +a; fi
cargo run -q -p beyond-rates-sync -- classify
"""

[tasks."catalog:drift"]
description = "New models and retirements against the catalog (crates/rates-sync/src/catalog_drift.rs): fetch every listing, deprecation page and rate source, and print each finding (successor, retirement or needs-human) as JSON. Writes nothing to the tree. `-- --save DIR` keeps the inputs; `-- --inputs DIR` replays them offline. What the daily catalog-drift workflow runs. Auto-loads .env."
run = """
if [ -f .env ]; then set -a; . ./.env; set +a; fi
cargo run -q -p beyond-rates-sync -- catalog-drift "$@"
"""

[tasks."pricing:vectors"]
description = "Recompute every golden vector's expect in verify/pricing_vectors.json with the independent exact-rational reference pricer (verify/pricing_reference.py) against the compiled rate table, printing what changed. Add a vector as a {name, why, row} entry and run this. CI checks the file reproduces (crates/rates-sync/tests/pricing_reference.rs)."
run = """
mkdir -p target
cargo run -q -p beyond-rates-sync -- dump --json > target/rate-table.json
python3 -I verify/pricing_reference.py target/rate-table.json verify/pricing_vectors.json --write
"""

[tasks."rates:audit"]
description = "Second opinions on the rate table: LiteLLM and models.dev disagreements (leads, never corrections), and the vendors' own invoices (OpenAI/Anthropic admin cost APIs) checked line by line against the cards. Auto-loads .env; the invoice check needs OPENAI_ADMIN_KEY / ANTHROPIC_ADMIN_KEY."
run = """
if [ -f .env ]; then set -a; . ./.env; set +a; fi
cargo run -q -p beyond-rates-sync -- audit
"""

[tasks."bench:unit"]
description = "divan micro-benchmarks of the IO-free hot paths (key/peek/usage/route/deny/allowance/cache/translate/rank): timing + native allocation counts."
run = "cargo bench --bench unit"

[tasks."bench:e2e"]
description = "A-1 end-to-end bench: real gateway binary + nats-server + mock upstream over HTTP."
run = "cargo bench --bench e2e"

[tasks."bench:decode"]
description = "divan micro-bench of the SSE decode hot path (framing + per-dialect decode + pipeline): timing + native allocation counts."
run = "cargo bench -p beyond-agent-core --bench decode"

[tasks."bench:decode:concurrent"]
description = "Decode concurrency-scaling probe (allocator-contention evidence gate). Add `--features bench-mimalloc` for the control run on a sharded allocator."
run = "cargo bench -p beyond-agent-core --bench decode_concurrent"

[tasks."bench:persistence"]
description = "Session listing scan + durable append micro-bench (timing + allocs)."
run = "cargo bench -p beyond-agent --bench persistence"

[tasks."bench:serve-runtime"]
description = "Process-level Tokio runtime A/B: current_thread vs multi_thread under concurrent serve WebSocket load (RSS, throughput, p95, CPU)."
run = "cargo bench -p beyond-agent --bench serve_runtime"

[tasks."bench:execd"]
description = "execd vs the baseline exec endpoint, A/B over HTTP on loopback (one-shot round trip, stream throughput, first frame, RSS, kill-on-disconnect). Set EXEC_BENCH_A to a baseline `beyond-ai-demo` binary built from the commit before execd."
run = "cargo bench -p beyond-execd --bench exec_compare"

[tasks."bench:execd:sandbox"]
description = "bench:execd inside a fresh PID namespace, where /proc holds a handful of processes like a sandbox's does (a busy host's thousands of processes slow execd's orphan reaper)."
run = "unshare -Urpf --mount-proc bash -c 'EXEC_BENCH_LABEL=sandbox cargo bench -p beyond-execd --bench exec_compare & wait'"

[tasks."bench"]
description = "Run both bench harnesses (unit micro + e2e macro)."
depends = ["bench:unit", "bench:e2e"]

[tasks."sim:matrix"]
description = "Fleet simulator conformance matrix. `--substrate nfs` needs root + nfs-kernel-server; the default local-dir substrate skips the claims that only a shared mount can show."
run = "cargo run -q -p beyond-fleet-sim --bin fleet-sim -- matrix"

[tasks."sim:list"]
description = "List the fleet simulator's scenarios and which substrate each one needs."
run = "cargo run -q -p beyond-fleet-sim --bin fleet-sim -- list"

[tasks."verify:status"]
description = "Run every claim/defect-tagged test (ignored reproductions included) and print each claim's computed status. See verify/README.md."
run = """
set -e
# Live cells (VERIFY_LIVE=1) drive the gateway binary from this tree; build it first.
if [ "${VERIFY_LIVE:-}" = 1 ]; then cargo build -q -p beyond-gateway; fi
expr=$(cargo run -q -p beyond-verify -- filter)
cargo nextest run --workspace --profile verify --run-ignored all --no-tests=pass -E "$expr" || true
# Reconciled live cells (BIL-5) run last, alone: a provider's usage report holds every request
# on the key and model, so no other suite may be sending. See verify/README.md.
rm -f target/nextest/verify-isolated/junit.xml
reports="--junit target/nextest/verify/junit.xml"
if [ "${VERIFY_LIVE:-}" = 1 ]; then
  expr=$(cargo run -q -p beyond-verify -- filter --isolated)
  cargo nextest run --workspace --profile verify-isolated --no-tests=pass -E "$expr" || true
  if [ -f target/nextest/verify-isolated/junit.xml ]; then reports="$reports --junit target/nextest/verify-isolated/junit.xml"; fi
fi
cargo run -q -p beyond-verify -- status $reports "$@"
"""

[tasks."verify:live"]
description = "verify:status including the live cells: real SDKs and agent harnesses, through this tree's gateway, to real providers. Spends real (small) money; reads keys from .env."
env = { VERIFY_LIVE = "1" }
run = "mise run verify:status"

[tasks."verify:catalog"]
description = "Live catalog sweep only (crates/verify/tests/catalog_live.rs): every in-scope candidate through this tree's gateway, then the cost summary and the Together/OpenRouter gap report. ~$2-3 per run; reads keys from .env. VERIFY_CATALOG_PLAN=1 prints the plan and estimate instead."
env = { VERIFY_LIVE = "1" }
run = """
set -e
cargo build -q -p beyond-gateway
cargo nextest run -p beyond-verify --test catalog_live --profile verify --no-fail-fast "$@" || true
VERIFY_CATALOG_SUMMARY=1 cargo test -q -p beyond-verify --test catalog_live
VERIFY_CATALOG_GAPS=1 cargo test -q -p beyond-verify --test catalog_live
"""

[tasks."verify:gate"]
description = "Fail on any inconsistency between verify/claims.toml, verify/defects.toml, test tags and the last verify:status run."
run = """
reports="--junit target/nextest/verify/junit.xml"
if [ -f target/nextest/verify-isolated/junit.xml ]; then reports="$reports --junit target/nextest/verify-isolated/junit.xml"; fi
cargo run -q -p beyond-verify -- gate $reports
"""

# ---- TypeScript SDK (sdk/ts: npm workspace root; @beyond.dev/sandbox is the sandbox client) ----

[tasks."install:ts"]
description = "Install the TypeScript SDK's dependencies (npm ci in sdk/ts)."
run = "npm ci"
dir = "sdk/ts"

[tasks."build:ts"]
description = "Build the TypeScript SDK (tsdown): sdk/ts/sandbox/dist, including the conformance driver dist/driver.mjs."
run = "npm run build"
dir = "sdk/ts"

[tasks."check:ts"]
description = "Typecheck the TypeScript SDK (tsc --noEmit, strict). Formatting is dprint's, in check:fmt."
run = "npm run typecheck"
dir = "sdk/ts"

[tasks."test:ts"]
description = "TypeScript SDK tests: parsers and command builders, a fake endpoint, and a loopback execd (EXECD_BIN, or target/debug/execd, built if absent)."
run = "npm test"
dir = "sdk/ts"

# ---- sandbox clients: the conformance matrix --------------------------------------------------------

[tasks."build:execd-static"]
description = "A static (musl) execd for this machine's architecture: the binary the container backends of the client matrix mount."
run = """
t="$(uname -m)-unknown-linux-musl"
rustup target add "$t" >/dev/null
cc="CC_$(echo "$t" | tr '-' '_')"
ln="CARGO_TARGET_$(echo "$t" | tr 'a-z-' 'A-Z_')_LINKER"
env "$cc=musl-gcc" "$ln=musl-gcc" cargo build -q -p beyond-execd --target "$t"
"""

[tasks."test:clients"]
description = "The client conformance matrix: every driver in sdk/conformance/drivers.toml against every backend (local, alpine, debian-runas, readonly, tinydisk). Needs docker for the container backends. BACKENDS overrides the list; extra arguments go to sandbox-matrix (e.g. --filter 'files.*', --verbose)."
depends = ["build:execd-static"]
run = """
set -e
cargo build -q -p beyond-execd -p beyond-sandbox-conformance
backends=""
for b in ${BACKENDS:-local alpine debian-runas readonly tinydisk}; do backends="$backends --backend $b"; done
mkdir -p target/sandbox-matrix
target/debug/sandbox-matrix --registry sdk/conformance/drivers.toml $backends \
  --report target/sandbox-matrix/report.json "$@"
"""

[tasks."test:clients:e2b"]
description = "The client conformance matrix against a real E2B VM running the released execd (every driver, plus relay pairs). Opt-in and billed (about $0.10/hour, one VM, hard 25 minute lifetime): needs E2B_API_KEY in the environment. E2B_EXECD_VERSION picks the release tag; E2B_EXECD_BIN=/path/to/static/execd uploads that build instead. Extra arguments go to sandbox-matrix. Set DIFFERENTIAL_E2B=1 to also run the differential test against it (DIFFERENTIAL_CASES sets the count)."
run = """
set -e
cargo build -q -p beyond-sandbox-conformance -p beyond-sandbox-mcp
mkdir -p target/sandbox-matrix
target/debug/sandbox-matrix --registry sdk/conformance/drivers.toml --backend e2b \
  --report target/sandbox-matrix/report-e2b.json "$@"
if [ -n "${DIFFERENTIAL_E2B:-}" ]; then
  if [ ! -f sdk/ts/sandbox/dist/driver.mjs ]; then
    npm ci --prefix sdk/ts --silent && npm run build --prefix sdk/ts --silent
  fi
  DIFFERENTIAL_BACKENDS=e2b cargo test -q -p beyond-sandbox-conformance --test differential -- --include-ignored --nocapture e2b
fi
"""

[tasks."test:differential"]
description = "Randomized differential testing across every client: Hegel generates operation sequences, each runs through every driver in sdk/conformance/drivers.toml on its own fresh root, and the answers are compared with each other and (local backends) with the filesystem. Fixed seeds and case counts; widen with DIFFERENTIAL_CASES, DIFFERENTIAL_SEED, DIFFERENTIAL_STEPS, DIFFERENTIAL_BACKENDS, DIFFERENTIAL_DRIVERS, DIFFERENTIAL_SHRINK=0. The container backends run when docker is available."
depends = ["build:execd-static"]
run = """
set -e
cargo build -q -p beyond-execd -p beyond-sandbox-conformance -p beyond-sandbox-mcp
if [ ! -f sdk/ts/sandbox/dist/driver.mjs ]; then
  npm ci --prefix sdk/ts --silent && npm run build --prefix sdk/ts --silent
fi
export EXECD_BIN="$PWD/target/debug/execd"
export EXECD_STATIC_BIN="$PWD/target/$(uname -m)-unknown-linux-musl/debug/execd"
cargo test -q -p beyond-sandbox-conformance --test differential -- --include-ignored --nocapture "$@"
"""

# ---- python client: beyond-sandbox (sdk/python/sandbox) ---------------------------------------------

[tasks."install:py"]
description = "Install beyond-sandbox and its dev tools into sdk/python/sandbox/.venv (uv when present, else venv + pip)."
run = """
set -e
cd sdk/python/sandbox
if command -v uv >/dev/null 2>&1; then
  uv venv -q --allow-existing .venv
  uv pip install -q --python .venv/bin/python -e '.[dev]'
else
  [ -x .venv/bin/python ] || python3 -m venv .venv
  .venv/bin/pip install -q -e '.[dev]'
fi
"""

[tasks."check:py"]
description = "beyond-sandbox: ruff format and lint, mypy --strict."
depends = ["install:py"]
run = """
set -e
cd sdk/python/sandbox
.venv/bin/ruff format --check .
.venv/bin/ruff check .
.venv/bin/mypy
"""

[tasks."test:py"]
description = "beyond-sandbox: the pytest suite. The loopback tests need execd (cargo build -p beyond-execd, or EXECD_BIN) and skip without it. The shared matrix is `mise run test:clients`."
depends = ["install:py"]
run = """
set -e
cargo build -q -p beyond-execd -p beyond-sandbox-conformance -p beyond-sandbox-mcp
cd sdk/python/sandbox
.venv/bin/pytest
"""
