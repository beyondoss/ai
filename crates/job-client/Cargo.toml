[package]
name = "beyond-job-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true
description = "The job client's kernel: the job cursor (one job incarnation at one output offset) as pure functions, proven in Verus"

[lib]
name = "job_client"
path = "src/lib.rs"

[lints]
workspace = true

# Its one dependency is `vstd`, for the `verus!` macro: a normal build erases every proof and spec, and
# only `cargo verus` (`mise run verify:kernels`) checks them. The version is the one the pinned release
# ships (`.github/scripts/verus.env`).
[dependencies]
vstd = "=0.0.0-2026-11-01-0251"

[package.metadata.verus]
verify = true

[features]
# Mutations of the cursor's decisions, each removing one guard. The proof
# (`mise run verify:kernels -- --features <mut>`, which runs here) goes red under each.
mut_offset_truncated = [] # encode writes only the low 32 bits of the offset (C2)
mut_check_skipped = [] # decode accepts any check value (C1, C3a)
mut_check_skips_a_byte = [] # the check leaves out the last body byte, so a change there goes unseen (C3a)
mut_trailing_accepted = [] # decode drops one trailing newline, so a cursor with a byte glued on decodes (C3c)
mut_prefix_accepted = [] # decode pads a missing last byte, so a cursor cut short decodes (C3b)
mut_scope_unchecked = [] # decode takes any byte in a scope (C4)
mut_mark_unchecked = [] # decode takes any byte in a mark (C4)
mut_id_unchecked = [] # decode takes any byte in an id (C4)
mut_rejects_max_offset = [] # decode refuses the offset u64::MAX, a valid cursor (C1, C2)

# Mutations of the step function (`src/step.rs`), each removing one guard of one property. The proof goes red under each.
mut_offset_wraps = [] # an overflowing offset wraps instead of failing (O)
mut_reattach_from_zero = [] # a reopen after a wait asks from offset 0 (O)
mut_gap_not_counted = [] # a gap frame is not added to the pending gap (G)
mut_trailing_gap_dropped = [] # the exit does not carry the gap before it (G)
mut_budget_reset_on_connect = [] # a bare 2xx answer resets the reconnect budget (B)
mut_budget_not_reset_on_echo = [] # a confirmed reattach does not reset the budget (B)
mut_gives_up_on_budget = [] # after 12 failed opens in a row the handle ends (A)
mut_echo_mark_unchecked = [] # an echo of another mark is taken (M)
mut_echo_skipped = [] # a 2xx answer goes straight to streaming, with no echo (M)
mut_reattach_after_exit = [] # a cut after the exit reopens the stream (X)
mut_remove_on_exit_frame = [] # the remove is sent with the exit, before the consumer took it (R)
mut_remove_unscoped = [] # the remove carries no mark (R)
mut_exit_taken_stalls = [] # the consumer taking the exit does not start the remove (R)
mut_429_terminal = [] # 429 ends the handle (C)
mut_503_start_retried = [] # 503 on a start is retried (C)
mut_auth_retried = [] # 401 is retried (C)
mut_404_retried = [] # 404 on an attach is retried (C)
mut_500_retried = [] # 500 is retried (C)
mut_everything_retried = [] # 400 is retried (C)
mut_backoff_no_cap = [] # the wait grows past the cap (W)
mut_retry_after_ignored = [] # Retry-After is ignored (W)
mut_retry_after_uncapped = [] # Retry-After is not capped (W)
mut_backoff_never_reopens = [] # the end of a wait does not reopen (P)
mut_silence_fixed = [] # the silence limit ignores the heartbeat (S)
mut_silence_one_beat = [] # the silence limit is one beat, not two (S)
mut_start_fresh_key = [] # a start sent again carries a fresh key (K)
mut_gone_on_silence = [] # a cut ends the handle as SandboxGone (SG)
mut_gone_ignored = [] # an authoritative answer is classified by its status (SG)
mut_gone_any_502 = [] # a 502 with the right message names a sandbox that is not ours as gone (SG)
mut_gone_any_401 = [] # any 401 is a session that has ended (SG)
mut_heartbeat_ends = [] # a heartbeat ends the handle (A)
mut_start_lost_gives_up = [] # a lost start ends the handle (K)
mut_watch_delivers = [] # a watching handle delivers output (V)
mut_close_removes = [] # a close after the exit removes the job (D)

# The model (`tests/step_model.rs`) drives `step`, never a copy of it.
[dev-dependencies]
stateright = "0.31.0"
