[[defect]]
id = "D104"
severity = "med"
area = "Catalog"
title = "GPT-5-family cards list the total context as context_window; OpenAI's input limit is lower"
impact = "ModelCard.context_window is documented as the most input tokens one request may carry. On gpt-5, gpt-5-mini, gpt-5-nano, gpt-5.1, gpt-5.2, gpt-5.4-mini and gpt-5.4-nano the card says 400000 but OpenAI rejects input over 272000; on gpt-5.4, gpt-5.5, gpt-5.6-luna/sol/terra and gpt-6-astra the card says 1050000 but the limit is 922000. A client sizing its prompt from /v1/models gets a 400 between those numbers."
confidence = "high"
evidence = "live 2026-10-01 catalog sweep, CAT-3::raw::openai::{gpt-5,gpt-5-mini,gpt-5-nano,gpt-5.1,gpt-5.2,gpt-5.4-mini,gpt-5.4-nano}: over-limit prompt -> 400 context_length_exceeded \"Input tokens exceed the configured limit of 272000 tokens\" (card 400000); CAT-3::raw::openai::{gpt-5.4,gpt-5.5,gpt-5.6-luna,gpt-5.6-sol,gpt-5.6-terra,gpt-6-astra}: \"configured limit of 922000 tokens\" (card 1050000). Same in all three sweeps."
claims = ["CAT-3"]
state = "fixed"
test = "gpt5_cards_state_openais_input_cap"
fix = "f00e48a"
note = "OpenAI's model pages publish 400K / 1.05M as the context window (input + output), which is what catalog_truth.toml records; the API's input cap is the window minus the 128K max output. Fixed: The card states the limit every candidate enforces, not the window: GPT-5-family cards list OpenAI's input cap (272,000 of 400,000; 922,000 of 1,050,000; gpt-5-pro 128,000, the 400K window less its 272K max output, by the same rule since its TPM and Responses-only error hide the number). catalog_truth.toml keeps the vendor's window and records input_limit with the API's own error as evidence. One figure per row rather than per candidate: the gateway counts no prompt tokens, so it could not pick a candidate by window, and a client only sees the row. Live: CAT-3::raw::openai::{gpt-5,gpt-5.4,...} pass (re-run 2026-10-01)."

