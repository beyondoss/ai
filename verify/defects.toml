note = "Found by the property suites. Proposed: join an event's consecutive data: lines before parsing (only on lines that fail to parse, to keep the fast path). Fixed in c559d49: openai_stream and anthropic_stream_parts keep their line-by-line fast path; a line that names `usage` but is not JSON alone sends them to a slow path that reads the view event by event, each event's data: lines joined with \\n (each line alone when the joined text is not one JSON value). One-line-per-event streams never take it: benches/unit.rs usage anthropic_stream_tail/65536 9.5 us (documented 9.4), openai_stream_tail 0.18 us. The props_usage (two) and props_sse multiline exclusions are removed."

[[defect]]
id = "D127"
severity = "low"
area = "Translation"
title = "Numbers in tool arguments change value when translation re-parses them"
impact = "Translation re-parses tool arguments as serde_json Values (a Chat history call's `arguments` onto Messages; a non-stream Messages `tool_use.input` onto Chat or Responses; a Chat call onto a Messages client). serde_json's default float parsing is not correctly rounded and has no arbitrary precision, so a float with more than ~15 significant digits can come out a different number and an integer past u64 becomes an f64. The model's own arguments, replayed in history or handed to the client's tool, are silently altered; the stream path (which passes partial_json through) disagrees with the non-stream one."
