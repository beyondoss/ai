# =================================================================================================
# Pricing contract rates (crates/providers/src/rates.rs; the pricer is crates/providers/src/pricing.rs)
# =================================================================================================
#
# Every rate the pricer uses, with the primary source it was read from and the date. USD per
# million tokens unless stated; per-call fees are USD per call. `rates_match_truth`
# (crates/providers/tests/rates_truth.rs) holds `rates.rs` to these entries one for one, so a rate
# changes in both places or the build fails.
#
# `[[card]]`: one vendor's published card for one model.
# - `standard`, and `long`, `fast`, `fast_long`, `ultrafast`, `ultrafast_long`, `flex`,
#   `flex_long` where sold: `{ input, output, cache_read, cache_write, cache_write_1h }`.
#   `cache_write` is the 5-minute (default) write. An unpublished `cache_read` / `cache_write` is
#   the input rate (no discount, no premium; never $0). `cache_write_1h` is absent where the vendor
#   sells no 1-hour write, and the pricer then refuses a row that reports one.
#   A class or tier that is absent is not sold or not published: refused, never guessed.
# - `long_context = { threshold, inclusive }`: the whole request is billed at the `*_long` rates
#   when the whole prompt (uncached input + cache reads + cache writes) is `>= threshold`
#   (`inclusive`) or `> threshold`.
# - `geo_us`: the multiplier on every token rate for `inference_geo: "us"`.
# - `tools`: per-call fees. A tool the card does not list is refused, not billed at zero; a `"0"`
#   fee is a published "no additional charge".
# - `off_peak`: peak windows (UTC), weekdays only or not, the holidays that are off-peak in full,
#   the span of days the holiday list covers, and the off-peak rates. A weekday peak minute outside
#   `covered` is refused until the next year's holidays are recorded.
# - `note`: what the source said where it needed reading (a conflict between two vendor pages,
#   a promotion, a scope).
#
# `[[pricing]]`: one per catalog row. `customer` names the card the customer pays (`list`: the
# catalog's ListPrice alone, no other dimension); `cost` maps each candidate provider to its card:
# `customer` (the same card), a `[[card]]` name, `openrouter:{slug}` (an `[[openrouter]]` entry),
# or `unverified: {reason}` (the pricer refuses every row that provider serves).
#
# `[[openrouter]]`: one model's endpoints as `GET /api/v1/models/{slug}/endpoints` lists them
# (prices per token there, per million here). Each endpoint is a host plus a region or tier
# variant (`tag`); `class` is the tier its tag names. `long` with `long_context` is a
# `min_prompt_tokens` override (strictly greater). `time_of_day = true` marks a peak/off-peak
# schedule (DeepSeek's), recorded at its dearest window. These are the cost fallback for a row
# with no reported `usage.cost`; with one, the reported cost (plus `[openrouter_fee]`) is used.

[openrouter_fee]
credit_fee = "0.055"
source = ["https://openrouter.ai/pricing", "https://openrouter.ai/docs/faq"]
date = "2026-10-10"
note = "\"OpenRouter's fee is charged when you buy credits, 5.5% on Standard and 8% on Business, never on individual requests.\" \"No. Inference is billed at the provider's list price on every plan.\" The FAQ's $0.80 minimum is per purchase."

