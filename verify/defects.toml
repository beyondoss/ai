[[defect]]
id = "D203"
severity = "med"
area = "Security"
title = "A JSON-escaped echo of a pool key holding / or + reached the client"
impact = "Redact masked only the key's bytes as sent. A Bedrock API key (ABSK...) is base64 and holds / and +, which a JSON encoder may write as \\/ and \\u002b. An echo in that spelling was relayed, and any JSON client decodes it to the key. Worse, when the error also carried an account remedy, remedy::neutralize decoded the body and re-serialized it unescaped after masking, turning \\/ into a raw key in a field it did not rewrite."
confidence = "high"
evidence = "Hermetic: a_json_escaped_echo_of_the_pool_key_never_reaches_the_client. With pool key ABSKQmVkcm9ja0FQSUtleS1h/YmNk+ZWZn/aGlq on /openai/v1/chat/completions, a 401 {\"message\":\"... ABSKQmVkcm9ja0FQSUtleS1h\\/YmNk+ZWZn\\/aGlq\"} was relayed as sent; one with a remedy came back with \"param\":\"ABSKQmVkcm9ja0FQSUtleS1h/YmNk+ZWZn/aGlq\" (the key, unescaped by the rewrite); a text/plain 401 relayed the escaped spelling."
claims = ["SEC-7"]
state = "fixed"
test = "a_json_escaped_echo_of_the_pool_key_never_reaches_the_client"
fix = "6a324f0"
note = "Fixed in route.rs and proxy.rs: route::key_finders builds, once per pool key at boot, a searcher for the key as sent and for each spelling a JSON encoder writes / and + in (\\/; \\u002b, \\u002B; one encoder writes every occurrence alike, so at most 6), and Redact masks each of them on every path (streamed, non-JSON, held whole), holding back the longest spelling's tail per chunk. A held JSON error is masked again with the raw key after the remedy rewrite re-serializes it, and when it carries any other \\u escape and the key decodes from it, it is relayed re-serialized and masked. Unit: redact_scrubs_every_json_spelling_of_a_base64_key (streamed, held, held and rewritten; \\u002b, \\u002B and a \\u0041 spelling). Cost: error paths only; a key with no / or + still has one searcher."

