# cargo-mutants (https://mutants.rs) defaults: the gateway's money and correctness paths.
#
#   cargo mutants -p beyond-ai --jobs 3 --cargo-arg=--lib   # fast pass: unit tests only
#   cargo mutants -p beyond-ai --jobs 3 --iterate           # then the survivors, every test
#
# The integration suites need `nats-server` on PATH. Narrow proxy.rs with `--re` to the functions
# under study; the whole file is ~860 mutants.
test_tool = "nextest"
examine_globs = [
  "crates/gateway/src/usage.rs",
  "crates/gateway/src/proxy.rs",
  "crates/gateway/src/translate.rs",
  "crates/gateway/src/circuit_breaker.rs",
  "crates/gateway/src/peek.rs",
]
# Equivalent mutants, each with the reason at its source.
exclude_re = [
  # `logging`'s breaker ledger never sees a pending permit with a status: `response_filter` takes
  # the permit when it sets `upstream_status`, so the `Some(s)` arms are defensive only.
  'replace match guard s >= 500 with (true|false) in <impl ProxyHttp for AiProxy>::logging',
  # The same guard's operator mutation (it is the only `>=` in `logging` today; re-check this
  # exclusion if another one is added there).
  'replace >= with < in <impl ProxyHttp for AiProxy>::logging',
]
