[[defect]]
id = "D125"
severity = "med"
area = "Billing"
title = "A payload marker split across three or more body chunks is missed, so a cut-short estimate bills the image as text"
impact = "InputTally excludes base64 payloads from the cut-short input estimate by finding `;base64,` / `\"data\":` markers, carrying the last bytes of each chunk into the next. The carry is replaced by each chunk's own tail, so a marker spread over three chunks (any chunk shorter than the marker holding its middle) is never found and the payload counts as text: a 100 KB inline image estimates ~20,000 input tokens instead of ~24. Request bodies arrive in whatever chunks the client's writes and the H1/H2 framing make, and an estimate is a bill the customer cannot check."
confidence = "high"
evidence = "props_usage::prop_input_tally_ignores_chunking (fed byte by byte), minimized: a Chat body with one `data:application/pdf;base64,A+A0a` file part estimates 30 whole and 31 byte by byte. Regression: a 100,000-byte image body fed as [..`;ba`, `se`, `64,`..] estimates 20024 tokens, whole 24. usage.rs InputTally::feed (the `None` branch overwrites `carry` with only this chunk's tail)."
claims = ["BIL-20"]
state = "fixed"
test = "input_estimate_ignores_how_the_body_is_chunked"
fix = "498cb8f"
note = "Found by the property suites (crates/gateway/tests/props_usage.rs). Proposed: keep the last MARKER_CARRY bytes of carry+chunk, not of the chunk alone. Fixed by the D99 rewrite of InputTally (498cb8f): payloads drop out as values of non-text keys, with no markers to split, so any chunking agrees with the whole body. The property's at-least-7-byte chunk exclusion was removed at integration."

[[defect]]
id = "D126"
severity = "low"
area = "Billing"
title = "A usage event spread over several data: lines bills no exact usage"
