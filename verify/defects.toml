[[defect]]
id = "D195"
severity = "med"
area = "Billing"
title = "A non-stream 2xx that ended without usage was billed 0/0"
impact = "When a provider answered a non-streaming request with a complete 200 whose usage was missing or null, the row wrote zero input and zero output, though the provider took the prompt and may bill it. OpenRouter does this when a generation fails partway (an empty or partial message beside \"usage\": null) and documents that the upstream may still charge the prompt. The same turn streamed was already billed an estimate (D123: a finished stream without usage is a billed turn, never a silent 0/0), so whether a customer paid for a failed turn depended on whether it streamed."
confidence = "high"
evidence = "live 2026-10-01 final run (target/final-live4.log): CAT-7::raw::openrouter::grok-4.20-multi-agent, a forced OpenRouter call that took 8.4s, answered 200 with usage null, and its ai.usage row billed input 0, output 0 (target/catalog-live/sweep.jsonl at 1790888529); the same minute CAT-6::raw::openrouter::grok-4.20 and ::grok-4.20-multi-agent got 200s with empty text and 0/0 rows. OpenRouter's errors page (https://openrouter.ai/docs/api-reference/errors): \"In some cases, you may still be charged for the prompt processing cost by the upstream provider, even if no content is generated\"; a non-stream request whose provider fails gets \"a 200 OK whose JSON body holds only an error object and no choices\", and one interrupted mid-generation gets the error \"in the final response alongside any partial content\" with finish_reason \"error\". Code: proxy.rs logging estimated a 2xx only when streaming (cut_short), cut off (body_cut, needs an error) or given up on (no_head); a clean non-stream 2xx with parsed usage None fell through to 0/0 with only the usage_parse_errors warning."
claims = ["BIL-20", "BIL-12"]
state = "fixed"
test = "a_non_stream_answer_without_usage_is_billed_an_estimate"
fix = "90ac266"
note = "Fixed in proxy.rs logging: a managed, non-free, non-stream 2xx that ended cleanly with no parseable usage is estimated as a cut-off body is (input from the request tally, a lower bound; output from the string values in the body tail), flagged usage_estimated, and still counted on ai_usage_parse_errors_total. A body that is only an error object (OpenRouter's non-stream error-in-200, root key error, read whole when the body fits the 64 KiB tail) stays 0/0 and is not an estimate, as an error-only stream is (a_non_stream_error_in_200_is_not_billed). The provider's own charge for such a turn cannot be read back (OpenRouter's generation endpoint needs the id from a response that never named one), so the estimate errs low, as every estimate does (BIL-20). The catalog sweep now reads an error-in-200 as the status its error.code names and retries it, so a cell no longer passes or fails on one silently."

[[defect]]
id = "D196"
