[tools]
dprint = "latest"
rust = { version = "1.92", components = "rustfmt,clippy,llvm-tools-preview", targets = "aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu" }
yamlfmt = "latest"
cargo-binstall = "latest"
"cargo:cross" = "latest"
# nats-server for the e2e harness (real JetStream KV backing slipstream).
"ubi:nats-io/nats-server" = { version = "latest", exe = "nats-server" }
# ripgrep for the filesystem-backend parity suite. `ShellFs` has two rungs — `rg`, which matches the
# in-process walker exactly, and a POSIX `grep` fallback with two known divergences — and only a box
# that *has* `rg` can test the strict one. GitHub's runner image does not ship it, so without this the
# strict rung silently stops being covered (it failed loudly instead; see `fs_backend_parity.rs`).
"github:BurntSushi/ripgrep" = { version = "latest", exe = "rg" }

[tasks."build:rs"]
run = "cargo build"

[tasks."build:rs:release"]
run = "cargo build --release"

[tasks."ai:mint-dev-key"]
description = "Mint a deterministic DEV-ONLY signing pubkey + bai_v1 token (fixed seed) for wiring up the dev config. Not for production."
run = "cargo run -p beyond-ai --example mint_dev_key"

[tasks."build:agent"]
run = "cargo build -p beyond-ai-agent"

[tasks."run:agent"]
description = "Run the agent harness CLI (e.g. `mise run run:agent -- tools`)."
run = "cargo run -p beyond-ai-agent --"

[tasks."test:unit:agent"]
description = "Unit tests for the agent harness core (messages, tool registry, session)."
run = "cargo test -p beyond-ai-agent-core"

[tasks."test:code-mode"]
description = "Code Mode evals: catalog-token A/B + execute composition (needs --features code-mode). Live Grok/OpenRouter: OPENROUTER_API_KEY and pass -- --ignored."
run = "cargo test -p beyond-ai-agent --features code-mode --test code_mode_eval -- --nocapture"

[tasks."check:rs"]
run = "cargo clippy --all-targets -- -D warnings"

[tasks."check:fmt"]
run = "dprint check"

[tasks."format"]
run = "dprint fmt && cargo fmt"

[tasks."test:unit:rs"]
description = "Unit tests for the pure-logic modules (key/route/peek/usage/deny/config/resolver)."
run = "cargo test --lib"

# Integration tests (gateway driven against a mock upstream + NATS) — to be added; see ARCHITECTURE.md.
[tasks."test:integration:rs"]
description = "End-to-end gateway tests against a mock provider + docker-compose NATS (TODO)."
run = "cargo test --test '*'"

[tasks."test:smoke"]
description = "Live smoke tests against REAL providers. Auto-loads .env if present; set the API keys you have (ANTHROPIC_API_KEY, OPENAI_API_KEY, GROQ_API_KEY, …) there or in the environment. Each test skips if its key is unset. Bills real (tiny, max_tokens-capped) requests."
run = """
# Auto-load .env if it exists (export every assignment), so the keys reach the test process.
if [ -f .env ]; then set -a; . ./.env; set +a; fi
cargo test -p beyond-ai --test smoke -- --ignored --nocapture
"""

[tasks."test:smoke:agent"]
description = "Live agent smoke: the real agent binary → real gateway → REAL Anthropic. Auto-loads .env; needs ANTHROPIC_API_KEY. Skips if unset. Bills a tiny real request."
run = """
if [ -f .env ]; then set -a; . ./.env; set +a; fi
cargo test -p beyond-ai-agent --test smoke -- --ignored --nocapture
"""

[tasks."bench:unit"]
description = "divan micro-benchmarks of the IO-free hot paths (key/peek/usage/route/deny): timing + native allocation counts."
run = "cargo bench --bench unit"

[tasks."bench:e2e"]
description = "A-1 end-to-end bench: real beyond-ai binary + nats-server + mock upstream over HTTP."
run = "cargo bench --bench e2e"

[tasks."bench:decode"]
description = "divan micro-bench of the SSE decode hot path (framing + per-dialect decode + pipeline): timing + native allocation counts."
run = "cargo bench -p beyond-ai-agent-core --bench decode"

[tasks."bench:decode:concurrent"]
description = "Decode concurrency-scaling probe (allocator-contention evidence gate). Add `--features bench-mimalloc` for the control run on a sharded allocator."
run = "cargo bench -p beyond-ai-agent-core --bench decode_concurrent"

[tasks."bench"]
description = "Run both bench harnesses (unit micro + e2e macro)."
depends = ["bench:unit", "bench:e2e"]
