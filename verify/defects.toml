title = "The catalog served models their makers had retired, routed to dead candidates, and missed new releases"
impact = "Nothing held the catalog to the vendors' current lineups, so it drifted silently. Requests for claude-opus-4-1 (retired by Anthropic 2026-08-05) and claude-sonnet-4 (2026-06-15) were still sent, to OpenRouter's Bedrock copies; gpt-5.1-codex, -codex-max, -codex-mini and gpt-5.2-codex (shut down by OpenAI 2026-07-23, still in its /v1/models listing) to OpenRouter's Azure copies. The z-ai/glm-5.2 row kept a Fireworks candidate whose serverless ended 2026-09-25, so its walk tried a dead host. o1-pro's OpenRouter failover takes no tools though the card lists them. Thirteen rows with announced shutdowns (Sonnet 4.5 on 2026-11-30; gpt-4, gpt-4-turbo, gpt-4.1-nano, o1, o1-pro, o3-mini, o4-mini on 2026-10-23; gpt-5, -mini, -nano, -pro, o3, o3-pro on 2026-12-11) were recorded nowhere, so the first sign would have been a customer's vendor 404. GPT-6 Sol, GPT-6 Luna, GPT-6.1 Sol and Grok 4.7, which their vendors list and recommend, were not rows."
