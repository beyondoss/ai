[package]
name = "beyond-execd"
version = "0.1.21"
edition.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true
description = "execd: a production exec endpoint that runs inside a sandbox and speaks the agent's exec protocol (the whole protocol)"

[lib]
name = "execd"
path = "src/lib.rs"

[[bin]]
name = "execd"
path = "src/main.rs"

[lints]
workspace = true

[features]
# The global allocator under test in the Memory measurements; off in the shipped build unless the
# numbers say otherwise.
mimalloc = ["dep:mimalloc"]
# Mutations of `job_kernel` (the crate `execd-jobs`, which Verus proves), used only by `tests/job_model.rs`'s red runs: each removes one guard.
mut_start_overwrites = [
  "beyond-execd-jobs/mut_start_overwrites",
] # a start of a key in the table replaces it (J1)
mut_scope_ignored = [
  "beyond-execd-jobs/mut_scope_ignored",
] # a lookup by id alone, any scope (J2)
mut_remove_keeps_entry = [
  "beyond-execd-jobs/mut_remove_keeps_entry",
] # a removed job stays in the table (J3)
mut_end_rewritten = [
  "beyond-execd-jobs/mut_end_rewritten",
] # a second end rewrites an ended job's code (J4)
mut_disconnect_kills_kept = [
  "beyond-execd-jobs/mut_disconnect_kills_kept",
] # a held start's client leaving kills a kept job (J6)
mut_remove_live = [
  "beyond-execd-jobs/mut_remove_live",
] # a job is taken out with its group alive (J7)
mut_signal_ended = [
  "beyond-execd-jobs/mut_signal_ended",
] # `signal` reaches an ended job's group, whose number may be reused (J8)
mut_ended_not_removable = [
  "beyond-execd-jobs/mut_ended_not_removable",
] # `remove` waits for the group to look empty, even for an ended job (L1)
mut_stream_follows_key = [
  "beyond-execd-jobs/mut_stream_follows_key",
] # a stream goes on with whatever job holds its key now (J9)
mut_take_by_key = [
  "beyond-execd-jobs/mut_take_by_key",
]
mut_follow_waits_after_end = [
  "beyond-execd-jobs/mut_follow_waits_after_end",
] # a stream never sends its final frame (L2)
mut_signal_after_reap = [
  "beyond-execd-jobs/mut_signal_after_reap",
] # a signal by number reaches a group the reaper has freed (J11)
mut_held_forgets = [
  "beyond-execd-jobs/mut_held_forgets",
] # a spawn's group is never held, so a live group is refused every signal (J11 liveness)
mut_recover_drops_live = [
  "beyond-execd-jobs/mut_recover_drops_live",
] # a restart forgets a job whose group is alive (R2; `tests/restart.rs`)
mut_recover_adopts_gone = [
  "beyond-execd-jobs/mut_recover_adopts_gone",
] # a restart adopts a job whose group is gone, so it never ends (R3)
mut_recover_reends_ended = [
  "beyond-execd-jobs/mut_recover_reends_ended",
] # a restart drops an ended job whose group number is gone (R1)
mut_recover_forgets_shell_status = [
  "beyond-execd-jobs/mut_recover_forgets_shell_status",
] # a restart ends a job whose shell had exited with the lost-status code (R3)
mut_job_output_pipe = [
  "beyond-execd-jobs/mut_job_output_pipe",
] # a job's output goes to a pipe, so a write after a restart is SIGPIPE (S1; `tests/restart.rs`)
mut_ledger_spool_per_server = [
  "beyond-execd-jobs/mut_ledger_spool_per_server",
] # a ledger's spools go in the server's own directory, which goes with it (S7; `tests/restart.rs`)
mut_unledgered_spool_stable = [
  "beyond-execd-jobs/mut_unledgered_spool_stable",
] # a server with no ledger leaves its spools in the stable directory (S7)
mut_command_output_spool = [
  "beyond-execd-jobs/mut_command_output_spool",
] # a command's output goes to a spool file, not its client's pipe (S2)
mut_shutdown_signals_jobs = [
  "beyond-execd-jobs/mut_shutdown_signals_jobs",
] # execd's shutdown signals every recorded job's group (S3; `tests/restart.rs`)
mut_shutdown_orphans_unrecorded = [
  "beyond-execd-jobs/mut_shutdown_orphans_unrecorded",
] # execd's shutdown leaves a job running that no ledger can find (S3b)
mut_term_keeps_jobs = [
  "beyond-execd-jobs/mut_term_keeps_jobs",
]
mut_shutdown_forgets_jobs = [
  "beyond-execd-jobs/mut_shutdown_forgets_jobs",
] # execd's shutdown empties the ledger of its jobs (S4; `tests/restart.rs`)
mut_shutdown_spares_commands = [
  "beyond-execd-jobs/mut_shutdown_spares_commands",
] # execd's shutdown leaves a command's group running (S5)
mut_resume_cursor_lags = [
  "beyond-execd-jobs/mut_resume_cursor_lags",
] # a restart reads a stream again from its cursor, journalled bytes included (X1; `tests/restart.rs`)
mut_resume_end_drops_journal = [
  "beyond-execd-jobs/mut_resume_end_drops_journal",
] # a restart's ring ends before the journalled bytes, so offsets move (X2)
mut_resume_replays_chunked = [
  "beyond-execd-jobs/mut_resume_replays_chunked",
] # a journalled byte already in a chunk file is put in the ring again (X3)
mut_stdin_replays = [
  "beyond-execd-jobs/mut_stdin_replays",
] # bytes below `written` are applied again (W2)
mut_stdin_applies_ahead = [
  "beyond-execd-jobs/mut_stdin_applies_ahead",
] # a write ahead of `written` applies at once instead of waiting (W5)
mut_stdin_writes_ended = [
  "beyond-execd-jobs/mut_stdin_writes_ended",
] # a write lands on an ended or removed job's stdin (W3)
mut_stdin_writes_after_eof = [
  "beyond-execd-jobs/mut_stdin_writes_after_eof",
] # a write lands after EOF closed the stdin (W4)
mut_stdin_waiters_unbounded = [
  "beyond-execd-jobs/mut_stdin_waiters_unbounded",
] # a job's stdin admits every waiting write (W1)
mut_stdin_waiter_stuck = [
  "beyond-execd-jobs/mut_stdin_waiter_stuck",
] # the 16th waiter is refused as well, so a freed slot is never filled (W1-live)
mut_stdin_waits_at_written = [
  "beyond-execd-jobs/mut_stdin_waits_at_written",
] # a write exactly at `written` waits for bytes that never come (W5-live, progress)
mut_stdin_wait_sticks = [
  "beyond-execd-jobs/mut_stdin_wait_sticks",
] # a write keeps waiting after the gap filled (W5-live, progress lemma)
mut_stdin_written_shrinks = [
  "beyond-execd-jobs/mut_stdin_written_shrinks",
] # `written` is set to the last write's size, so it can fall (W2b)
mut_stdin_apply_off_start = [
  "beyond-execd-jobs/mut_stdin_apply_off_start",
] # an apply skips one byte more than was applied, so it starts past `written` (W2c)
mut_resize_ended = ["beyond-execd-jobs/mut_resize_ended"] # T1
mut_resize_lost_while_spawning = [
  "beyond-execd-jobs/mut_resize_lost_while_spawning",
] # T1-live
mut_size_unbounded = ["beyond-execd-jobs/mut_size_unbounded"] # T3
mut_size_off_by_one = ["beyond-execd-jobs/mut_size_off_by_one"] # T4
mut_pty_err_sink = ["beyond-execd-jobs/mut_pty_err_sink"] # T5
mut_pty_kill_group_only = ["beyond-execd-jobs/mut_pty_kill_group_only"] # T9
mut_pty_eof_closes = ["beyond-execd-jobs/mut_pty_eof_closes"] # T10
mut_gate_refuses_open = ["beyond-execd-jobs/mut_gate_refuses_open"] # T11
mut_write_after_hangup = ["beyond-execd-jobs/mut_write_after_hangup"] # T12
mut_end_keeps_terminal = ["beyond-execd-jobs/mut_end_keeps_terminal"] # T8
mut_recover_hangs_up_live_terminal = [
  "beyond-execd-jobs/mut_recover_hangs_up_live_terminal",
] # T6
mut_recover_opens_silent_terminal = [
  "beyond-execd-jobs/mut_recover_opens_silent_terminal",
] # T7
mut_recover_drops_status = ["beyond-execd-jobs/mut_recover_drops_status"] # T7b
mut_exit_before_drain = ["beyond-execd-jobs/mut_exit_before_drain"] # K1
mut_keeper_waits_forever = ["beyond-execd-jobs/mut_keeper_waits_forever"] # K2
mut_keeper_reconnect_resets_written = [
  "beyond-execd-jobs/mut_keeper_reconnect_resets_written",
] # T5b
mut_keeper_exits_unasked = ["beyond-execd-jobs/mut_keeper_exits_unasked"] # K2b
mut_admit_any_peer = ["beyond-execd-jobs/mut_admit_any_peer"] # P1
mut_pty_cap_ignored = ["beyond-execd-jobs/mut_pty_cap_ignored"] # M1
mut_keeper_no_pty_is_500 = ["beyond-execd-jobs/mut_keeper_no_pty_is_500"] # M1
mut_keeper_answer_unchecked = [
  "beyond-execd-jobs/mut_keeper_answer_unchecked",
] # T6a
mut_resize_not_idempotent = [
  "beyond-execd-jobs/mut_resize_not_idempotent",
] # T14
mut_spool_failure_silent = ["beyond-execd-jobs/mut_spool_failure_silent"] # M6
mut_spool_failure_keeps_code = [
  "beyond-execd-jobs/mut_spool_failure_keeps_code",
] # M6
mut_stdin_closes_early = [
  "beyond-execd-jobs/mut_stdin_closes_early",
] # EOF closes the stdin before every byte of the write landed (W4)
# Mutations of `ring` (the crate `execd-ring`, which Verus proves), used only by `src/ring.rs`'s differential
# test's red runs: each removes one guard.
mut_window_before_base = [
  "beyond-execd-ring/mut_window_before_base",
]
mut_seg_boundary_off_by_one = [
  "beyond-execd-ring/mut_seg_boundary_off_by_one",
]
mut_evict_one_extra = [
  "beyond-execd-ring/mut_evict_one_extra",
]
mut_bits_shifted = [
  "beyond-execd-ring/mut_bits_shifted",
]
mut_ranges_unbounded = [
  "beyond-execd-ring/mut_ranges_unbounded",
]
mut_flush_fail_base = [
  "beyond-execd-ring/mut_flush_fail_base",
]
# Mutations of the wire kernel (the crate `execd-wire`, which Verus proves): the one-shot headers test, the
# stream heartbeat test and the job escape test go red under them.
mut_beat_late = [
  "beyond-execd-wire/mut_beat_late",
]
mut_beat_never = [
  "beyond-execd-wire/mut_beat_never",
]
mut_interval_unbounded = [
  "beyond-execd-wire/mut_interval_unbounded",
]
mut_interval_off = [
  "beyond-execd-wire/mut_interval_off",
]
mut_oneshot_never_commits = [
  "beyond-execd-wire/mut_oneshot_never_commits",
]
mut_stray_not_signalled = [
  "beyond-execd-wire/mut_stray_not_signalled",
]

[dependencies]
base64.workspace = true
# The notify timing kernel: when a callback is owed, retried or given up. Every endpoint drives the
# same pure function.
beyond-exec-notify = { path = "../exec-notify", version = "0.1.0" }
# The job table's decisions (`execd::job_kernel`), written inside `verus!` and proven there.
beyond-execd-jobs = { path = "../execd-jobs", version = "0.1.0" }
# The job output ring's decisions (`execd::ring`), written inside `verus!` and proven there.
beyond-execd-ring = { path = "../execd-ring", version = "0.1.0" }
# The heartbeat, the one-shot's first answer and a job's signal scope (`execd::wire_kernel`), written inside `verus!`.
beyond-execd-wire = { path = "../execd-wire", version = "0.1.0" }
bytes.workspace = true
# The jitter draw for a retry's wait (one u32 per failed attempt).
getrandom = { version = "0.3", features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
# `server-auto` serves HTTP/1.1 and prior-knowledge HTTP/2 (h2c) on the one listener.
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
# Process groups, subreaper, the pipe-size query and the socket's user timeout, as safe wrappers:
# the workspace forbids `unsafe_code`.
mimalloc = { version = "0.1.52", default-features = false, optional = true }
nix = { version = "0.31", default-features = false, features = ["fs", "inotify", "net", "process", "signal", "socket", "user"] }
# Where the OS trust store lives (honours SSL_CERT_FILE and SSL_CERT_DIR), to say when it is empty.
openssl-probe = "0.1"
# Job-end callbacks over HTTPS that verify the server and never follow a redirect: rustls with
# `ring` and the OS trust store, as the agent's own client. The provider is installed before the
# client is built (`rustls-no-provider` has no default).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# `FIONREAD`: how many bytes a pipe holds, as a safe call.
rustix = { version = "1", default-features = false, features = ["std", "pty", "termios", "process", "event", "stdio", "net", "fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
# Not `workspace = true`: the workspace holds tokio below 1.54 for pingora (the gateway), a cap an
# embedder of this crate should not inherit. 1.53.3 is the advisory floor (#506); caret, no ceiling.
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true

[dev-dependencies]
# The conformance verifier lives in the agent, the only client of the protocol; the test runs it
# against the real binary. A dev-dependency only: execd itself links neither.
beyond-agent = { path = "../agent" }
beyond-test-support = { path = "../test-support" }
hyper = { version = "1", features = ["client", "http2"] }
memchr = "2"
# The job table's model: `tests/job_model.rs` runs `job_kernel`, the function production calls.
stateright = "0.31.0"
tempfile = "3"

# A/B comparison of execd against the reference endpoint, over HTTP on loopback.
[[bench]]
name = "exec_compare"
harness = false

# P3 of the job-stdin bars: 1 GiB of 128 KiB writes with 8 in flight over one h2c connection.
[[bench]]
name = "jobs_stdin_h2"
harness = false
