# Suspected and confirmed defects. Found by five read-only code audits on 2026-10-01 (billing,
# security, reliability, translation, catalog/contract) against main b10ed8b.
#
# state      suspected   found by reading code; no reproduction yet
#            reproduced  `test` asserts the correct behavior, is #[ignore]d, and FAILS today
#            fixed       `test` passes and is no longer ignored; `fix` names the commit
#            refuted     `test` passes: the behavior was already correct; `note` says why
#            accepted    a written decision keeps the behavior; `test` asserts it as documented
# The gate enforces each state against the test results, so the file cannot drift from the code.

[[defect]]
id = "D01"
severity = "critical"
area = "Security"
title = "Managed /{provider}/… forwards any path and method on the shared pool key"
impact = "Any tenant can list, read and DELETE other tenants' OpenAI files, stored responses, stored completions and batches. Batches, files, fine-tuning and images run unmetered, and every GET poll of a stored response writes a new full billing row."
confidence = "high"
evidence = "proxy.rs:1700-1713, 3086-3111"
claims = ["SEC-1"]
state = "fixed"
test = "a_managed_key_reaches_only_generation_endpoints_on_a_provider_route"
fix = "5fb2c3a"
note = "Fixed directly, without a reproduction step, by the managed endpoint allowlist."

[[defect]]
id = "D02"
severity = "critical"
area = "Security"
title = "Catalog paths accept any HTTP method"
impact = "GET /auto/v1/chat/completions reaches OpenAI as 'list stored chat completions' for the whole pool-key project. The response can also be cached under the caller's key."
confidence = "med-high"
evidence = "proxy.rs:2115-2140; cache.rs key()"
claims = ["SEC-2"]
state = "fixed"
test = "catalog_paths_take_post_only_from_a_managed_key"
fix = "5fb2c3a"
note = "Fixed directly, without a reproduction step: catalog paths are POST-only for managed keys."

