[package]
name = "beyond-ai-verify"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Claim registry, defect ledger and status/gate for the gateway verification suite"
publish = false

[[bin]]
name = "verify"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml = "0.8"

[dev-dependencies]
base64.workspace = true
beyond-ai-providers = { path = "../providers" }
ed25519-dalek = "2.2"
libtest-mimic = "0.8"
# Blocking HTTP for the catalog sweep, with the gateway crate's TLS pins (rustls, no OpenSSL).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde_json.workspace = true

[[test]]
name = "live"
harness = false

[[test]]
name = "reconcile_live"
harness = false

[[test]]
name = "parity_live"
harness = false

[[test]]
name = "catalog_live"
harness = false

[[test]]
name = "tenancy_live"
harness = false

[[test]]
name = "session_live"
harness = false

[lints]
workspace = true
