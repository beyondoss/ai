[package]
name = "beyond-exec-notify"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true
description = "The exec protocol notify notification kernel: when a sandbox calls back about a kept job, as a pure function"

[lib]
name = "exec_notify"
path = "src/lib.rs"

[lints]
workspace = true

# A pure function of (state, event, time) that an endpoint on either side of the repo boundary — the
# reference mock here, a vendor's adapter, the platform's own sandbox service — can link, and that a
# model checker can call exactly as production does. Its one dependency is `vstd`, for the `verus!`
# macro: a normal build erases every proof and spec, and only `cargo verus` (`mise run verify:kernels`)
# checks them. The version is the one the pinned Verus release ships (`.github/scripts/verus.env`).
[dependencies]
vstd = "=0.0.0-2026-11-01-0251"

[package.metadata.verus]
verify = true

[features]
# Mutations of the kernel's decisions: `mise run verify:kernels -- --features mut_x` and the notify model
# (`mise run test:notify-model-mutants`) go red under every one of them. The agent forwards them.
mut_keep_keeps_in_flight = []
mut_change_begins_in_flight = []
mut_answer_settles_all = []
mut_retry_unbounded = []
mut_wake_early = []
mut_stop_is_retried = []
mut_change_not_owed = []
mut_keep_early = []
mut_keep_never = []

[dev-dependencies]
serde_json.workspace = true
