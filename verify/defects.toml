state = "fixed"
test = "a_dead_h2_upstream_is_detected_by_ping"
fix = "c7819c7"
note = "Redesigned (c7819c7); the first fix (47aa861) is superseded. 47aa861 added stream_idle_timeout_secs (120s), a per-read bound on streaming requests that cut any silence past it, which also cut a model thinking silently (hidden reasoning) and needed a read-ahead of every small body to learn stream:true (D80). The owner's rule: no arbitrary values tied to model thinking time; the gateway cannot tell silence-while-thinking from a stuck provider, so it must not cut silence below the client's own timeout, but it can detect a dead peer. Now: read_timeout_secs stays 600 (the OpenAI and Anthropic SDKs' default request timeout), the silence cut and the read-ahead are gone, and a dead upstream is detected by transport liveness: HTTP/2 PING every 15s (pingora's fixed 5s ACK deadline, so within 20s) and TCP keepalive 15s idle + 5s x 3 (30s) on upstream and client sockets, with TCP_USER_TIMEOUT 30s upstream. Tests: a_dead_h2_upstream_is_detected_by_ping (a peer that stops ACKing PINGs with its socket open ends within ~6s at a 1s interval; fails at the 40s client timeout with PING off), an_alive_but_silent_upstream_is_not_cut (8s of silence, several liveness bounds, arrives on H2 and H1), upstream_and_client_sockets_arm_tcp_keepalive (/proc/net/tcp timer 2 on both sockets; a vanished host needs packet loss to simulate)."

