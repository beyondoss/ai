[package]
name = "beyond-ai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Beyond AI gateway — egress L7 proxy to LLM providers"

[lib]
name = "beyond_ai"
path = "src/lib.rs"

[[bin]]
name = "beyond-ai"
path = "src/main.rs"

# Inherit the workspace lint gates (`unsafe_code = "forbid"`, denied panic surface, …). They bind
# every target in this crate — lib, bin, tests, benches — see the rationale in the root manifest.
[lints]
workspace = true

[features]
# The reference `bai_v1`/`bai_v2` minter (`key::mint`). The gateway holds only public keys and
# never mints, so the production binary leaves it out; the dev targets (tests, benches, the dev-key
# example) turn it on through the self dev-dependency below.
mint = []

[dependencies]
# slipstream is published — consume it from crates.io, aliased to `store` so the code's
# `use store::...` is unchanged. No path deps into the `beyond` repo: this crate builds standalone.
store = { package = "beyond-slipstream", version = "0.8.0" }

# The provider table (`route`'s `KNOWN_PROVIDERS`/`AuthScheme`/`Dialect`), shared with `crates/agent`
# so the gateway's proxy routing and the agent's direct routing can never disagree about a provider's
# host, wire format, or auth header. In-workspace and zero-dependency: it adds nothing to the build
# graph or the release image.
providers = { package = "beyond-ai-providers", path = "../providers" }

pingora = { version = "0.9", default-features = false, features = ["rustls"] }
# `drain`: the no-op storage that keeps pingora reading a cancelled stream's upstream (already in
# the build graph through `pingora-proxy`).
pingora-cache = { version = "0.9", default-features = false }
pingora-core = "0.9"
pingora-limits = "0.9"
pingora-proxy = "0.9"

# `ratelimit`'s credential pre-hash (4× SipHash-1-3, on a path charged before verify on every
# request). Already compiled in via `pingora-limits` (its sketch's row hashes) — no build-graph cost.
ahash = "0.8"
arc-swap = "1"
arrayvec = "0.7"
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
ed25519-dalek = "2.2"
figment.workspace = true
getrandom = "0.3"
# Already in the tree via Pingora's H2 client: named only to read an upstream stream error's kind
# (`error_while_proxy` retries a stream the provider refused, D72).
h2 = "0.4"
# The types Pingora's `ServeHttp` trait speaks (`Response<Vec<u8>>`); pin to the same 1.x already in
# the tree via Pingora so the admin app can name them directly.
http = "1"
memchr = "2"
prometheus = "0.13"
# HMAC-SHA256 for tenant-bound Responses ids (`signed_id.rs`). Already in the tree as rustls' crypto
# provider: no build-graph cost.
ring = "0.17"
rustc-hash = "2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde.workspace = true
# `raw_value`: tool arguments keep their exact number text through translation (D127; see
# `translate::Exact`). Adds a type, changes no existing behavior.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
# Global allocator. jemalloc under a memory cgroup uncharges freed pages promptly (MADV_DONTNEED);
# matches `compute/instd`. See the rationale at the `#[global_allocator]` in `main.rs`.
tikv-jemallocator = "0.6"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize = "1"

[dev-dependencies]
# This crate, with the minter: every dev target mints the keys it presents. A dev-dependency only, so
# `cargo build` of the binary never unifies the feature in.
beyond-ai = { path = ".", features = ["mint"] }
# Port read-back for test subprocesses (`ports`): no port is picked free, released and rebound.
beyond-ai-test-support = { path = "../test-support" }
# Bench harnesses. Best tool per job: `divan` for the unit micro-bench (it measures allocations
# natively via AllocProfiler, alongside timing); `criterion` for the e2e macro-bench (`async_tokio`
# drives the round-trips, and its saved-baseline comparison tracks latency/RPS over time).
criterion = { version = "0.5", features = ["async_tokio"] }
divan = "0.1"
http-body-util = "0.1"
# `http2` + hyper-util's `server-auto` let the mock upstream serve H1 *and* H2 on one TLS listener
# (protocol chosen by ALPN), so the concurrency bench can drive the gateway's H2 path. `rcgen` mints a
# throwaway self-signed cert for that listener; `tokio-rustls` terminates TLS in front of hyper.
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
# Property tests (`tests/props_*.rs`): generated requests, responses and streams. Only `std` — no
# fork/timeout runner, so no rusty-fork or tempfile in the build graph.
proptest = { version = "1.10", default-features = false, features = ["std"] }
rcgen = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
# Counts the bytes a test allocates (`Region`), for complexity assertions that must not depend on
# machine load. No dependencies of its own; the `unsafe` is inside the crate, since `unsafe_code` is
# forbidden in this workspace. Used by one `#[global_allocator]` in a test (nextest runs each test in
# its own process, so the count is that test's alone).
stats_alloc = "0.1"
tokio-rustls = "0.26"

[[bench]]
name = "unit"
harness = false

[[bench]]
name = "e2e"
harness = false
