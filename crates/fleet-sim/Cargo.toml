[package]
name = "beyond-ai-fleet-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "Fleet simulator: runs a replica set against a shared filesystem and checks the claims the design makes — not published"

[[bin]]
name = "fleet-sim"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The same doubles the integration tests use: the mock model server, the turn builders, and the
# `bsg_v1` minter that stands in for the edge.
beyond-ai-test-support = { path = "../test-support" }
futures.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
