# Every claim the gateway makes, in one place. `mise run verify:status` computes each claim's
# status from the tests that carry its id (`/// claim: ID`) and their results; nothing here records
# a status by hand. See verify/README.md.
#
#   priority  P0 = what a customer pays for, P1 = expected to work, P2 = operational
#   layer     hermetic (mock upstream) | live (real providers/clients) | both
#   clients   the real clients a live cell must pass through (live/both only)
#   touches   source paths whose change makes a proof stale
#   defects   suspected or confirmed defects that violate this claim (see defects.toml)

# --- Endpoints and SDK compatibility -----------------------------------------------------------
[[claim]]
id = "E1"
priority = "P0"
group = "Endpoints and SDK compatibility"
text = "Chat Completions works for any catalog model, streaming and not"
oracle = "SDK parses; one ai.usage row per call; client usage = ledger"
layer = "both"
clients = [
  "openai-py",
  "openai-node",
  "ai-sdk",
  "langchain",
  "openai-agents",
  "opencode",
  "pi",
  "raw",
]
failover_clients = ["openai-py", "openai-node", "opencode", "pi"]
touches = [
  "crates/gateway/src/route.rs",
  "crates/gateway/src/proxy.rs",
  "crates/gateway/src/translate.rs",
]
defects = ["D63", "D147", "D172"]

