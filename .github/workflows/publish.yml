name: Publish
# Build the runtime images (gateway, agent, execd) for linux/amd64 and linux/arm64 and push them to GHCR.
# Kept separate from ci.yml's `check` job so image publishing only happens once a change has landed
# on `main` (or is tagged) — never on an unmerged PR. On a PR that touches an image's inputs the
# same matrix runs build-only (no login, no push), so an arm64 break is caught before merge.
#
# Each arch builds on a NATIVE runner (no QEMU), pushes by digest, and a merge job stitches the two
# digests into one manifest list under the tags below.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.agent
      - Dockerfile.execd
      - crates/execd/**
      - .github/workflows/publish.yml
permissions:
  contents: read
  packages: write
jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [ai, ai-agent, execd]
        arch: [amd64, arm64]
        include:
          - image: ai
            file: ./Dockerfile
          - image: ai-agent
            file: ./Dockerfile.agent
          - image: execd
            file: ./Dockerfile.execd
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image compiler is the one CI tests with: mise.toml's pin, passed as RUST_VERSION.
      - name: Read the Rust toolchain
        id: rust
        run: echo "version=$(sed -nE 's/^rust = \{ version = "([^"]+)".*/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          build-args: RUST_VERSION=${{ steps.rust.outputs.version }}
          # Push untagged, by digest; the merge job tags the manifest list. On a PR: build only.
          outputs: type=image,name=ghcr.io/beyondoss/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          # Image name last: `digests-*-ai` must not also match the `ai-agent` digests.
          name: digests-${{ matrix.arch }}-${{ matrix.image }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  merge:
    name: Publish ${{ matrix.image }} manifest
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ai, ai-agent, execd]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*-${{ matrix.image }}
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="ghcr.io/beyondoss/${{ matrix.image }}"
          # A release tag also tags the image, so `COPY --from=…/execd:streaming.3` works.
          tag_args=""
          if [ "${{ github.ref_type }}" = tag ]; then tag_args="-t $image:${{ github.ref_name }}"; fi
          docker buildx imagetools create \
            -t "$image:latest" -t "$image:${{ github.sha }}" $tag_args \
            $(printf "$image@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "ghcr.io/beyondoss/${{ matrix.image }}:${{ github.sha }}"
